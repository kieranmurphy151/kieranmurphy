  graph:  { sym: "Gr", name: "Read the graph", time: "45s" },
  read:   { sym: "Ri", name: "Read & infer",   time: "60s" },
  tone:   { sym: "Tt", name: "Tone tap",       time: "15s" },
  angle:  { sym: "As", name: "Angle sprint",   time: "90s" },
  sprint: { sym: "Sp", name: "60s sprint",     time: "60s" },
  essay:  { sym: "Es", name: "Full essay",     time: "30m" }
};

const ITEMS = [
/* ---------- CHEMISTRY ---------- */
{t:"Am", q:"Chlorine-37 has 17 protons. How many neutrons does it have?", o:["20","17","37","54"], x:"Mass number = protons + neutrons, so neutrons = 37 − 17 = 20."},
{t:"Am", q:"Isotopes of the same element have different numbers of:", o:["Neutrons","Protons","Electrons in a neutral atom","Electron shells"], x:"Same element means same number of protons. Isotopes differ only in neutrons, so they have different mass numbers but the same chemistry."},
{t:"Am", f:"rank", q:"Rank by electronegativity, lowest first.", o:["Na","C","N","F"], x:"Electronegativity rises across a period (left to right) and falls down a group. Fluorine is the most electronegative element; sodium, a Group 1 metal, holds electrons weakly."},
{t:"Am", q:"Going down Group 1 (Li → Na → K), atomic radius:", o:["Increases","Decreases","Stays the same","Decreases, then increases"], x:"Each step down adds a new electron shell, so the outer electron sits further from the nucleus."},
{t:"Am", q:"Which ion has the same electron arrangement as neon?", o:["Na⁺","K⁺","Cl⁻","Ca²⁺"], x:"Neon has 10 electrons. Na has 11, so Na⁺ has 10. K⁺, Cl⁻ and Ca²⁺ all have 18, like argon."},
{t:"Am", q:"Magnesium (Group 2) most readily forms which ion?", o:["Mg²⁺","Mg⁺","Mg²⁻","Mg⁻"], x:"Group 2 metals lose their two outer electrons to reach a full shell, giving a 2+ ion."},
{t:"Am", f:"rank", q:"Rank by first ionisation energy, lowest first.", o:["K","Na","Mg","Ne"], x:"Ionisation energy falls down a group (K is lower than Na because its outer electron is further out) and rises across a period (Na → Mg). Noble gases like neon have full shells and the highest values."},
{t:"Am", q:"An element has the electron arrangement 2,8,7. Which group is it in?", o:["Group 17, the halogens","Group 7, a transition metal","Group 3","Group 1"], x:"Seven outer electrons puts it with the halogens (Group 17, sometimes called Group 7 in older tables). 2,8,7 is chlorine."},

{t:"Bo", q:"Which of these molecules is polar?", o:["H₂O","CO₂","CH₄","O₂"], x:"Water is bent, so its two O–H dipoles don't cancel. CO₂ is linear and CH₄ is a symmetric tetrahedron, so their bond dipoles cancel. O₂ has no polar bonds."},
{t:"Bo", q:"What is the shape of methane (CH₄)?", o:["Tetrahedral, about 109.5°","Square planar, 90°","Trigonal planar, 120°","Linear, 180°"], x:"Four bonding pairs and no lone pairs spread as far apart as possible: a tetrahedron."},
{t:"Bo", q:"Ammonia (NH₃) is pyramidal rather than flat because:", o:["A lone pair on nitrogen pushes the three bonds down","Nitrogen forms four bonds","Hydrogen atoms repel more than lone pairs","N–H bonds are ionic"], x:"Nitrogen has three bonding pairs and one lone pair. Lone pairs repel more strongly, squeezing the bond angle to about 107°."},
{t:"Bo", q:"Water has an unusually high boiling point for such a small molecule mainly because of:", o:["Hydrogen bonding between molecules","Strong covalent O–H bonds","Its ionic character","Its high molar mass"], x:"Boiling separates molecules from each other, so intermolecular forces matter, not the bonds inside each molecule. Water forms an extensive hydrogen-bond network."},
{t:"Bo", f:"rank", q:"Rank by boiling point, lowest first.", o:["CH₄","HCl","NH₃","H₂O"], x:"CH₄ has only weak dispersion forces. HCl adds dipole–dipole attraction. NH₃ hydrogen bonds. H₂O hydrogen bonds more extensively (two H atoms and two lone pairs per molecule)."},
{t:"Bo", q:"Solid sodium chloride doesn't conduct electricity, but it does when:", o:["Molten or dissolved in water","Cooled below 0 °C","Ground into a fine powder","Placed under high pressure"], x:"Conduction needs mobile charge carriers. In the solid lattice the ions are fixed; melting or dissolving frees them to move."},
{t:"Bo", f:"odd", q:"Which is the odd one out?", o:["CO₂","NaCl","MgO","KBr"], x:"CO₂ is a covalent molecule (two non-metals). The others are ionic compounds of a metal and a non-metal."},
{t:"Bo", q:"A carbon–carbon double bond consists of:", o:["One sigma bond and one pi bond","Two sigma bonds","Two pi bonds","One ionic and one covalent bond"], x:"The first bond between two atoms is always sigma (head-on overlap). The second is a pi bond (side-on overlap), which stops rotation around the bond."},
{t:"Bo", q:"Longer, unbranched molecules have stronger dispersion forces because they touch over a larger area. Which C₅H₁₂ isomer has the highest boiling point?", o:["Pentane (straight chain)","2-methylbutane (one branch)","2,2-dimethylpropane (compact)","All three are the same"], x:"Same formula and mass, but the straight chain has the most surface contact with its neighbours, so the strongest dispersion forces. The compact, highly branched isomer boils lowest."},

{t:"Mo", q:"What is the molar mass of CO₂? (C = 12, O = 16)", o:["44 g/mol","28 g/mol","32 g/mol","60 g/mol"], x:"12 + (2 × 16) = 44 g/mol."},
{t:"Mo", q:"One mole of any substance contains about how many particles?", o:["6.0 × 10²³","6.0 × 10²³ per gram","1.0 × 10²³","3.0 × 10⁸"], x:"The Avogadro constant is about 6.02 × 10²³ particles per mole. (3.0 × 10⁸ is the speed of light in m/s.)"},
{t:"Mo", q:"How many moles of oxygen atoms are in 1 mol of CaCO₃?", o:["3","1","2","5"], x:"Each CaCO₃ unit contains 3 oxygen atoms, so 1 mol contains 3 mol of O atoms."},
{t:"Mo", q:"Adrenaline 1:1,000 means 1 g in 1,000 mL. What concentration is that?", o:["1 mg/mL","0.1 mg/mL","10 mg/mL","1 g/mL"], x:"1 g = 1,000 mg, so 1,000 mg in 1,000 mL = 1 mg/mL. A 1:10,000 solution is ten times weaker: 0.1 mg/mL."},
{t:"Mo", q:"Normal saline is 0.9% w/v sodium chloride. How much NaCl is in 1 L?", o:["9 g","0.9 g","90 g","0.09 g"], x:"% w/v means grams per 100 mL. 0.9 g per 100 mL × 10 = 9 g per litre."},
{t:"Mo", q:"Balance: _C₃H₈ + _O₂ → _CO₂ + _H₂O. What is the coefficient of O₂?", o:["5","3","4","7"], x:"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. Carbon: 3 = 3. Hydrogen: 8 = 4 × 2. Oxygen: 10 on the left, 6 + 4 = 10 on the right."},
{t:"Mo", q:"Which has the higher osmolarity: 1 mol/L glucose or 1 mol/L NaCl?", o:["NaCl, because it splits into two ions","Glucose, because its molecules are larger","They're the same: both are 1 mol/L","Neither: osmolarity depends only on temperature"], x:"Osmolarity counts dissolved particles. NaCl dissociates into Na⁺ and Cl⁻, giving about 2 osmol/L; glucose stays as one particle."},

{t:"Ga", q:"At constant temperature, the pressure on a gas is tripled. Its volume:", o:["Falls to one third","Triples","Falls to one ninth","Stays the same"], x:"Boyle's law: PV is constant at fixed temperature, so volume is inversely proportional to pressure."},
{t:"Ga", q:"Air is about 21% oxygen. At sea level (about 101 kPa), the partial pressure of oxygen is roughly:", o:["21 kPa","101 kPa","79 kPa","2.1 kPa"], x:"Dalton's law: each gas contributes its fraction of the total. 0.21 × 101 ≈ 21 kPa."},
{t:"Ga", q:"Henry's law: the amount of gas dissolved in a liquid is proportional to its partial pressure. Why does a fast ascent risk decompression sickness?", o:["Dissolved nitrogen comes out of solution as bubbles as pressure drops","Oxygen dissolves faster at low pressure","The lungs absorb extra nitrogen on the way up","Cold water stops gas dissolving"], x:"At depth, high nitrogen partial pressure loads the tissues. Ascend too fast and the pressure falls faster than nitrogen can be off-loaded through the lungs, so it forms bubbles."},
{t:"Ga", q:"Which temperature scale must be used in gas law calculations?", o:["Kelvin","Celsius","Fahrenheit","Any, as long as you're consistent"], x:"Gas laws need absolute temperature, where 0 means no thermal energy. Using °C gives nonsense ratios: going from 10 °C to 20 °C doesn't double anything."},
{t:"Ga", q:"Real gases behave least like ideal gases at:", o:["High pressure and low temperature","Low pressure and high temperature","Room temperature and pressure","Any pressure, if the temperature is high"], x:"The ideal model assumes particles take up no space and don't attract each other. Squeeze them together (high pressure) and slow them down (low temperature) and both assumptions fail."},

{t:"Ab", q:"Compared with a solution at pH 5, a solution at pH 3 has:", o:["100 times more H⁺","2 times more H⁺","100 times less H⁺","2 times less H⁺"], x:"pH is a log scale: each unit is a factor of 10. Two units lower means 10 × 10 = 100 times more H⁺."},
{t:"Ab", q:"Which of these is a weak acid?", o:["Ethanoic acid (CH₃COOH)","Hydrochloric acid (HCl)","Nitric acid (HNO₃)","Sulfuric acid (H₂SO₄)"], x:"Weak acids only partly dissociate in water. Ethanoic (acetic) acid is weak; the other three are strong acids that dissociate almost completely."},
{t:"Ab", q:"A buffer resists changes in pH. It is usually made from:", o:["A weak acid and its conjugate base","A strong acid and a strong base","Pure water and salt","A strong acid and its conjugate base"], x:"The weak acid mops up added OH⁻ and the conjugate base mops up added H⁺, so the pH changes little either way."},
{t:"Ab", q:"Blood pH = 6.1 + log([HCO₃⁻] ÷ dissolved CO₂). If that ratio is 20, and log 20 ≈ 1.3, the pH is about:", o:["7.4","6.1","7.1","8.1"], x:"6.1 + 1.3 = 7.4. A 20:1 bicarbonate-to-CO₂ ratio is normal; anything that changes the ratio moves the pH."},
{t:"Ab", q:"When the pH equals the pKa of a weak acid:", o:["The acid and its conjugate base are present in equal amounts","The acid is fully dissociated","The solution is neutral","There's no conjugate base present"], x:"Henderson–Hasselbalch: pH = pKa + log([A⁻]/[HA]). If pH = pKa, the log term is 0, so [A⁻] = [HA]."},
{t:"Ab", q:"Using CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻, what happens to blood pH during hypoventilation?", o:["It falls, as CO₂ builds up and pushes the equilibrium right","It rises, as less CO₂ is exhaled","It doesn't change","It rises, as bicarbonate falls"], x:"Retained CO₂ drives the equilibrium to the right, producing more H⁺. More H⁺ means a lower pH: respiratory acidosis."},
{t:"Ab", q:"What is the conjugate base of H₂PO₄⁻?", o:["HPO₄²⁻","H₃PO₄","PO₄³⁻","H₂PO₄"], x:"A conjugate base is the acid minus one H⁺. H₂PO₄⁻ minus H⁺ = HPO₄²⁻ (the charge drops by one)."},
{t:"Ab", f:"rank", q:"Rank from lowest pH to highest.", o:["Gastric juice","Black coffee","Blood","Household ammonia"], x:"Gastric juice ≈ pH 1.5–3.5, black coffee ≈ 5, blood ≈ 7.4, household ammonia ≈ 11."},
{t:"Ab", q:"An acid reacts with a base (for example HCl + NaOH). The products are:", o:["A salt and water","Hydrogen gas and a salt","Carbon dioxide and water","An ester and water"], x:"Neutralisation: H⁺ + OH⁻ → H₂O, and the remaining ions form a salt (here NaCl)."},

{t:"Eq", q:"N₂ + 3H₂ ⇌ 2NH₃ (exothermic). Increasing the pressure shifts the equilibrium:", o:["Right, towards fewer gas molecules","Left, towards more gas molecules","Nowhere: pressure has no effect","Right, because the reaction is exothermic"], x:"Le Chatelier: the system relieves added pressure by favouring the side with fewer gas moles. There are 4 on the left and 2 on the right, so it shifts right."},
{t:"Eq", q:"Same reaction (N₂ + 3H₂ ⇌ 2NH₃, exothermic). Raising the temperature:", o:["Shifts it left and lowers K","Shifts it right and raises K","Shifts it left but leaves K unchanged","Has no effect on the yield"], x:"Heating favours the endothermic direction, which is the reverse reaction here. Unlike pressure, temperature changes the value of K itself."},
{t:"Eq", q:"Adding a catalyst to a reaction at equilibrium:", o:["Leaves the equilibrium position unchanged","Shifts it towards products","Shifts it towards reactants","Increases K"], x:"A catalyst lowers the activation energy for the forward and reverse reactions equally. Equilibrium is reached faster, but its position is the same."},
{t:"Eq", q:"Rate = k[A]²[B]. What is the overall order of the reaction?", o:["3","2","1","4"], x:"Add the exponents: 2 (for A) + 1 (for B) = 3."},
{t:"Eq", q:"Hb + 4O₂ ⇌ Hb(O₂)₄. In the lungs, where oxygen partial pressure is high, the equilibrium shifts:", o:["Right, so haemoglobin loads oxygen","Left, so haemoglobin releases oxygen","Right, so haemoglobin releases oxygen","It doesn't shift"], x:"More O₂ pushes the equilibrium towards oxyhaemoglobin. In the tissues, low O₂ shifts it back left and oxygen is released."},
{t:"Eq", q:"Activation energy is:", o:["The minimum energy colliding particles need to react","The energy released by a reaction","The energy difference between reactants and products","The energy needed to melt the reactants"], x:"Only collisions with at least this energy succeed. Catalysts provide a route with a lower activation energy."},
{t:"Eq", q:"A reaction has K = 10¹⁰. At equilibrium the mixture is:", o:["Mostly products","Mostly reactants","Equal amounts of each","Impossible to predict from K"], x:"K = [products]/[reactants]. A huge K means products dominate; a tiny K (like 10⁻¹⁰) means reactants dominate."},
{t:"Eq", q:"Why does refrigerating food slow spoilage?", o:["Fewer collisions have enough energy to react","Cold raises the activation energy","Cold shifts equilibria towards reactants","Bacteria can't exist below 10 °C"], x:"At lower temperatures particles move more slowly, so fewer collisions have energy above the activation energy. Reactions, including microbial ones, slow down."},

{t:"En", q:"An exothermic reaction has:", o:["Negative ΔH, releasing heat","Positive ΔH, releasing heat","Negative ΔH, absorbing heat","Positive ΔH, absorbing heat"], x:"Exothermic means heat leaves the system, so the system's enthalpy falls: ΔH < 0."},
{t:"En", q:"ΔG = ΔH − TΔS. A reaction with ΔH > 0 and ΔS > 0 is spontaneous:", o:["Only at high temperatures","At all temperatures","Only at low temperatures","Never"], x:"Spontaneous needs ΔG < 0. With a positive ΔH, TΔS has to outweigh it, which happens when T is large."},
{t:"En", q:"Which process has a positive entropy change (ΔS > 0)?", o:["Ice melting","Water freezing","Steam condensing","Two gas molecules combining into one"], x:"Entropy is roughly how spread out matter and energy are. Solid → liquid increases freedom of movement. The other three all become more ordered."},
{t:"En", q:"Breaking bonds is ___, and making bonds is ___.", o:["Endothermic; exothermic","Exothermic; endothermic","Exothermic; exothermic","Endothermic; endothermic"], x:"You must put energy in to pull atoms apart; energy is released when new bonds form. ΔH is the balance between the two."},
{t:"En", q:"An instant cold pack gets cold when activated because the dissolving process:", o:["Is endothermic, absorbing heat from its surroundings","Is exothermic, releasing heat","Lowers the activation energy","Produces a gas that expands"], x:"The salt dissolving takes in heat from the pack and whatever it touches, so the surroundings cool."},
{t:"En", q:"Water's specific heat capacity is high (about 4.2 J/(g·°C)). This means water:", o:["Takes a lot of energy to change temperature","Heats up very quickly","Has a low boiling point","Conducts heat very well"], x:"Each gram needs 4.2 J per degree. It's why the sea warms and cools slowly, and why cold water drains body heat so effectively."},

{t:"Rx", q:"Oxidation is:", o:["Loss of electrons","Gain of electrons","Gain of hydrogen","Loss of oxygen"], x:"OIL RIG: Oxidation Is Loss, Reduction Is Gain (of electrons)."},
{t:"Rx", q:"What is the oxidation state of manganese in permanganate, MnO₄⁻?", o:["+7","+4","+2","−1"], x:"Each O is −2, so 4 × (−2) = −8. The ion's overall charge is −1, so Mn − 8 = −1, giving Mn = +7."},
{t:"Rx", q:"In Zn + Cu²⁺ → Zn²⁺ + Cu, which species is reduced?", o:["Cu²⁺","Zn","Zn²⁺","Cu"], x:"Cu²⁺ gains two electrons to become Cu: gain = reduction. Zinc loses two electrons, so it's oxidised (and acts as the reducing agent)."},
{t:"Rx", q:"What is the oxidation state of sulfur in H₂SO₄?", o:["+6","+4","−2","+2"], x:"H: 2 × (+1) = +2. O: 4 × (−2) = −8. The molecule is neutral, so S = +6."},
{t:"Rx", q:"In a galvanic (battery) cell, oxidation happens at the:", o:["Anode","Cathode","Salt bridge","Both electrodes equally"], x:"“An Ox, Red Cat”: oxidation at the anode, reduction at the cathode."},

{t:"Fg", q:"An –OH group attached to a saturated carbon makes the molecule an:", o:["Alcohol","Aldehyde","Ether","Carboxylic acid"], x:"R–OH is an alcohol (for example ethanol). If the –OH sits on a C=O carbon, it's part of a carboxylic acid instead."},
{t:"Fg", q:"R–COOH is a:", o:["Carboxylic acid","Ester","Ketone","Alcohol"], x:"–COOH (a C=O and an –OH on the same carbon) is the carboxylic acid group, found in ethanoic acid and in every amino acid."},
{t:"Fg", q:"A C=O group with a carbon on each side (R–CO–R′) is a:", o:["Ketone","Aldehyde","Ester","Amide"], x:"Ketones have the carbonyl in the middle of a chain (propanone is acetone). Aldehydes have it at the end, with an H attached."},
{t:"Fg", q:"R–COO–R′ is an:", o:["Ester","Ether","Acid anhydride","Amine"], x:"Esters form from an acid and an alcohol. Many smell fruity; aspirin and fats contain ester groups."},
{t:"Fg", q:"What is the name of CH₃CH₂CH₂OH?", o:["Propan-1-ol","Propanal","Propanone","Propanoic acid"], x:"Three carbons = prop-. The –OH group (alcohol, suffix -ol) is on carbon 1."},
{t:"Fg", q:"R–CO–NH–R′ is an:", o:["Amide","Amine","Ester","Imine"], x:"An amide has the nitrogen attached directly to the carbonyl carbon. The peptide bonds in proteins are amide bonds."},
{t:"Fg", f:"odd", q:"Which is the odd one out?", o:["Ethanal","Ethanol","Methanol","Propan-2-ol"], x:"Ethanal is an aldehyde (-al). The other three are alcohols (-ol)."},
{t:"Fg", q:"Aspirin contains an ester group and a carboxylic acid group. Which one makes it an acid?", o:["The carboxylic acid","The ester","The benzene ring","Neither"], x:"The –COOH group can donate H⁺. The ester group can't."},
{t:"Fg", q:"Amines (R–NH₂) usually act as:", o:["Weak bases","Strong acids","Weak acids","Oxidising agents"], x:"The lone pair on nitrogen can accept an H⁺, so amines are weak bases, like ammonia."},
{t:"Fg", f:"rank", q:"Rank by number of carbon atoms, fewest first.", o:["Methanol","Ethanoic acid","Propanone","Butane"], x:"Meth- = 1, eth- = 2, prop- = 3, but- = 4. The prefix gives the carbon count whatever the functional group."},

{t:"Is", q:"Structural isomers have:", o:["The same molecular formula, atoms connected differently","Different molecular formulas","The same structure but different masses","Mirror-image shapes"], x:"Butane and methylpropane are both C₄H₁₀: one is a straight chain, the other branched."},
{t:"Is", q:"A chiral carbon (a stereocentre) has:", o:["Four different groups attached","A double bond","Two identical groups attached","Exactly three groups attached"], x:"With four different groups, the carbon has two mirror-image arrangements that can't be superimposed."},
{t:"Is", q:"Enantiomers are:", o:["Non-superimposable mirror images","Molecules with different formulas","Cis and trans forms of an alkene","Identical molecules drawn differently"], x:"Like left and right hands: same atoms, same connections, but mirror images that can't be overlaid."},
{t:"Is", q:"Which can show cis/trans (E/Z) isomerism?", o:["But-2-ene","But-1-ene","Ethene","Propene"], x:"Each carbon of the C=C needs two different groups. In but-2-ene each has an H and a CH₃. The others have a CH₂= end with two identical H atoms."},
{t:"Is", q:"Two enantiomers of a drug have identical melting points but can differ in:", o:["How they interact with biological receptors","Molecular formula","Molar mass","Boiling point"], x:"Their physical properties are identical, but receptors and enzymes are themselves chiral, so each enantiomer can bind differently. They also rotate polarised light in opposite directions."},
{t:"Is", q:"How many structural isomers have the formula C₄H₁₀?", o:["2","1","3","4"], x:"Butane (straight chain) and methylpropane (branched). There's no other way to arrange four carbons."},
{t:"Is", q:"A racemic mixture:", o:["Has equal amounts of two enantiomers and doesn't rotate polarised light","Contains only one enantiomer","Contains structural isomers","Rotates polarised light strongly"], x:"The equal and opposite rotations cancel, so the mixture is optically inactive."},

{t:"Or", q:"An alcohol reacts with a carboxylic acid (acid catalyst). The products are:", o:["An ester and water","An ether and water","An aldehyde and hydrogen","An amide and water"], x:"Esterification is a condensation reaction: two molecules join and lose a water molecule."},
{t:"Or", q:"Hydrolysis of an ester produces:", o:["A carboxylic acid and an alcohol","An aldehyde and a ketone","An alkene and water","Two alcohols"], x:"Hydrolysis is the reverse of esterification: water splits the ester back into its acid and alcohol."},
{t:"Or", q:"In the liver, ethanol is oxidised first to:", o:["Ethanal (acetaldehyde)","Ethanoic acid","Ethene","Ethane"], x:"A primary alcohol oxidises first to an aldehyde, then to a carboxylic acid: ethanol → ethanal → ethanoic acid."},
{t:"Or", q:"Tertiary alcohols resist oxidation because:", o:["The carbon carrying the –OH has no hydrogen to lose","They have no –OH group","They're too large to react","They're already carboxylic acids"], x:"Oxidising an alcohol removes an H from the –OH carbon. A tertiary carbon is bonded to three other carbons, so it has none."},
{t:"Or", q:"Bromine water loses its colour when shaken with an alkene because:", o:["Bromine adds across the C=C double bond","The alkene is oxidised to CO₂","Bromine substitutes for hydrogen","The alkene dissolves the bromine"], x:"An addition reaction: the double bond opens and a bromine atom bonds to each carbon. It's the standard test for unsaturation."},
{t:"Or", q:"Two amino acids join by a condensation reaction, forming:", o:["A peptide bond and water","An ester bond and water","A glycosidic bond and water","A hydrogen bond"], x:"The –COOH of one and the –NH₂ of the other combine, releasing H₂O and forming an amide (peptide) link."},
{t:"Or", q:"A nucleophile is:", o:["An electron-pair donor attracted to positive centres","An electron-pair acceptor","A positively charged ion","A radical with one unpaired electron"], x:"Nucleophile means “nucleus-loving”. It uses a lone pair to attack a δ+ atom, such as the carbon in C–Br."},
{t:"Or", q:"SN1 reactions go through a carbocation intermediate. Which halide reacts fastest by SN1?", o:["A tertiary halide","A primary halide","A methyl halide","All react at the same rate"], x:"Alkyl groups stabilise the positive charge, so tertiary carbocations form most easily."},
{t:"Or", q:"Saponification (soap-making) is:", o:["Hydrolysis of fats (esters) with a strong base","Oxidation of alcohols","Addition of hydrogen to alkenes","Polymerisation of amino acids"], x:"Base breaks the ester links in triglycerides, giving glycerol and fatty acid salts, which are soap."},

/* ---------- BIOLOGY ---------- */
{t:"Ce", q:"Most ATP in a human cell is made in the:", o:["Mitochondria","Nucleus","Ribosomes","Golgi apparatus"], x:"The final stages of aerobic respiration (the Krebs cycle and electron transport chain) happen in the mitochondria."},
{t:"Ce", q:"Which organelle modifies and packages proteins for secretion?", o:["Golgi apparatus","Lysosome","Smooth ER","Nucleolus"], x:"Proteins made on the rough ER pass to the Golgi, which modifies, sorts and packages them into vesicles."},
{t:"Ce", q:"A red blood cell is placed in pure water. It will:", o:["Swell and may burst","Shrink","Stay the same","Divide"], x:"Water moves by osmosis into the cell, where the solute concentration is higher. With no cell wall, the cell swells and can burst (lyse)."},
{t:"Ce", q:"Glucose enters most body cells by:", o:["Facilitated diffusion through carrier proteins","Simple diffusion through the bilayer","Osmosis","Endocytosis"], x:"Glucose is too large and polar to cross the lipid bilayer directly, so it uses GLUT carrier proteins, moving down its concentration gradient without ATP."},
{t:"Ce", q:"Each cycle of the Na⁺/K⁺ pump moves:", o:["3 Na⁺ out and 2 K⁺ in, using ATP","2 Na⁺ out and 3 K⁺ in, using ATP","3 Na⁺ in and 2 K⁺ out, without ATP","Equal Na⁺ and K⁺ both ways"], x:"Active transport against both gradients, powered by ATP. The net export of positive charge helps maintain the resting membrane potential."},
{t:"Ce", q:"Which crosses a phospholipid bilayer most easily by simple diffusion?", o:["O₂","Na⁺","Glucose","A protein"], x:"Small, non-polar molecules slip through the hydrophobic core. Ions, sugars and proteins need channels, carriers or vesicles."},
{t:"Ce", q:"Prokaryotic cells (bacteria) lack:", o:["A nucleus","Ribosomes","A cell membrane","DNA"], x:"Prokaryotes have DNA, ribosomes and a membrane, but no nucleus or other membrane-bound organelles."},
{t:"Ce", q:"As a spherical cell grows larger, its surface-area-to-volume ratio:", o:["Decreases","Increases","Stays the same","Doubles"], x:"Surface area scales with r², volume with r³, so SA:V ∝ 1/r. Big cells struggle to exchange enough material across their surface."},
{t:"Ce", q:"5% dextrose is roughly isotonic in the bag, but in the body it acts like free water. Why?", o:["Cells take up and use the glucose, leaving water behind","Glucose can't cross capillary walls","Dextrose draws water out of cells","The bag is actually hypertonic"], x:"Once the glucose is used, what's left is water, which spreads across all body compartments, including into cells."},

{t:"Bm", q:"Proteins are polymers made from:", o:["Amino acids","Nucleotides","Monosaccharides","Fatty acids"], x:"Amino acids are linked by peptide bonds. Nucleotides make nucleic acids; monosaccharides make polysaccharides."},
{t:"Bm", q:"Enzymes speed up reactions by:", o:["Lowering the activation energy","Raising the temperature","Changing the equilibrium position","Supplying energy to the reaction"], x:"Enzymes offer a route with a lower energy barrier. They don't change ΔG or where the equilibrium lies."},
{t:"Bm", q:"A competitive inhibitor affects Km and Vmax how?", o:["Km increases, Vmax unchanged","Km unchanged, Vmax decreases","Both decrease","Both increase"], x:"It competes for the active site, so more substrate is needed to reach half the maximum rate (higher Km). Enough substrate outcompetes it, so Vmax is still reached."},
{t:"Bm", q:"A non-competitive inhibitor affects Km and Vmax how?", o:["Vmax decreases, Km unchanged","Km increases, Vmax unchanged","Both increase","Neither changes"], x:"It binds elsewhere on the enzyme and effectively takes enzyme molecules out of action, so Vmax falls. The enzymes still working bind substrate normally."},
{t:"Bm", q:"Very high body temperature can impair enzymes mainly because heat:", o:["Disrupts their 3D shape, including the active site","Breaks their peptide bonds into amino acids","Speeds them up too much","Turns them into lipids"], x:"Denaturation breaks the weaker bonds (hydrogen bonds, ionic interactions) holding the folded shape. The amino acid sequence stays intact, but the active site no longer fits."},
{t:"Bm", q:"Glycogen is a storage polymer of:", o:["Glucose","Amino acids","Fatty acids","Fructose"], x:"Glycogen is a highly branched chain of glucose, stored mainly in the liver and skeletal muscle."},
{t:"Bm", q:"A triglyceride is made of:", o:["Glycerol and three fatty acids","Three glucose molecules","Glycerol and three amino acids","A phosphate head and two fatty acids"], x:"Three ester links join three fatty acids to one glycerol. Phospholipids have two fatty acids plus a phosphate group."},
{t:"Bm", q:"A protein's primary structure is:", o:["Its sequence of amino acids","Its overall 3D fold","Its α-helices and β-sheets","How several chains fit together"], x:"Primary = sequence. Secondary = local helices and sheets. Tertiary = overall 3D fold. Quaternary = several chains, like haemoglobin's four subunits."},
{t:"Bm", q:"Compared with DNA, RNA contains:", o:["Ribose and uracil","Deoxyribose and uracil","Ribose and thymine","Deoxyribose and thymine"], x:"RNA uses ribose sugar and uracil in place of thymine. It's usually single-stranded."},
{t:"Bm", q:"Saturated fatty acids:", o:["Have no C=C double bonds","Have several C=C double bonds","Are always liquid at room temperature","Contain nitrogen"], x:"Saturated means full of hydrogen, with no double bonds. Their straight chains pack tightly, so saturated fats tend to be solid at room temperature."},

{t:"Ge", q:"Two carriers (Aa × Aa) of an autosomal recessive condition. What's the chance a child is affected?", o:["1/4","1/2","3/4","1/3"], x:"Punnett square: AA, Aa, Aa, aa. Only aa is affected: 1 in 4."},
{t:"Ge", q:"Same parents (Aa × Aa). Their child is unaffected. What's the chance the child is a carrier?", o:["2/3","1/2","1/4","3/4"], x:"Classic trap. Knowing the child is unaffected rules out aa, leaving AA, Aa, Aa. Two of those three are carriers."},
{t:"Ge", q:"X-linked recessive condition. Affected father, non-carrier mother. What's the chance a son is affected?", o:["0","1/2","1/4","1"], x:"Sons get their X from their mother and their Y from their father. The mother has no faulty X, so no son is affected."},
{t:"Ge", q:"Same couple (affected father, non-carrier mother, X-linked recessive). What's the chance a daughter is a carrier?", o:["1 (every daughter)","1/2","1/4","0"], x:"Every daughter gets her father's only X, which carries the allele, plus a normal X from her mother. So every daughter is a carrier."},
{t:"Ge", q:"A trait appears in every generation, and every affected person has an affected parent. The most likely pattern is:", o:["Autosomal dominant","Autosomal recessive","X-linked recessive","Mitochondrial"], x:"Dominant traits don't skip generations: one copy is enough, so an affected child needs an affected parent. Recessive traits often skip generations."},
{t:"Ge", q:"AaBb × AaBb, with the genes assorting independently. What fraction of offspring show both dominant traits?", o:["9/16","3/16","1/16","3/4"], x:"Each gene alone: 3/4 show the dominant trait. They're independent, so multiply: 3/4 × 3/4 = 9/16."},
{t:"Ge", q:"Parents with blood groups A (genotype IᴬI°) and B (genotype IᴮI°). What's the chance their child is group O?", o:["1/4","0","1/2","3/4"], x:"Each parent passes I° half the time. Group O needs I° from both: 1/2 × 1/2 = 1/4."},
{t:"Ge", q:"Meiosis produces:", o:["Four genetically different haploid cells","Two identical diploid cells","Four identical diploid cells","Two different haploid cells"], x:"Two divisions halve the chromosome number. Crossing over and independent assortment make each gamete different."},
{t:"Ge", q:"Blood group AB, where both Iᴬ and Iᴮ are fully expressed, is an example of:", o:["Codominance","Incomplete dominance","Recessive inheritance","Sex linkage"], x:"Both alleles show in the phenotype (A and B antigens). Incomplete dominance would give a blended in-between instead."},

{t:"Dn", q:"Transcription makes:", o:["mRNA from a DNA template, in the nucleus","Protein from mRNA, at the ribosome","DNA from DNA, before cell division","tRNA from protein"], x:"Transcription copies a gene into mRNA. Translation then reads the mRNA at a ribosome to build a protein."},
{t:"Dn", q:"Translation takes place at the:", o:["Ribosome","Nucleus","Golgi apparatus","Mitochondrial membrane"], x:"Ribosomes read mRNA codons and join the amino acids that tRNAs bring."},
{t:"Dn", q:"A DNA template strand reads 3′-TAC-5′. What is the mRNA codon?", o:["5′-AUG-3′","5′-ATG-3′","3′-UAC-5′","5′-GUA-3′"], x:"Pair each base: T→A, A→U (RNA uses U), C→G. The strands run antiparallel, so 3′-TAC-5′ gives 5′-AUG-3′, the start codon."},
{t:"Dn", q:"With 4 bases read in groups of three, how many different codons are possible?", o:["64","12","20","81"], x:"4 × 4 × 4 = 64. That's more than the 20 amino acids, so most amino acids have several codons."},
{t:"Dn", q:"A point mutation turns an amino acid codon into a stop codon. This is a:", o:["Nonsense mutation","Silent mutation","Missense mutation","Frameshift mutation"], x:"Nonsense = premature stop, usually giving a shortened, non-working protein. Missense swaps one amino acid; silent changes none."},
{t:"Dn", q:"A frameshift mutation is caused by:", o:["Inserting or deleting a number of bases that isn't a multiple of 3","Swapping one base for another","Duplicating a whole gene","Inserting exactly three bases"], x:"Shifting the reading frame changes every codon downstream. Adding or losing three bases keeps the frame."},
{t:"Dn", q:"DNA replication is “semi-conservative”. This means:", o:["Each new double helix has one original strand and one new strand","Half the DNA is copied and half isn't","The original double helix stays intact","Each new helix is made of two new strands"], x:"The helix unzips and each strand acts as a template, so every daughter molecule keeps one parent strand."},
{t:"Dn", q:"In DNA, adenine pairs with ___, joined by ___ hydrogen bonds.", o:["Thymine; two","Guanine; three","Cytosine; three","Uracil; two"], x:"A–T pairs share two hydrogen bonds; G–C pairs share three, which makes GC-rich DNA harder to separate."},
{t:"Dn", q:"Introns are:", o:["Non-coding sequences spliced out of pre-mRNA","Sequences that code for protein","Start codons","Sections of tRNA"], x:"Introns intervene; exons are expressed. Splicing removes introns before the mRNA leaves the nucleus."},

{t:"Me", q:"Overall, aerobic respiration converts:", o:["Glucose + oxygen → carbon dioxide + water (+ ATP)","Carbon dioxide + water → glucose + oxygen","Glucose → lactate (+ ATP)","Glucose → ethanol + carbon dioxide"], x:"C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, releasing energy captured as ATP. The reverse is photosynthesis."},
{t:"Me", q:"Glycolysis takes place in the ___ and produces ___.", o:["Cytoplasm; pyruvate","Mitochondria; pyruvate","Cytoplasm; carbon dioxide","Nucleus; lactate"], x:"Glycolysis splits glucose into two pyruvate in the cytoplasm, netting 2 ATP. It doesn't need oxygen."},
{t:"Me", q:"Short of oxygen, muscle cells turn pyruvate into lactate. The main reason is to:", o:["Regenerate NAD⁺ so glycolysis can continue","Make extra ATP from lactate","Remove carbon dioxide","Store glucose"], x:"Glycolysis needs NAD⁺. Making lactate recycles NADH back to NAD⁺, keeping glycolysis's small ATP supply going."},
{t:"Me", q:"Most of the ATP from aerobic respiration is made by:", o:["Oxidative phosphorylation on the inner mitochondrial membrane","Glycolysis in the cytoplasm","The Krebs cycle directly","Lactate fermentation"], x:"The electron transport chain pumps protons and ATP synthase uses the gradient. This makes around 30 ATP per glucose, far more than any other stage."},
{t:"Me", q:"Cyanide is lethal because it blocks:", o:["Cytochrome c oxidase, so cells can't use oxygen","Glucose uptake into cells","Haemoglobin binding oxygen in the lungs","Glycolysis"], x:"It inhibits complex IV of the electron transport chain. Blood stays well oxygenated, but cells can't use the oxygen, so they switch to anaerobic metabolism and lactate rises."},
{t:"Me", q:"During prolonged fasting, or when insulin is absent, the liver makes ketone bodies from:", o:["Fatty acids","Amino acids only","Glycogen","Lactate"], x:"With little glucose available, fat is broken down and the liver turns fatty acids into ketones. In diabetic ketoacidosis this runs out of control."},
{t:"Me", q:"The final electron acceptor in the electron transport chain is:", o:["Oxygen","NAD⁺","Carbon dioxide","Pyruvate"], x:"Oxygen accepts the electrons and combines with H⁺ to form water. Without O₂ the chain backs up and stops."},

{t:"Ph", q:"Cardiac output equals:", o:["Heart rate × stroke volume","Stroke volume ÷ heart rate","Mean arterial pressure × heart rate","Heart rate + stroke volume"], x:"For example, 70 beats/min × 70 mL = 4.9 L/min."},
{t:"Ph", q:"Baroreceptors detect a sudden fall in blood pressure. The reflex response is:", o:["Faster heart rate and vasoconstriction","Slower heart rate and vasodilation","Faster heart rate and vasodilation","No change until pressure falls further"], x:"Less stretch means less baroreceptor firing, so sympathetic output rises and parasympathetic output falls. Heart rate, contractility and vascular resistance go up."},
{t:"Ph", q:"Most carbon dioxide in the blood is carried as:", o:["Bicarbonate ions","Dissolved CO₂","Carbaminohaemoglobin","Carbonic acid"], x:"About 70% travels as HCO₃⁻, made in red cells by carbonic anhydrase. Roughly 20% binds to haemoglobin and 10% stays dissolved."},
{t:"Ph", q:"ADH (vasopressin) acts on the collecting duct to:", o:["Increase water reabsorption, concentrating the urine","Increase sodium excretion","Decrease water reabsorption","Increase glucose reabsorption"], x:"ADH inserts aquaporins into collecting duct cells, so more water returns to the blood and urine volume falls."},
{t:"Ph", q:"Insulin lowers blood glucose mainly by:", o:["Increasing glucose uptake into muscle and fat cells","Increasing glucose release from the liver","Increasing glucose loss in urine","Blocking glucose absorption in the gut"], x:"Insulin moves GLUT4 transporters to the cell surface in muscle and fat, and promotes glycogen storage in the liver."},
{t:"Ph", q:"A neurone's resting membrane potential (about −70 mV) is mainly due to:", o:["K⁺ leaking out through open potassium channels","Na⁺ flowing into the cell","Cl⁻ being pumped out","Ca²⁺ entering the cell"], x:"At rest the membrane is far more permeable to K⁺. As positive K⁺ leaks out, the inside becomes negative. The Na⁺/K⁺ pump maintains the gradients."},
{t:"Ph", q:"Myelin speeds up nerve conduction by:", o:["Making the impulse jump between nodes of Ranvier","Making the axon thicker","Releasing more neurotransmitter","Raising the resting potential"], x:"Myelin insulates the axon, so depolarisation only happens at the gaps (nodes). This saltatory conduction is much faster."},
{t:"Ph", q:"Pulmonary surfactant:", o:["Reduces surface tension, stopping alveoli collapsing","Increases surface tension in the alveoli","Kills inhaled bacteria","Carries oxygen across the membrane"], x:"Surface tension tends to collapse small alveoli. Surfactant reduces it, which is why premature babies who lack it can develop respiratory distress."},
{t:"Ph", q:"Capillary hydrostatic pressure pushes fluid out; plasma oncotic pressure pulls it back in. Why does low albumin (e.g. liver failure) cause oedema?", o:["Oncotic pressure falls, so less fluid is drawn back in","Hydrostatic pressure falls","The capillaries become impermeable","Albumin blocks lymph drainage"], x:"Albumin is the main source of oncotic pressure. With less pulling fluid back, it accumulates in the tissues."},
{t:"Ph", q:"In the nephron, most filtered sodium and water is reabsorbed in the:", o:["Proximal convoluted tubule","Loop of Henle","Distal convoluted tubule","Collecting duct"], x:"Around two-thirds is reabsorbed in the proximal tubule. Later segments fine-tune what's left under hormonal control (aldosterone, ADH)."},

{t:"Ev", q:"Natural selection acts directly on:", o:["Phenotypes","Genotypes only","Individual genes in isolation","Characteristics acquired during life"], x:"Selection acts on what an organism is and does (its phenotype). Allele frequencies change as a result."},
{t:"Ev", q:"Hardy–Weinberg: a recessive allele has frequency q = 0.1. Roughly what proportion of people are carriers (2pq)?", o:["0.18","0.10","0.01","0.81"], x:"p = 1 − 0.1 = 0.9. 2pq = 2 × 0.9 × 0.1 = 0.18, about 1 in 5.5. Affected (q²) = 0.01."},
{t:"Ev", q:"A recessive condition affects 1 in 2,500 people. Using Hardy–Weinberg, about how common are carriers?", o:["About 1 in 25","About 1 in 50","About 1 in 2,500","About 1 in 5"], x:"q² = 1/2,500, so q = 1/50 = 0.02. Carriers ≈ 2pq ≈ 2 × 0.02 = 0.04, or 1 in 25. These are roughly the figures for cystic fibrosis in Ireland."},
{t:"Ev", q:"Antibiotic resistance spreads through a bacterial population mainly because:", o:["Bacteria that already carry resistance survive treatment and multiply","Bacteria choose to become resistant when exposed","The antibiotic causes the resistance mutation","The patient's immune system becomes resistant"], x:"The variation exists before treatment. The antibiotic kills susceptible bacteria, leaving resistant ones to reproduce: selection, not a deliberate change."},
{t:"Ev", q:"Genetic drift has the biggest effect in:", o:["Small populations","Large populations","Populations under strong selection","Populations with high mutation rates"], x:"Chance events (who happens to breed) swing allele frequencies more when there are fewer individuals. Founder effects and bottlenecks are examples."},
{t:"Ev", q:"Hardy–Weinberg equilibrium assumes all of these EXCEPT:", o:["Strong natural selection","Random mating","A very large population","No migration"], x:"Equilibrium needs no selection, no mutation, no migration, random mating and a large population. Selection would change allele frequencies."},

{t:"Im", q:"Antibodies are produced by:", o:["Plasma cells (from B lymphocytes)","T helper cells","Neutrophils","Red blood cells"], x:"Activated B cells become plasma cells, which secrete antibodies."},
{t:"Im", q:"Vaccines protect mainly by:", o:["Creating memory cells for a faster, stronger response later","Killing pathogens directly","Supplying ready-made antibodies for life","Boosting red blood cell production"], x:"The vaccine primes memory B and T cells. A real infection then triggers a rapid secondary response."},
{t:"Im", q:"Antibiotics don't work against viruses because viruses:", o:["Lack the bacterial structures antibiotics target, such as cell walls","Are too small to see","Live outside cells","Are made only of lipid"], x:"Antibiotics target bacterial cell walls, ribosomes and enzymes. Viruses use the host cell's machinery, so there's nothing for the antibiotic to hit."},
{t:"Im", q:"Penicillin works by:", o:["Blocking bacterial cell wall synthesis","Blocking bacterial ribosomes","Dissolving the cell membrane","Blocking DNA replication in human cells"], x:"Penicillin stops cross-links forming in peptidoglycan. The weakened walls burst as the bacteria grow."},
{t:"Im", q:"Which is an example of passive immunity?", o:["A baby receiving antibodies across the placenta","Recovering from chickenpox","Getting a measles vaccine","Making memory cells after an infection"], x:"Passive immunity means receiving ready-made antibodies (also antivenom or immunoglobulin). It works immediately but fades, because no memory cells are made."},
{t:"Im", q:"Cytotoxic (CD8⁺) T cells recognise antigens presented on:", o:["MHC class I, found on nearly all nucleated cells","MHC class II, found only on antigen-presenting cells","Antibodies","Red blood cell surfaces"], x:"Infected or cancerous cells display internal peptides on MHC I, flagging themselves for destruction. Helper (CD4⁺) T cells look at MHC II."},
{t:"Im", q:"Gram-positive bacteria stain purple because they have:", o:["A thick peptidoglycan wall that holds the crystal violet stain","An outer lipid membrane","No cell wall","A protein capsule"], x:"The thick wall traps the dye. Gram-negative bacteria have a thin wall plus an outer membrane, lose the dye and stain pink."},

/* ---------- PHYSICS ---------- */
{t:"Mt", q:"An object moves at constant velocity. The net force on it is:", o:["Zero","In the direction of motion","Opposite to the motion","Equal to its weight"], x:"Newton's first law: with no net force, velocity stays constant. Forces may act on it, but they balance."},
{t:"Mt", q:"Momentum is:", o:["Mass × velocity, conserved when no external force acts","Mass × acceleration","Force × distance","½ × mass × velocity², always conserved"], x:"p = mv. Total momentum is conserved in collisions. Kinetic energy is only conserved in perfectly elastic collisions."},
{t:"Mt", q:"On a velocity–time graph, the gradient gives ___ and the area under the line gives ___.", o:["Acceleration; displacement","Displacement; acceleration","Speed; time","Force; work"], x:"Gradient = change in velocity ÷ time = acceleration. Area = velocity × time = distance travelled."},
{t:"Mt", q:"An object is dropped (ignore air resistance, g = 10 m/s²). After 2 s, its speed is:", o:["20 m/s","10 m/s","40 m/s","5 m/s"], x:"v = u + at = 0 + 10 × 2 = 20 m/s. By then it has fallen ½gt² = 20 m."},
{t:"Mt", q:"A lifeboat's propeller pushes water backwards. By Newton's third law:", o:["The water pushes the boat forwards with an equal force","The boat pushes the water forwards","The forces cancel, so the boat can't move","The water pushes back with a smaller force"], x:"Forces come in equal and opposite pairs acting on different objects. They don't cancel, because they act on different bodies."},
{t:"Mt", q:"A person has a mass of 80 kg on Earth (g ≈ 10 N/kg). On the Moon (g ≈ 1.6 N/kg), their mass is:", o:["80 kg","13 kg","128 kg","800 N"], x:"Mass is the amount of matter and doesn't change. Weight does: about 800 N on Earth, about 128 N on the Moon."},

{t:"Wk", q:"Work done equals:", o:["Force × distance moved in the direction of the force","Force ÷ time","Mass × velocity","Power × distance"], x:"W = Fd. Carrying a box horizontally at constant speed does (ideally) no work against gravity, because the force is vertical and the movement horizontal."},
{t:"Wk", q:"Power is:", o:["The rate of doing work (J/s, or watts)","The total energy used","Force × time","Work × time"], x:"P = W/t. The same lift done faster takes more power but the same energy."},
{t:"Wk", q:"A ball is dropped from 5 m (no air resistance, g = 10 m/s²). It hits the ground at:", o:["10 m/s","5 m/s","50 m/s","100 m/s"], x:"mgh = ½mv², so v = √(2gh) = √(2 × 10 × 5) = √100 = 10 m/s. The mass cancels out."},
{t:"Wk", q:"A motor is 25% efficient and takes in 400 J. How much useful work does it do?", o:["100 J","300 J","25 J","1,600 J"], x:"Useful output = 25% × 400 = 100 J. The other 300 J is wasted, mostly as heat."},
{t:"Wk", q:"When a car brakes to a stop, its kinetic energy mostly becomes:", o:["Heat in the brakes","Potential energy","Chemical energy in the fuel","Sound"], x:"Friction in the brakes turns kinetic energy into thermal energy. Regenerative braking in EVs recovers some of it as electrical energy instead."},

{t:"Fl", q:"Why does a narrow stiletto heel damage a floor more than a flat shoe on the same person?", o:["The same force on a smaller area gives higher pressure","The stiletto makes the person heavier","Stilettos exert less force","Pressure doesn't depend on area"], x:"P = F/A. The weight is the same, but concentrated on a tiny area the pressure can be over a hundred times higher."},
{t:"Fl", q:"In sea water, each extra 10 m of depth adds about:", o:["1 atmosphere (1 bar)","0.1 atmosphere","10 atmospheres","2 atmospheres"], x:"So at 10 m the absolute pressure is about 2 bar (1 from the air, 1 from the water), and at 30 m about 4 bar."},
{t:"Fl", q:"Archimedes' principle: the buoyant force on a submerged object equals:", o:["The weight of fluid it displaces","Its own weight","Its volume","The fluid pressure at the surface"], x:"An object floats when it can displace its own weight of fluid before it's fully submerged."},
{t:"Fl", q:"Fluid flows from a wide section of pipe into a narrow section. In the narrow section it:", o:["Speeds up","Slows down","Keeps the same speed","Stops"], x:"Continuity: A₁v₁ = A₂v₂. The same volume per second must pass through a smaller area, so it has to move faster."},
{t:"Fl", q:"Bernoulli's principle: where a fluid flows faster, its pressure is:", o:["Lower","Higher","The same","Zero"], x:"Energy is conserved along the flow. Faster flow means more kinetic energy and less pressure. This is how a Venturi mask draws in air."},
{t:"Fl", q:"A diver needs more lead weight in the sea than in a freshwater quarry. Why?", o:["Sea water is denser, so it gives more buoyancy","Sea water is colder","Fresh water holds more dissolved air","Waves push divers up"], x:"Salt water (about 1,025 kg/m³) is denser than fresh water (1,000 kg/m³). The same displaced volume weighs more, so the buoyant force is greater."},

{t:"El", q:"Resistors of 4 Ω and 6 Ω connected in series have a total resistance of:", o:["10 Ω","2.4 Ω","24 Ω","2 Ω"], x:"In series, resistances add: 4 + 6 = 10 Ω."},
{t:"El", q:"Two 6 Ω resistors connected in parallel have a total resistance of:", o:["3 Ω","12 Ω","6 Ω","36 Ω"], x:"1/R = 1/6 + 1/6 = 2/6, so R = 3 Ω. A parallel combination is always lower than the smallest single resistor."},
{t:"El", q:"Electric current is:", o:["The rate of flow of charge","The energy per unit charge","The resistance per metre","The power per second"], x:"I = Q/t, measured in amperes (coulombs per second). Energy per unit charge is voltage."},
{t:"El", q:"A 2 kW heater runs for 3 hours. How much energy does it use?", o:["6 kWh","6 kW","0.67 kWh","1.5 kWh"], x:"Energy = power × time = 2 kW × 3 h = 6 kWh (6 units on an electricity bill)."},
{t:"El", q:"Why are household appliances wired in parallel rather than in series?", o:["Each gets the full supply voltage and works independently","It uses less wire","It increases total resistance","Series circuits can't carry AC"], x:"In parallel, every branch has the full voltage, and switching one appliance off doesn't break the others' circuits."},

{t:"Wv", q:"Sound is:", o:["A longitudinal wave that needs a medium","A transverse wave that can cross a vacuum","An electromagnetic wave","A longitudinal wave that's fastest in a vacuum"], x:"Sound is pressure vibrations passed between particles, so it can't cross a vacuum. It travels faster in water and solids than in air."},
{t:"Wv", q:"Light passes from air into water and slows down. It bends:", o:["Towards the normal","Away from the normal","Not at all","Back the way it came"], x:"Slowing down bends light towards the normal (the line perpendicular to the surface). This is refraction."},
{t:"Wv", q:"Ultrasound imaging works because sound waves:", o:["Reflect at boundaries between tissues with different properties","Are absorbed only by bone","Ionise tissue to make an image","Travel at the speed of light"], x:"Echoes return from boundaries where acoustic impedance changes. The return time tells the machine how deep each boundary is."},
{t:"Wv", q:"An ambulance siren approaches you, then passes. You hear the pitch:", o:["Higher as it approaches, lower as it moves away","Lower as it approaches, higher as it moves away","The same throughout","Higher throughout"], x:"The Doppler effect: waves bunch up ahead of a moving source (higher frequency) and stretch out behind it."},
{t:"Wv", q:"Short-sightedness (myopia) is corrected with a:", o:["Diverging (concave) lens","Converging (convex) lens","Flat mirror","Prism"], x:"In myopia the eye focuses light in front of the retina. A diverging lens spreads the light first, pushing the focus back onto the retina."},
{t:"Wv", q:"Total internal reflection (used in fibre-optic endoscopes) happens when light:", o:["Goes from a denser to a less dense medium above the critical angle","Goes from air into glass","Hits a mirror at 90°","Goes from a less dense to a denser medium"], x:"Above the critical angle no light escapes the denser material, so it bounces along the fibre."},

{t:"Nu", q:"An alpha particle is:", o:["A helium nucleus (2 protons, 2 neutrons)","An electron","A high-energy photon","A single neutron"], x:"Alpha is heavy and highly ionising but is stopped by paper or skin. It's most dangerous when the source is swallowed or inhaled."},
{t:"Nu", q:"In beta-minus decay:", o:["A neutron becomes a proton and an electron is emitted","A proton becomes a neutron","The nucleus loses two protons and two neutrons","Only a gamma ray is emitted"], x:"The atomic number goes up by 1 and the mass number stays the same."},
{t:"Nu", q:"Gamma radiation:", o:["Is electromagnetic and changes neither mass number nor atomic number","Is a stream of electrons","Is stopped by a sheet of paper","Raises the atomic number by 1"], x:"Gamma is a high-energy photon, very penetrating, given off as the nucleus drops to a lower energy state."},
{t:"Nu", q:"Carbon-14 decays to nitrogen-14. Which type of decay is this?", o:["Beta-minus","Alpha","Gamma","Positron (beta-plus)"], x:"The mass number stays at 14 and the atomic number rises from 6 to 7, so a neutron has become a proton."},
{t:"Nu", q:"Radon-222 (atomic number 86) undergoes alpha decay. The product has:", o:["Mass number 218, atomic number 84","Mass number 222, atomic number 87","Mass number 218, atomic number 86","Mass number 220, atomic number 84"], x:"Alpha removes 2 protons and 2 neutrons: mass number 222 − 4 = 218, atomic number 86 − 2 = 84 (polonium)."},

/* ---------- MATHS ---------- */
{t:"Re", q:"Rearrange PV = nRT to make T the subject.", o:["T = PV / (nR)","T = nR / (PV)","T = PVnR","T = P / (VnR)"], x:"Divide both sides by nR."},
{t:"Re", q:"Rearrange v = fλ to make λ the subject.", o:["λ = v / f","λ = f / v","λ = vf","λ = v − f"], x:"Divide both sides by f."},
{t:"Re", q:"Rearrange E = ½mv² to make v the subject.", o:["v = √(2E / m)","v = 2E / m","v = √(E / 2m)","v = √(Em / 2)"], x:"Multiply by 2: 2E = mv². Divide by m: v² = 2E/m. Then take the square root."},
{t:"Re", q:"Rearrange C₁V₁ = C₂V₂ to find V₂.", o:["V₂ = C₁V₁ / C₂","V₂ = C₂ / (C₁V₁)","V₂ = C₁C₂ / V₁","V₂ = C₁V₁C₂"], x:"Divide both sides by C₂."},
{t:"Re", q:"pH = pKa + log([A⁻]/[HA]). Make the ratio [A⁻]/[HA] the subject.", o:["[A⁻]/[HA] = 10^(pH − pKa)","[A⁻]/[HA] = pH − pKa","[A⁻]/[HA] = log(pH − pKa)","[A⁻]/[HA] = 10^(pKa − pH)"], x:"Subtract pKa: log(ratio) = pH − pKa. Undo the log by raising 10 to the power of both sides."},
{t:"Re", q:"A pendulum: T = 2π√(L/g). Make g the subject.", o:["g = 4π²L / T²","g = 2πL / T","g = 4π²T² / L","g = L / (4π²T²)"], x:"Divide by 2π: T/2π = √(L/g). Square: T²/4π² = L/g. Rearrange: g = 4π²L/T²."},
{t:"Re", q:"Lens equation: 1/f = 1/u + 1/v. Make v the subject.", o:["v = uf / (u − f)","v = f − u","v = uf / (u + f)","v = (u − f) / uf"], x:"1/v = 1/f − 1/u = (u − f)/(uf). Flip both sides: v = uf/(u − f)."},
{t:"Re", q:"P = I²R. Make I the subject.", o:["I = √(P / R)","I = P / R²","I = √(PR)","I = P² / R"], x:"Divide by R: I² = P/R. Then take the square root."},
{t:"Re", q:"Q = mcΔT. Make ΔT the subject.", o:["ΔT = Q / (mc)","ΔT = Qmc","ΔT = mc / Q","ΔT = Q − mc"], x:"Divide both sides by mc."},
{t:"Re", q:"An object falls from rest: s = ½at². Make t the subject.", o:["t = √(2s / a)","t = 2s / a","t = √(s / 2a)","t = √(2a / s)"], x:"Multiply by 2: 2s = at². Divide by a: t² = 2s/a. Then take the square root."},
{t:"Re", q:"Which combination of base units equals the joule?", o:["kg·m²·s⁻²","kg·m·s⁻²","kg·m²·s⁻¹","kg·m·s⁻¹"], x:"J = N·m, and N = kg·m·s⁻². So J = kg·m²·s⁻². (kg·m·s⁻² is the newton; kg·m·s⁻¹ is the unit of momentum.)"},
{t:"Re", q:"Rate = k[A]², with rate in mol L⁻¹ s⁻¹ and [A] in mol L⁻¹. What are the units of k?", o:["L mol⁻¹ s⁻¹","mol L⁻¹ s⁻¹","s⁻¹","mol² L⁻² s⁻¹"], x:"k = rate ÷ [A]² = (mol L⁻¹ s⁻¹) ÷ (mol² L⁻²) = L mol⁻¹ s⁻¹."},
{t:"Re", q:"Pressure is force per unit area. What is the pascal in base units?", o:["kg·m⁻¹·s⁻²","kg·m·s⁻²","kg·m²·s⁻²","N·m"], x:"Pa = N/m² = (kg·m·s⁻²) ÷ m² = kg·m⁻¹·s⁻²."},
{t:"Re", q:"A cylinder's volume is V = πr²h. If you know V and h, r equals:", o:["√(V / (πh))","V / (πh)","√(Vπh)","(V / πh)²"], x:"Divide by πh: r² = V/(πh). Then take the square root."},

/* ---------- FIXED GRAPH ITEMS ---------- */
{t:"Ph", f:"graph", fig:{type:"odc"}, q:"Curve A is the normal oxygen–haemoglobin dissociation curve. Curve B is shifted to the right. Which condition could produce curve B?", o:["Fever","Hypothermia","Alkalosis","Carbon monoxide poisoning"], x:"A right shift lowers haemoglobin's affinity for oxygen, so more is released to the tissues. Causes include raised temperature, acidosis, raised CO₂ and raised 2,3-BPG. Hypothermia, alkalosis and carbon monoxide all shift the curve left."},
{t:"Bm", f:"graph", fig:{type:"mm"}, q:"Curve A shows an enzyme alone. Curve B shows the same enzyme with an inhibitor added. Which type of inhibition fits curve B best?", o:["Competitive","Non-competitive","No inhibition: the curves are the same","Uncompetitive, which lowers both Km and Vmax equally"], x:"Both curves level off at the same maximum rate (Vmax), but B needs more substrate to get halfway there (higher Km). That's the signature of competitive inhibition: enough substrate outcompetes the inhibitor."},

/* ---------- HUMANITIES: TONE TAPS ---------- */
{t:"To", f:"tone", p:"Of course the meeting about reducing meetings ran forty minutes over.", q:"The tone is best described as:", o:["Wry","Elegiac","Reverent","Apprehensive"], x:"“Of course” signals amused, knowing irony about a predictable absurdity. Wry is dry, understated humour."},
{t:"To", f:"tone", p:"We sold the house in March. I still drive past it some evenings, slower than I need to.", q:"The tone is best described as:", o:["Wistful","Indignant","Didactic","Sanguine"], x:"Driving past “slower than I need to” suggests quiet longing for something lost. Wistful is gentle, regretful longing."},
{t:"To", f:"tone", p:"That a city this wealthy lets people sleep in its doorways is not a misfortune; it is a decision.", q:"The tone is best described as:", o:["Indignant","Whimsical","Deferential","Nostalgic"], x:"Recasting a “misfortune” as a “decision” assigns blame. Indignant is anger at something perceived as unjust."},
{t:"To", f:"tone", p:"The committee's report, all four hundred pages of it, bravely concludes that further research is needed.", q:"The tone is best described as:", o:["Sardonic","Earnest","Laudatory","Apprehensive"], x:"“Bravely” is used ironically: a timid conclusion after 400 pages. Sardonic is grimly mocking."},
{t:"To", f:"tone", p:"There's no point arguing with the tide. You wait, and when it turns, you go.", q:"The tone is best described as:", o:["Pragmatic","Jubilant","Scathing","Incredulous"], x:"Plain, practical acceptance of how things work, with no complaint and no celebration. Pragmatic is focused on what works."},
{t:"To", f:"tone", p:"You expect me to believe the dog ate the entire filing cabinet?", q:"The tone is best described as:", o:["Incredulous","Reverent","Elegiac","Conciliatory"], x:"The rhetorical question rejects an absurd claim. Incredulous means unwilling or unable to believe."},
{t:"To", f:"tone", p:"I understand why you were upset, and I think we both want the same thing here.", q:"The tone is best described as:", o:["Conciliatory","Contemptuous","Whimsical","Elegiac"], x:"Acknowledging the other person's feelings and stressing shared goals aims to calm a conflict. Conciliatory means seeking to placate."},
{t:"To", f:"tone", p:"He was the last of the old harbour pilots, and with him went a knowledge of this coast that no chart will ever hold.", q:"The tone is best described as:", o:["Elegiac","Sardonic","Flippant","Apprehensive"], x:"Mourning a person and the irreplaceable knowledge lost with him. Elegiac is mournful, like an elegy."},
{t:"To", f:"tone", p:"Imagine, if you will, a cat elected to the county council on a platform of longer naps for all.", q:"The tone is best described as:", o:["Whimsical","Indignant","Solemn","Rueful"], x:"A fanciful, playful scenario with no serious point. Whimsical is light and fanciful."},
{t:"To", f:"tone", p:"Every result in this trial points the same way, and I'm confident the treatment will be approved.", q:"The tone is best described as:", o:["Sanguine","Rueful","Contemptuous","Wistful"], x:"Confident and optimistic about the outcome. Sanguine means cheerfully optimistic."},
{t:"To", f:"tone", p:"I should have listened when she told me to bring a coat. I did not, and I am still damp.", q:"The tone is best described as:", o:["Rueful","Laudatory","Menacing","Reverent"], x:"Admitting a small mistake with self-deprecating regret. Rueful is regretful, often with a touch of humour."},
{t:"To", f:"tone", p:"His so-called reforms have achieved the remarkable feat of making a bad system slower.", q:"The tone is best described as:", o:["Scathing","Deferential","Nostalgic","Ambivalent"], x:"“So-called” and the mock-praise of a “remarkable feat” are harsh criticism. Scathing is severely critical."},
{t:"To", f:"tone", p:"Part of me wants the promotion; part of me wants my evenings back.", q:"The tone is best described as:", o:["Ambivalent","Triumphant","Contemptuous","Didactic"], x:"Two competing wishes held at once. Ambivalent means having mixed feelings."},
{t:"To", f:"tone", p:"Remember: wash your hands before and after every patient, without exception.", q:"The tone is best described as:", o:["Didactic","Wistful","Sardonic","Bemused"], x:"Direct instruction intended to teach. Didactic means instructive."},
{t:"To", f:"tone", p:"The cathedral swallowed every sound; even the tourists lowered their voices, as if the stone itself were listening.", q:"The tone is best described as:", o:["Reverent","Flippant","Indignant","Sanguine"], x:"Hushed awe at the place, with sacred-feeling imagery. Reverent means deeply respectful."},
{t:"To", f:"tone", p:"Nobody tells you that the hardest part of a night shift is the drive home as the sun comes up.", q:"The tone is best described as:", o:["Weary","Exuberant","Scornful","Ceremonious"], x:"Tired, worn-down reflection on the end of a long shift. Weary means exhausted."},
{t:"To", f:"tone", p:"They said nobody could sail it single-handed. Watch me.", q:"The tone is best described as:", o:["Defiant","Melancholy","Deferential","Detached"], x:"Openly challenging what others said was impossible. Defiant means boldly resisting."},
{t:"To", f:"tone", p:"Patient: male, 54. Time of arrival: 03:12. Observations recorded at five-minute intervals.", q:"The tone is best described as:", o:["Detached","Impassioned","Sentimental","Mocking"], x:"Bare, factual record with no emotion. Detached means impersonal and objective."},
{t:"To", f:"tone", p:"Oh, wonderful. Another software update that moves every button I'd finally learned to find.", q:"The tone is best described as:", o:["Sarcastic","Grateful","Reverent","Apprehensive"], x:"“Wonderful” means the opposite of what it says. Sarcasm is pointed irony meant to criticise."},
{t:"To", f:"tone", p:"Back then the summers lasted forever, and the only clock we obeyed was the ice-cream van.", q:"The tone is best described as:", o:["Nostalgic","Indignant","Clinical","Menacing"], x:"A fond, slightly idealised look back at childhood. Nostalgic means sentimental longing for the past."},
{t:"To", f:"tone", p:"I can't shake the feeling that something on this boat is about to fail, and I don't know what.", q:"The tone is best described as:", o:["Apprehensive","Smug","Jovial","Reverent"], x:"Uneasy anticipation of something going wrong. Apprehensive means anxious about the future."},
{t:"To", f:"tone", p:"Of all the things the council could have done with the money, it chose, inevitably, the one that photographs best.", q:"The tone is best described as:", o:["Cynical","Sincere","Elegiac","Awestruck"], x:"“Inevitably” assumes the worst about motives: appearance over substance. Cynical means distrustful of others' motives."},
{t:"To", f:"tone", p:"She took the diagnosis with a quiet dignity that put the rest of us, fussing in the corridor, to shame.", q:"The tone is best described as:", o:["Admiring","Contemptuous","Flippant","Anxious"], x:"The writer praises her composure and contrasts it with their own fussing. Admiring is warm respect."},

/* ---------- HUMANITIES: READ & INFER ---------- */
{t:"In", f:"read", p:"My grandmother kept every letter she was ever sent, tied in bundles with kitchen string and filed by year. When she died we found 1962 missing. Not misplaced: the string for that year was there, neatly knotted around nothing. My mother said she must have burned them. She said it the way you mention weather, and then she changed the subject, and none of us asked again.", q:"The final sentence most strongly suggests that:", o:["The family preferred not to look into what 1962 held","The mother had burned the letters herself","The grandmother was careless with her letters","The 1962 letters were unimportant"], x:"“The way you mention weather”, changing the subject and nobody asking again all point to deliberate avoidance. The careful filing contradicts carelessness, and nothing says who burned them."},
{t:"Mi", f:"read", p:"We talk about “screen time” as though every minute were the same. But an hour video-calling a grandparent and an hour scrolling advertisements share nothing except the glass they pass through. Counting minutes is easy, which is why we do it. Asking what those minutes were for is harder, and it is the only question that matters.", q:"The writer's main point is that:", o:["What screen time is used for matters more than how long it lasts","Screen time should be strictly limited","Video calls are the only worthwhile use of screens","Measuring screen time is impossible"], x:"The passage contrasts duration (“counting minutes”) with purpose (“what those minutes were for”) and calls purpose “the only question that matters”."},
{t:"Po", f:"read", p:"The tide goes out like someone leaving a party —\nnot all at once, but in small apologies,\na glass set down here, a coat collected there,\nuntil the room is sand and you are standing in it.", q:"The simile mainly emphasises the tide's:", o:["Gradual, almost reluctant withdrawal","Violence and unpredictability","Celebratory mood","Cold indifference to people"], x:"“Not all at once, but in small apologies” presents the leaving as slow and polite, almost reluctant. Nothing in it is violent or cold."},
{t:"In", f:"read", p:"DOCTOR: The scan is clear.\nMAN: Clear.\nDOCTOR: There's nothing there. Nothing at all.\nMAN: (pause) So I've spent three months — (stops) Right. Good. That's good.\nDOCTOR: You don't seem pleased.\nMAN: I'm pleased. I'm just trying to remember what I used to worry about before.", q:"The man's final line suggests that:", o:["Months of worry have changed him in ways relief can't undo at once","He doesn't believe the doctor","He's disappointed the scan was clear","He has always been an anxious person"], x:"He says he's pleased, but worry has filled his life so completely that he can't recall life before it. The relief doesn't instantly erase the experience."},
{t:"Lo", f:"read", p:"Since the town installed speed cameras on the coast road, recorded accidents there have fallen by a third. The cameras have clearly made the road safer and should be installed on every road in the county.", q:"The argument assumes that:", o:["Nothing else that changed in the same period explains the fall","Speed cameras are popular with drivers","The coast road was the most dangerous road in the county","Accidents weren't recorded before the cameras"], x:"To credit the cameras, the writer must assume no other cause (resurfacing, lighter traffic, a new junction). It also assumes what worked on one road will work on all."},
{t:"Lo", f:"read", p:"A survey found that people who swim in the sea all year round report fewer colds than people who don't. Cold-water swimming, the article concludes, strengthens the immune system.", q:"Which, if true, most weakens the conclusion?", o:["People already in good health are more likely to take up year-round sea swimming","Some year-round swimmers wear wetsuits","The survey was carried out in winter","Colds are caused by viruses"], x:"If healthier people choose to swim, the swimming may not cause their health: the link could run the other way. That's the classic correlation-versus-causation weakness."},
{t:"In", f:"read", p:"The new manager arrived with a binder of initiatives and a ready smile. Within a month the break room had gone quiet in the particular way rooms go quiet when everyone in them is composing an email they will not send.", q:"The description of the break room suggests the staff are:", o:["Privately frustrated but unwilling to say so","Too busy to talk","Happy with the changes","Planning to resign together"], x:"“Composing an email they will not send” captures complaints people draft in their heads but never voice."},
{t:"Ca", f:"read", p:"[Cartoon] Two goldfish in a small bowl. One says to the other: “I've heard there's an ocean out there, but I've never seen any evidence of it.” Behind them, through the window, waves are clearly visible.", q:"The cartoon mainly satirises:", o:["Dismissing whatever lies beyond your own experience as unproven","The cruelty of keeping fish in bowls","The dangers of the ocean","Science's demand for evidence"], x:"The evidence is right behind the fish, but they don't look. The joke is about narrow perspective, not about evidence as such."},
{t:"Ca", f:"read", p:"[Cartoon] A crowded hospital corridor, patients on trolleys end to end. At the front, a man in a suit holds giant scissors beside a ribbon and a sign: “Official opening: new hospital signage”.", q:"The cartoonist's attitude toward the official is best described as:", o:["Mocking his priorities, which favour appearance over substance","Admiring his efforts to improve hospitals","Neutral and documentary","Sympathetic to how hard hospitals are to manage"], x:"A ceremony for new signs in front of overflowing trolleys highlights misplaced priorities. The juxtaposition is satire."},
{t:"To", f:"read", p:"I am, everyone agrees, the calmest person in any crisis. When the kitchen caught fire last spring I remained entirely composed, apart from the screaming, which was really more of a procedural announcement.", q:"The humour depends mainly on:", o:["The gap between the narrator's self-image and their behaviour","The danger of kitchen fires","The narrator's modesty","How other people reacted"], x:"The narrator claims calm but admits screaming, then reframes it absurdly. That's an unreliable narrator played for comedy."},
{t:"Mi", f:"read", p:"It's tempting to think the first aid kit is the most important thing on a lifeboat. It isn't. The most important thing is the crew member who has practised, in the dark and the cold, until opening that kit is something their hands can do without asking their head.", q:"The writer's purpose is to argue that:", o:["Practised skill matters more than equipment","Lifeboats need better first aid kits","First aid kits are unnecessary","Crews should train only at night"], x:"The passage sets up the kit as the obvious answer, rejects it, and puts practised, automatic skill in its place."},
{t:"Po", f:"read", p:"My father's hands were maps I never learned to read:\nthe burn from the forge, the white seam of a fishing hook,\na nail that grew back crooked.\nI have his hands now. They are blank as a new chart,\nand I am afraid of what I'll draw.", q:"The final lines suggest the speaker feels:", o:["Uncertain about the life still to be written on their own hands","Resentful of their father's hard work","Proud of having the same scars","Indifferent to their father's past"], x:"The speaker has the same hands but unmarked (“blank as a new chart”), and fears what their own life will mark on them."},
{t:"Ca", f:"read", p:"Survey of 200 commuters — main reason for their choice of transport\nCar users: convenience 62%, journey time 30%, cost 8%\nBus users: cost 55%, journey time 30%, convenience 15%\nCyclists: health 50%, cost 30%, convenience 20%", q:"Which statement is best supported by the table?", o:["Cost was a more common main reason among bus users than among car users","Most of the 200 commuters cycle for their health","Bus users care nothing about convenience","Car users spend the most on transport"], x:"The table gives percentages within each group, so you can compare reasons across groups (cost: 55% of bus users vs 8% of car users). It doesn't say how many people are in each group or what anyone spends."},
{t:"Po", f:"read", p:"The town had been dying for years, but politely, the way old towns do: a shop here, a post office there, each closure announced with a handwritten sign thanking customers for their loyalty.", q:"Describing the town as dying “politely” suggests its decline was:", o:["Gradual and quietly accepted rather than dramatic","Caused by rude newcomers","Sudden and shocking","Reversed by loyal customers"], x:"Closures arrive one at a time with courteous notes. Decline happens gently, with no protest or drama."},
{t:"Mi", f:"read", p:"Critics say that paying people to give blood would attract donors who lie about their health. Perhaps. But we already trust people to tell the truth about their health when they aren't being paid, and a short screening interview protects us either way.", q:"The writer responds to the critics mainly by:", o:["Pointing out that the risk already exists and is managed by screening","Denying that anyone would lie","Arguing that payment would improve donors' health","Agreeing that paid donation shouldn't happen"], x:"“Perhaps” concedes the risk is possible, then argues it isn't new and that screening already handles it."},
{t:"Lo", f:"read", p:"All the boats that launched before noon returned safely. The Morning Star returned safely.", q:"What can be concluded?", o:["Nothing certain: the Morning Star may have launched after noon","The Morning Star launched before noon","Only boats launched before noon returned safely","The Morning Star launched after noon"], x:"The rule only covers boats launched before noon. Returning safely doesn't prove when the Morning Star launched. Assuming it does is called affirming the consequent."},
{t:"Lo", f:"read", p:"If the swell is over two metres, the surf session is cancelled. The session was not cancelled.", q:"What follows?", o:["The swell was not over two metres","The swell was exactly two metres","The swell was over two metres","Nothing can be concluded"], x:"If A then B; not B; so not A. This is valid reasoning (modus tollens). It doesn't tell you the exact height, just that it wasn't over two metres."},
{t:"In", f:"read", p:"Mrs Keane had complained about the hedge for eleven years, and when the new owners finally cut it down she stood at her window for a long time, looking at the view she had wanted, and found she missed the hedge.", q:"The passage suggests that:", o:["What she wanted turned out to be less satisfying than she expected","Her complaints were entirely justified","The new owners ignored her","She wanted to sell her house"], x:"She finally gets the view she campaigned for and finds she misses the hedge. Getting what you wanted doesn't feel the way you imagined."},
{t:"To", f:"read", p:"There is a certain kind of expert who has never been wrong, chiefly because they have never committed to anything that could be checked. Their forecasts are masterpieces of the conditional: the economy may slow, unless it doesn't; risks remain on both sides.", q:"The writer's attitude toward this kind of expert is:", o:["Mocking","Admiring","Neutral","Fearful"], x:"“Masterpieces of the conditional” is mock-praise. The point is that their caution makes them useless."},
{t:"Po", f:"read", p:"Not the storm — I can sleep through the storm.\nIt's the hour after,\nthe one bright gull,\nthe boat not yet back.", q:"What does the speaker find most unsettling?", o:["The uncertain wait once the danger seems to have passed","The noise of the storm","The gull's cry","Being unable to sleep in general"], x:"The speaker dismisses the storm itself. The dread is in the calm afterwards, while the boat still hasn't returned."},

/* ---------- WRITING QUICK CHECKS ---------- */
{t:"An", q:"Theme: courage. Which is the strongest thesis for a GAMSAT essay?", o:["Courage is less about dramatic moments than about the unglamorous preparation that makes them possible.","Courage is important in many areas of life.","In this essay I will discuss courage.","Everyone has courage inside them."], x:"A strong thesis takes a specific, arguable position you can develop. The others are vague, mere signposting, or a sweeping claim with nowhere to go."},
{t:"An", q:"Theme: technology and connection. Which thesis is most arguable?", o:["Technology hasn't made us lonelier; it has made it easier to mistake contact for connection.","Technology has changed the world a lot.","Some people like technology and some don't.","Phones are bad."], x:"It draws a precise distinction (contact vs connection) you can defend with examples. The others are descriptive, sit on the fence or just assert."},
{t:"Ex", q:"Which example best supports the claim “Rules are the memory of mistakes other people made”?", o:["Aviation checklists, many introduced after investigations into specific crashes","“There are many rules in society today.”","A school rule about wearing uniform","“Rules can be annoying but are often necessary.”"], x:"A strong example is specific and shows the claim in action. Checklists that came out of crash investigations show exactly how a past mistake becomes a rule."},
{t:"Ex", q:"You're arguing that “safety rules are written in blood”. Which example is most specific and persuasive?", o:["Lifejacket and kill-cord rules that followed fatal boating accidents","People have always been careful","Everyone knows safety is important","Some accidents happen every year"], x:"Specific, real cases do the persuading. General statements just repeat the claim."},
{t:"Pl", q:"GAMSAT Written Communication is marked on two criteria. They are:", o:["Thought and content; organisation and expression","Spelling; handwriting","Length; number of quotes used","Grammar; vocabulary range"], x:"From ACER: “Thought and content” (the quality of your ideas and argument) and “Organisation and expression” (structure, fluency and control of language). Each essay is marked independently by three markers."},
{t:"Pl", q:"You have 30 minutes for one essay. Which split is most sensible?", o:["About 5 minutes planning, 22 writing, 3 checking","No planning, 30 minutes writing","15 minutes planning, 15 writing","10 writing, 10 planning, 10 checking"], x:"A short plan gives you a clear thesis and structure, most of the time goes on writing, and a quick check catches errors. Long planning leaves too little time to develop the argument."},
{t:"Pl", q:"Why include a counter-argument in your essay?", o:["It shows you've weighed other views and lets you sharpen your own","It makes the essay longer","Markers require exactly one","It lets you avoid taking a side"], x:"Acknowledging and answering the strongest objection shows depth of thought. You still need to come back to a clear position."},
{t:"Pl", q:"A good GAMSAT essay conclusion should:", o:["Draw the argument together and show why it matters","Introduce a brand-new main argument","Repeat the introduction word for word","List every example again"], x:"End by pulling your points into a final, perhaps sharper, position. A new major argument in the conclusion looks unplanned."},
{t:"Pl", q:"The four statements in a Written Communication task are best treated as:", o:["Prompts on a shared theme: respond to one, several, or the theme itself","A list you must quote and discuss in order","Questions with a single correct answer","Facts to agree with"], x:"You choose your angle. Markers look at the quality of your thinking and expression, not whether you covered every statement."}

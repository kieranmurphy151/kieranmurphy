const THEMES = [
{id:"progress", task:1, theme:"Progress", s:["Every advance in technology is also an advance in what can go wrong.","Progress should be measured by who we stop leaving behind, not by what we build.","Nostalgia is just progress seen from the wrong end.","We rarely notice progress; we only notice its absence."], angles:["Qualify: progress is real but uneven. Judge it by who shares in it, such as medical advances versus who can actually access them.","Agree: every new capability brings new ways to fail. Antibiotics led to resistance; social media to misinformation at scale.","Reframe: the best progress becomes invisible (clean water, vaccines), so we undervalue it until it fails."], ex:["Antibiotics and resistance","Rural broadband and who gets left out","Measles returning when vaccine uptake falls","Smartphones and attention"]},
{id:"conformity", task:2, theme:"Conformity", s:["To fit in, you must first agree to become smaller.","Rules are the memory of mistakes other people made.","The crowd is rarely wrong about where the danger is.","Someone who never conforms is as predictable as someone who always does."], angles:["Defend conformity: shared protocols carry hard-won knowledge, as checklists and clinical guidelines do.","Challenge it: progress depends on people willing to break ranks, such as whistle-blowers and dissenting scientists.","Synthesis: the real skill is judgement, conforming on method and questioning on purpose."], ex:["Clinical practice guidelines","Whistle-blowers in healthcare or industry","Peer pressure at school","Uniforms and team identity"]},
{id:"failure", task:2, theme:"Failure", s:["Failure is a better teacher than success, but it charges higher fees.","We only celebrate failure once it has been followed by success.","Nobody learns from a mistake they are too ashamed to admit.","Some failures are simply failures."], angles:["Systems: whether failure teaches depends on culture. Aviation learns through no-blame reporting; blame cultures hide errors.","Sceptical: we romanticise failure through survivorship bias, hearing only from people who failed and then succeeded.","Personal: a specific failure that changed how you work, and what made it instructive rather than just painful."], ex:["No-blame incident reporting","Survivorship bias in start-up stories","A failed exam or selection attempt","Losing in sport and training differently"]},
{id:"honesty", task:2, theme:"Honesty", s:["A kind lie is still a lie.","Honesty without compassion is just cruelty with good manners.","“The truth is rarely pure and never simple.” (Oscar Wilde)","People do not want the truth; they want reassurance that sounds like it."], angles:["Professional: breaking bad news shows honesty and compassion working together, not against each other.","Social: comforting falsehoods spread faster than uncomfortable truths, with real costs, as health misinformation shows.","Personal: white lies smooth relationships in the short term but slowly wear away trust."], ex:["Breaking bad news to a family","Health misinformation during outbreaks","White lies between friends","Honest feedback at work"]},
{id:"nature", task:1, theme:"Nature", s:["We will not save what we do not love, and we cannot love what we do not know.","Nature does not need us; we need nature.","Every generation inherits a planet that is a little more spent.","Wilderness is a place we visit so we can feel we have left something untouched."], angles:["Connection drives protection: people defend the places they use and know, such as local beaches and swimming spots.","Self-interest is the stronger lever: frame conservation around health and money, not affection.","Critique: treating nature as somewhere to visit lets us ignore the damage done where we live."], ex:["Coastal erosion and local campaigns","Fishing quotas and collapsed stocks","Tourism pressure on national parks","Urban green space and health"]},
{id:"ambition", task:2, theme:"Ambition", s:["Ambition is the fuel of achievement and the poison of contentment.","Aim for the stars and you may at least clear the rooftops.","The ambitious person is never quite where they are.","Ambition without kindness builds tall things on soft ground."], angles:["Defend ambition: without it little changes, whether in careers, medicine or society.","Its cost: constant striving can hollow out the present and damage relationships.","Redefine it: ambition aimed at mastery or service, rather than status, is sustainable."], ex:["Changing career later in life","Elite sport and burnout","Founders who built and then lost companies","Volunteering as a form of ambition"]},
{id:"connection", task:1, theme:"Technology and connection", s:["We have never been so connected, or so alone.","A tool shapes the hand that holds it.","The internet did not make us cruel; it made our cruelty efficient.","Convenience is the most persuasive argument ever made."], angles:["Distinguish contact from connection: technology multiplies the first, not necessarily the second.","Tools shape behaviour: designs that reward outrage produce more outrage.","Agency: technology amplifies what we bring to it, so both the problem and the fix are human."], ex:["Social media and teenage mental health","Remote work and community","Online pile-ons","Video calls with family abroad"]},
{id:"fairness", task:1, theme:"Fairness", s:["Equality gives everyone the same shoes; fairness gives everyone shoes that fit.","A society is judged by how it treats those who can do nothing for it.","Justice delayed is justice denied.","Fairness is a luxury of the comfortable."], angles:["Equity over equality: identical treatment can lock in disadvantage, as with healthcare access in rural areas.","Measure a society at its margins: homelessness, disability, old age.","Challenge: fairness is often defined by people who are already secure, so who decides what's fair?"], ex:["Waiting lists and private care","University access programmes","Homelessness services","Rural versus urban services"]},
{id:"courage", task:2, theme:"Courage", s:["Courage is not the absence of fear, but acting in spite of it.","The bravest thing most people will ever do is ask for help.","Heroism is just preparation that happened to be noticed.","We call it courage when it succeeds and recklessness when it fails."], angles:["Preparation over heroism: training turns frightening situations into manageable ones, as with lifeboat crews and emergency services.","Quiet courage: asking for help or admitting a mistake can take more nerve than physical bravery.","Hindsight: we judge bravery by outcome, which is unfair to people who acted well and still lost."], ex:["Lifeboat and rescue training","Asking for help with mental health","A risky call judged by its result","Speaking up in a meeting"]},
{id:"work", task:2, theme:"Work", s:["Choose a job you love and you will never work a day in your life.","Work should give life structure, not meaning.","Every job is a self-portrait of the person who does it.","The most important work is often the least paid."], angles:["Challenge the dream-job myth: even loved work is work, and expecting otherwise breeds disappointment.","Meaning beyond work: an identity built only on a job is fragile (redundancy, retirement, injury).","Value versus pay: care work and emergency services show how badly pay tracks importance."], ex:["Carers and care workers","Running your own small business","Burnout in vocational jobs","Retirement and identity"]},
{id:"tradition", task:1, theme:"Tradition", s:["Tradition is not the worship of ashes but the preservation of fire.","We keep traditions long after we have forgotten why.","Every tradition was once a radical idea.","Change is only welcome when it is someone else's."], angles:["Tradition carries meaning and belonging (festivals, language, sport) worth keeping alive.","Tradition can outlive its purpose and shelter injustice. It should be tested, not assumed.","Synthesis: living traditions adapt. The ones that survive change their form but keep their purpose."], ex:["The Irish language revival","The GAA and community identity","Religious customs in modern life","“We've always done it this way” at work"]},
{id:"health", task:1, theme:"Health", s:["Health is a personal responsibility; illness is often a social one.","A health system is only as strong as its longest waiting list.","Prevention is better than cure, but it makes for poorer headlines.","We pay for sickness and hope for health."], angles:["Social determinants: housing, income and education shape health more than individual choices.","Prevention is undervalued because its successes are invisible.","Shared responsibility: individuals and systems both have duties, and blaming either alone fails."], ex:["Smoking bans and lung cancer","Damp housing and respiratory illness","Screening programmes","Frequent ambulance callers with unmet social needs"]},
{id:"solitude", task:2, theme:"Solitude", s:["Solitude is where we meet ourselves.","Loneliness is being unseen in a crowd.","We fear silence because of what it might tell us.","Some people are never less alone than when they are alone."], angles:["Chosen versus imposed: the same situation feels opposite depending on whether you chose it.","Solitude as necessary: reflection and creativity need time away from constant input.","Social: loneliness as a public health problem, especially among older people."], ex:["Long solo swims or dives","Older people living alone","Constant phone use and boredom","Retreats and digital detoxes"]},
{id:"risk", task:2, theme:"Risk", s:["A ship in harbour is safe, but that is not what ships are built for.","We overestimate risks we can picture and ignore the ones we cannot.","Safety rules are written in blood.","A life without risk is a life without consequence."], angles:["Risk is necessary for growth: careers, adventure and relationships all need some exposure.","Risk perception is biased: dramatic risks loom larger than everyday ones (sharks versus driving).","Managed risk: preparation and rules let us take bold action safely."], ex:["Diving and surfing safety","Fear of flying versus driving","Changing career or going back to study","Rules introduced after maritime disasters"]}

/* ===== GENERATORS: fresh numbers every time =====
   Each generator returns {q, o, x, ...}; o[0] is the correct answer. */

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clean = x => +(+x).toPrecision(12);
const SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };
const sup = n => String(n).split("").map(c => SUP[c] || c).join("");
const minus = s => String(s).replace(/-/g, "−");
function norm(m, e) { m = clean(m); if (m === 0) return [0, 0]; while (Math.abs(m) >= 10) { m = clean(m / 10); e++; } while (Math.abs(m) < 1) { m = clean(m * 10); e--; } return [m, e]; }
const fmtM = m => String(clean(+(+m).toFixed(4)));
const sci = (m, e) => (e === 0 ? fmtM(m) : `${fmtM(m)} × 10${sup(e)}`);
const pp = n => (n < 0 ? `(${minus(n)})` : String(n));
function num(x, dp = 4) {
  x = clean(x); const ax = Math.abs(x);
  if (ax !== 0 && (ax >= 1e7 || ax < 1e-3)) { const [m, e] = norm(x, 0); return minus(sci(m, e)); }
  return minus(x.toLocaleString("en-IE", { maximumFractionDigits: dp }));
}
const plain = x => minus(clean(x).toLocaleString("en-IE", { maximumFractionDigits: 10 }));
const r2 = x => minus(String(clean(Math.round(x * 100) / 100)));
const sig1 = x => +(+x).toPrecision(1);

function essayDone(th, text, elapsed) {
  clearTimers(); const w = text.trim() ? text.trim().split(/\s+/).length : 0; const mins = Math.round(elapsed / 60000);
  const es = { id: "e" + Date.now().toString(36), at: Date.now(), theme: th.theme, themeId: th.id, task: th.task, words: w, mins, text, feedback: "" };
  if (w > 0) { ESSAYS.unshift(es); ESSAYS = ESSAYS.slice(0, 12); pushEssays(); }
  try { localStorage.removeItem(LS_DRAFT); } catch (e) {}
  record({ kind: "essay", t: "Es", f: "essay", key: "essay" }, w >= 150, { weight: 5 }); updProg();
  const checks = ["My opening states a clear, arguable position", "Every paragraph moves the argument forward", "I used at least one specific, concrete example", "I dealt with a counter-argument", "My conclusion pulls it together rather than adding something new", "Sentences are varied and easy to follow"];
  body(`<p class="over">ESSAY SAVED</p><div class="big-num">${w}</div><p class="muted" style="margin:0">words in ${mins} minute${mins === 1 ? "" : "s"} · ${esc(th.theme)}</p>
    <div class="card"><b style="font-family:var(--round);font-weight:900">Quick self-check</b><div class="check">${checks.map((c, i) => `<label><input type="checkbox" id="ck${i}"> <span>${esc(c)}</span></label>`).join("")}</div></div>
    ${w > 0 ? `<div class="card" data-ai ${aiOK() ? "" : "hidden"}><b style="font-family:var(--round);font-weight:900">Feedback from Claude</b><p class="small muted">Marked against ACER's two criteria. Takes up to a minute.</p><p class="ai-out" id="aiOut" hidden></p><button class="b3 soft sm" type="button" id="essFb" style="align-self:flex-start">Get feedback</button></div>` : ""}`);
  setFoot(`<button class="b3 primary big" type="button" id="nextBtn">Done</button>`);
  $("#nextBtn").onclick = closeBite;
  const b = $("#essFb"); if (b) b.onclick = () => essayFeedback(th, es, b);
}
async function essayFeedback(th, es, btn) {
  const out = $("#aiOut"); btn.disabled = true; out.hidden = false; out.textContent = "Reading your essay…";
  const prompt = `You are an experienced GAMSAT Written Communication marker. ACER marks each essay on two criteria: "Thought and content" (quality and depth of ideas, how well the theme is engaged) and "Organisation and expression" (structure, fluency, control of language).\nTask ${th.task} (${th.task === 1 ? "socio-cultural" : "personal and social"}). Theme: ${th.theme}. Statements:\n- ${th.s.join("\n- ")}\n\nThe essay (${es.words} words, written in about ${es.mins} minutes):\n"""\n${es.text.slice(0, 12000)}\n"""\n\nGive feedback in plain text with short headings, under 250 words, Irish/UK spelling:\n1. Two strengths.\n2. The two changes that would raise the mark most, each with a concrete example from the essay.\n3. One sentence on structure.\n4. A rough band for each criterion (weak / developing / competent / strong), clearly labelled as an estimate.`;
  try {
    const r = await SAMPLE(prompt, { cache: false, onText: ({ text }) => { out.textContent = text; } });
    es.feedback = r.text; const i = ESSAYS.findIndex(e => e.id === es.id); if (i >= 0) { ESSAYS[i] = es; pushEssays(); }
    btn.hidden = true;
  } catch (e) { out.textContent = aiErr(e); btn.disabled = false; }
}

function aboutSheet() {
  openSheet("How this works", `<p>Each bite takes 15–90 seconds and saves the moment you answer, so you can stop any time.</p>
    <h3>The method</h3><ul>
    <li><b>Answering, not re-reading.</b> Testing yourself and spacing it out are the two study techniques with the strongest evidence. Every bite is a question.</li>
    <li><b>Solid means right on 3 separate days.</b> Getting it right twice in one sitting doesn't count. Topics come back on a widening schedule: 1, 3, 7, 14, 30 days.</li>
    <li><b>Misses come back.</b> A wrong answer returns a few bites later and again the next day. Calculations come back with new numbers, so you recall the method, not the answer.</li>
    <li><b>Mixed, not blocked.</b> Topics and formats are shuffled. It's harder in the moment but helps you tell problem types apart, and GAMSAT mixes them too.</li>
    <li><b>Worked examples first.</b> In a new calculation topic you'll often see one solved, then do one yourself. These fade out as you improve.</li>

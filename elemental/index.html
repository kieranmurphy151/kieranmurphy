/* Progress carried over from this app's old address arrives once as #import=...; save it, then tidy the address. */
(function () {
  var KEYS = ["gamsat-bites-v1", "gamsat-bites-essays", "gamsat-bites-draft"];
  if (location.hash.indexOf("#import=") !== 0) return;
  try {
    var b = location.hash.slice(8).replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    var data = JSON.parse(decodeURIComponent(escape(atob(b))));
    var n = function (v) { try { var o = JSON.parse(v); return o && o.cards ? Object.keys(o.cards).length : 0; } catch (e) { return 0; } };
    KEYS.forEach(function (k) {
      var inc = data[k], cur = localStorage.getItem(k);
      if (typeof inc === "string" && (cur === null || n(inc) > n(cur))) localStorage.setItem(k, inc);
    });
  } catch (e) {}
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
})();
</script>

<style>
/* Layout: a native-style app shell. Four full-height tabs (Today, Table, Ideas, You) over a bottom tab bar; nothing scrolls at page level.
   Visual: a periodic table in bright "element family" colours; chunky pressable tiles; dark ink text on colour for contrast. */
:root{
  --bg:#F5F4F1; --card:#FFFFFF; --fill:#ECEAE5; --ink:#1F1C19; --ink-2:#4A4540; --muted:#6B645D; --line:#E3E0DA; --edge:#D7D2CA;
  --cta:#FFC233; --cta-edge:#C99100; --on-cta:#1F1C19; --accent-ink:#7A4E00;
  --chem:#FF7A2F; --bio:#2DC86E; --phys:#14C8C8; --lime:#A6E22E; --maths:#9B5CFF; --hum:#FF4F8B; --write:#FFC233; --aqua:#14C8C8; --cherry:#FF5A5F;
  --ok:#2DC86E; --ok-ink:#0E6B36; --ok-soft:#DDF7E8; --bad:#FF5A5F; --bad-ink:#B3242A; --bad-soft:#FFE3E4;
  --on-lane:#1F1C19; --t1:42%; --t2:70%; --scrim:rgba(20,18,16,.45); --shadow:0 1px 2px rgba(31,28,25,.06),0 8px 24px rgba(31,28,25,.07);
  --round:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Nunito",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151413; --card:#211F1D; --fill:#2C2A27; --ink:#F5F2EE; --ink-2:#D5CFC7; --muted:#A59E95; --line:#34312D; --edge:#0B0A09;
  --cta:#FFC233; --cta-edge:#9C7000; --on-cta:#1F1C19; --accent-ink:#FFC233; --ok-ink:#7EE6A8; --ok-soft:#173A29; --bad-ink:#FF9A9D; --bad-soft:#3D1E1C;
  --t1:35%; --t2:60%; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151413; --card:#211F1D; --fill:#2C2A27; --ink:#F5F2EE; --ink-2:#D5CFC7; --muted:#A59E95; --line:#34312D; --edge:#0B0A09;
  --cta:#FFC233; --cta-edge:#9C7000; --on-cta:#1F1C19; --accent-ink:#FFC233; --ok-ink:#7EE6A8; --ok-soft:#173A29; --bad-ink:#FF9A9D; --bad-soft:#3D1E1C;
  --t1:35%; --t2:60%; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sys);font-size:17px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--round);margin:0;text-wrap:balance}
.wrap{width:100%;max-width:34rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- app shell ---------- */
.app{height:100%;display:flex;flex-direction:column}
.screens{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen-in{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-block:6px 12px}
.scroll{overflow-y:auto;overscroll-behavior:contain}
.tabbar{flex:none;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border:0;background:none;cursor:pointer;color:var(--muted);font:800 .6875rem/1.2 var(--round);letter-spacing:.01em;min-height:48px}
.tab .ti{display:grid;place-items:center;width:58px;height:32px;border-radius:16px;transition:background .2s}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--cta);color:#1F1C19}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px;flex:none}
.hdr h1{font-size:2.125rem;font-weight:900;line-height:1.05;letter-spacing:-.01em}
.hdr p{margin:2px 0 0;color:var(--muted);font-size:.875rem;font-weight:600}
.streak{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 12px;border-radius:19px;border:0;background:var(--card);box-shadow:var(--shadow);font:900 1rem var(--round);cursor:pointer;color:var(--ink);flex:none}
.streak svg{width:20px;height:20px;color:var(--chem)}
.streak.cold svg{color:var(--muted)}

/* ---------- buttons ---------- */
.b3{--b:var(--card);--e:var(--edge);--t:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;border:0;background:var(--b);color:var(--t);box-shadow:0 4px 0 var(--e);font:900 1.0625rem var(--round);letter-spacing:.01em;cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap;margin-bottom:4px}
.b3:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--e)}
.b3 svg{width:20px;height:20px;flex:none}
.b3.primary{--b:var(--cta);--e:var(--cta-edge);--t:var(--on-cta)}
.b3.ok{--b:var(--ok);--e:color-mix(in srgb,var(--ok) 70%,#000);--t:#0B2A18}
.b3.bad{--b:var(--bad);--e:color-mix(in srgb,var(--bad) 70%,#000);--t:#3A0B0D}
.b3.soft{--b:var(--card);--e:var(--edge);border:2px solid var(--line)}
.b3.big{min-height:56px;width:100%;font-size:1.125rem}
.b3.sm{min-height:40px;padding:0 14px;font-size:.9375rem;border-radius:12px}
.b3:disabled{opacity:.45;cursor:default}
.tbtn{border:0;background:none;color:var(--accent-ink);font:800 .9375rem var(--round);cursor:pointer;padding:10px 8px;min-height:44px}
.tbtn.muted{color:var(--muted)}
.ibtn{width:44px;height:44px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.ibtn:hover{background:var(--fill)}
.ibtn svg{width:24px;height:24px}

/* ---------- element tiles ---------- */
.el{--lc:var(--muted);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;border:0;border-radius:14px;background:var(--lc);color:var(--on-lane);box-shadow:0 4px 0 color-mix(in srgb,var(--lc) 68%,#000);font:inherit;cursor:pointer;text-align:center;padding:4px;transition:transform .08s,box-shadow .08s}
.el:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--lc) 68%,#000)}
.el i{position:absolute;top:5px;left:7px;font:800 .625rem/1 var(--round);font-style:normal;opacity:.72;font-variant-numeric:tabular-nums}
.el b{font:900 1.5rem/1 var(--round);letter-spacing:-.02em}
.el small{display:block;max-width:100%;margin-top:3px;font:800 .625rem/1.15 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.el.mini{width:34px;height:34px;border-radius:9px;box-shadow:0 2px 0 color-mix(in srgb,var(--lc) 68%,#000);cursor:default}
.el.mini b{font-size:.9375rem}
.el.mini i,.el.mini small{display:none}
.el.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{40%{transform:scale(1.18)}}

/* ---------- today ---------- */
.goal{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;flex:none}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:900 1.375rem/1 var(--round)}
.ring .lbl small{display:block;font:800 .625rem/1.3 var(--round);color:var(--muted)}
.ring.pop{animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.goal-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.goal-t b{font:900 1.125rem/1.2 var(--round)}
.week{display:flex;gap:5px}
.day{flex:1;max-width:30px;aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;background:var(--fill);font:900 .6875rem var(--round);color:var(--muted)}
.day.part{background:color-mix(in srgb,var(--ok) 30%,var(--fill));color:var(--ink)}
.day.met{background:var(--ok);color:#0B2A18}
.day.now{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.up{display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px 12px;flex:none}
.up-row{display:flex;align-items:center;gap:14px}
.up-row .el{width:64px;height:64px;flex:none;cursor:default}
.up-row .el b{font-size:1.625rem}
.up-t{flex:1;min-width:0}
.over{margin:0;font:900 .75rem/1.3 var(--round);color:var(--muted);letter-spacing:.02em}
.up-t b{display:block;font:900 1.25rem/1.15 var(--round)}
.up-t span{display:block;color:var(--muted);font-size:.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font:800 .8125rem var(--round);color:var(--ink);background:color-mix(in srgb,var(--cta) 35%,var(--card));border-radius:10px;padding:5px 10px;border:0;cursor:pointer}
.picks-h{display:flex;justify-content:space-between;align-items:center;flex:none;margin-top:2px}
.picks-h .tbtn{display:inline-flex;align-items:center;gap:5px;min-height:40px;margin:-8px -6px -8px 0;padding:6px 6px 6px 10px;font-size:.875rem;border-radius:12px}
.picks-h .tbtn:hover{background:var(--fill)}
.picks-h .tbtn svg{width:16px;height:16px;flex:none}
.picks-h h2{font-size:1.125rem;font-weight:900}
.picks-h span{font-size:.8125rem;color:var(--muted);font-weight:600}
.picks{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px 9px;padding-bottom:4px;max-height:360px}
.picks .el{height:100%;max-height:96px;align-self:center;width:100%;container-type:size}
@container (max-height:52px){.el small{display:none}}
.fmt-list .el{width:46px;height:46px;flex:none;border-radius:12px;box-shadow:0 3px 0 color-mix(in srgb,var(--lc) 68%,#000);cursor:inherit}
.fmt-list .el b{font-size:1.125rem}
.fmt-list .li{padding-block:11px}
.picks .el b{font-size:clamp(1.05rem,4.6vw,1.5rem)}

/* ---------- table ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.lchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font:800 .75rem var(--round);color:var(--ink-2)}
.lchip i{width:14px;height:14px;border-radius:5px;background:var(--lc)}
.ptable{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;padding-top:6px;gap:8px;--t:min(calc((min(100vw,34rem) - 32px - 30px) / 6),calc((100vh - 330px) / 8.6),64px);--t:min(calc((min(100vw,34rem) - 32px - 30px) / 6),calc((100dvh - 330px) / 8.6),64px)}
.prow{display:grid;grid-template-columns:repeat(6,var(--t));grid-auto-rows:var(--t);gap:6px;justify-content:center}
.tile{--lc:var(--muted);position:relative;border:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;cursor:pointer;color:var(--on-lane);background:color-mix(in srgb,var(--lc) 22%,var(--card));transition:transform .08s}
.tile:active{transform:scale(.94)}
.tile i{position:absolute;top:3px;left:5px;font:800 .5625rem/1 var(--round);font-style:normal;opacity:.6;font-variant-numeric:tabular-nums}
.tile b{font:900 calc(var(--t) * .36)/1 var(--round);letter-spacing:-.02em}
.tile .dots{display:flex;gap:3px;margin-top:4px}
.tile .dots u{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.22}
.tile .dots u.on{opacity:.9}
.tile.l0{color:color-mix(in srgb,var(--ink) 55%,transparent)}
.tile.l0 b{opacity:.75}
.tile.l1{background:color-mix(in srgb,var(--lc) var(--t1),var(--card));color:var(--ink)}
.tile.l2{background:color-mix(in srgb,var(--lc) var(--t2),var(--card));color:var(--ink)}
.tile.l3{background:var(--lc);box-shadow:0 3px 0 color-mix(in srgb,var(--lc) 68%,#000)}
.tkey{display:flex;justify-content:center;gap:16px;font-size:.75rem;color:var(--muted);font-weight:700;flex:none;text-align:center}
.tkey span{display:inline-flex;align-items:center;gap:5px}
.tkey u{width:6px;height:6px;border-radius:50%;background:var(--ink);display:inline-block}

/* ---------- lists (ideas, you) ---------- */
.group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.group-h{font:900 .8125rem var(--round);color:var(--muted);margin:14px 4px 6px;letter-spacing:.02em}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:0;background:transparent;text-align:left;min-height:54px;color:var(--ink)}
button.li{cursor:pointer}
button.li:hover{background:var(--fill)}
.li + .li{border-top:1px solid var(--line)}
.li > div{flex:1;min-width:0}
.li b{display:block;font-weight:700}
.li small{display:block;color:var(--muted);font-size:.8125rem}
.li .chev{color:var(--muted);width:18px;height:18px;flex:none}
.li p{margin:4px 0 0;white-space:pre-wrap}
.seg{display:flex;gap:4px;padding:4px;background:var(--fill);border-radius:12px;width:100%}
.seg button{flex:1;min-width:0;height:38px;border:0;border-radius:9px;background:transparent;font:800 .875rem var(--round);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.li.col{flex-direction:column;align-items:stretch;gap:8px}
.sw{position:relative;width:51px;height:31px;flex:none;border-radius:16px;border:0;background:var(--fill);cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.phases{display:flex;flex-direction:column}
.ph{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 16px}
.ph + .ph{border-top:1px solid var(--line)}
.ph .pn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:900 .9375rem var(--round);background:var(--fill);color:var(--muted)}
.ph.now .pn{background:var(--cta);color:var(--on-cta)}
.legal{font-size:.8125rem;line-height:1.5;color:var(--ink-2);background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.legal p + p{margin-top:6px}
.fineprint{font-size:.75rem;color:var(--muted);text-align:center;margin:4px 4px 12px}
.welcome-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.welcome-list li{display:flex;gap:12px;align-items:center}
.welcome-list .el{width:44px;height:44px;flex:none;cursor:default}
.welcome-list .el b{font-size:1.05rem}
.ph b{font-family:var(--round);font-weight:900}
.ph p{margin:2px 0 0;font-size:.875rem;color:var(--ink-2)}
.ph small{color:var(--muted);font-weight:700;font-size:.75rem}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--muted);padding:20px}
.empty .el{width:76px;height:76px;cursor:default}
.empty b{color:var(--ink);font:900 1.125rem var(--round)}
.note{font-size:.8125rem;color:var(--muted);margin:8px 4px 0}

/* ---------- bite screen ---------- */
.bite{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.bite-top{display:flex;align-items:center;gap:10px;min-height:58px;flex:none}
.bar{flex:1;height:14px;border-radius:7px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:var(--lc,var(--ok));box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:width .4s cubic-bezier(.2,0,0,1);min-width:14px}
.bcount{font:900 .9375rem var(--round);color:var(--muted);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.bcount.met{color:var(--ok-ink)}
.bite-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.bite-body{display:flex;flex-direction:column;gap:16px;padding-block:4px 20px}
.kind{display:flex;align-items:center;gap:10px}
.kind div{min-width:0}
.kind b{display:block;font:900 1rem/1.2 var(--round)}
.kind div > span{display:block;font-size:.8125rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:800 .75rem/1 var(--round);color:var(--ink-2);background:var(--fill);border-radius:8px;padding:6px 9px}
.tag.ai{color:#fff;background:var(--maths)}
.tag svg{width:13px;height:13px}
.q{font:800 1.25rem/1.35 var(--round);margin:0}
.hint{margin:-6px 0 0;font-size:.8125rem;font-weight:700;color:var(--muted)}
.passage{margin:0;padding:16px 18px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);font-size:1.0625rem;line-height:1.6;white-space:pre-line}
.passage.tone{font-size:1.1875rem;font-style:italic}
.fig{margin:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:8px;overflow-x:auto}
.fig svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.fig text{font-family:var(--sys);font-size:10px;font-weight:600;fill:var(--muted)}
.fig .ax{stroke:var(--ink-2);stroke-width:1.4;fill:none}
.fig .gr{stroke:var(--line);stroke-width:1;fill:none}
.fig .c1{stroke:var(--ink);stroke-width:2.6;fill:none}
.fig .c2{stroke:var(--lc);stroke-width:3;fill:none}
.fig .dash{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4;fill:none}
.fig .lab1{fill:var(--ink);font-family:var(--round);font-weight:900;font-size:13px}
.fig .lab2{fill:var(--lc);font-family:var(--round);font-weight:900;font-size:13px}
.opts{display:flex;flex-direction:column;gap:12px}

.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:900 .875rem var(--round);border:2px solid var(--line);color:var(--muted)}
.opt .ot{flex:1;min-width:0}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#0B2A18}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#3A0B0D}

.worked{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--lc) 14%,var(--card));border:2px dashed color-mix(in srgb,var(--lc) 60%,transparent)}
.worked .ans{font:900 1.25rem var(--round);display:flex;align-items:center;gap:8px}

.verdict{display:flex;align-items:center;gap:10px;font:900 1.25rem var(--round)}

.ok .verdict{color:var(--ok-ink)} .bad .verdict{color:var(--bad-ink)}
.fb-scroll{max-height:32vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.fb-scroll p{margin:0;color:var(--ink-2);font-size:.9375rem}
.ai-out{white-space:pre-wrap;border-top:2px dashed color-mix(in srgb,var(--ink) 15%,transparent);padding-top:8px}
/* rank */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border:2px dashed var(--line);border-radius:14px;background:transparent;width:100%;text-align:left;cursor:pointer;font-weight:700}
.slot .n{font:900 .9375rem var(--round);color:var(--muted);width:22px}
.slot.filled{border-style:solid;background:var(--card);box-shadow:0 3px 0 var(--line)}
.slot.right{border-color:var(--ok);background:var(--ok-soft)} .slot.wrong{border-color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chipb{min-height:46px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);cursor:pointer;font:800 1rem var(--round)}
.chipb[aria-hidden="true"]{visibility:hidden}
/* angle + essay */
.stmts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.stmts li{padding:12px 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);font-style:italic;line-height:1.45}

textarea:focus{border-color:var(--ink-2);outline:none}
textarea.essay{min-height:44vh}
.timer{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.timer i{display:block;height:100%;width:0;border-radius:5px;background:var(--lc,var(--write));transition:width 1s linear}

.angles{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:20px;font-size:.9375rem}
.rate3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check{display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.9375rem}
.check input{margin-top:3px;width:20px;height:20px;accent-color:var(--ok)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card p{margin:0}
/* sprint */

.sgrid .opt{min-height:72px;justify-content:center;text-align:center;font:800 1.0625rem var(--round)}
.misses{margin:0;padding-left:18px;color:var(--ink-2);font-size:.9375rem;display:flex;flex-direction:column;gap:6px}
.modes{display:flex;flex-direction:column;gap:12px}
.mode{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--shadow);text-align:left;cursor:pointer}
.mode .el{width:52px;height:52px;cursor:inherit}
.mode div{flex:1;min-width:0}
.mode b{display:block;font:900 1.0625rem var(--round)}
.mode small{color:var(--muted);font-size:.8125rem}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}

.panel::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:640px){.sheet{align-items:center}.panel{border-radius:26px;max-height:84%}}
.panel-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:1;padding-top:2px}

.panel h3{font-size:1.0625rem;font-weight:900;margin-top:4px}

.stat3 b{display:block;font:900 1.25rem var(--round)}
.stat3 small{color:var(--muted);font-size:.75rem;font-weight:700}
.muted{color:var(--muted)} .small{font-size:.875rem}
a{color:var(--accent-ink);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font:800 .9375rem var(--round);max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confetti{position:fixed;inset:0;z-index:90;pointer-events:none}
/* subject colours last, so they override the tile defaults */
.ln-chem{--lc:var(--chem)} .ln-bio{--lc:var(--bio)} .ln-phys{--lc:var(--phys)} .ln-maths{--lc:var(--maths)} .ln-hum{--lc:var(--hum)} .ln-write{--lc:var(--write)} .ln-aqua{--lc:var(--aqua)} .ln-lime{--lc:var(--lime)} .ln-cherry{--lc:var(--cherry)} .ln-none{--lc:var(--muted)}
@media (max-height:720px){.picks .el i{display:none}.picks .el small{margin-top:2px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sitebar{display:flex;margin:6px 0 -6px -6px}.sitelink{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 6px;border-radius:8px;color:var(--muted);font-size:.875rem;font-weight:700;text-decoration:none}.sitelink svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.sitelink:hover{color:var(--ink);text-decoration:underline}.sitelink:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

<script>
/* ===== CONTENT: lanes, topics, formats, fixed items, writing themes =====
   Convention: in every item, o[0] is the correct answer (rank items: o is the correct order).
   Options are shuffled at display time. */

const LANES = {

};

const TOPICS = [
  // chemistry
  { id: "Am", lane: "chem", tier: 1, name: "Atoms & periodic table", covers: "Protons, neutrons and electrons, isotopes, ions, periodic trends" },
  { id: "Bo", lane: "chem", tier: 1, name: "Bonding & shape", covers: "Ionic and covalent bonds, polarity, intermolecular forces, molecular shapes" },
  { id: "Mo", lane: "chem", tier: 1, name: "Moles & solutions", covers: "Molar mass, moles, concentration, dilution, limiting reagents" },
  { id: "Ga", lane: "chem", tier: 2, name: "Gases", covers: "Gas laws, partial pressures, Henry's law, diving gas physics" },
  { id: "Ab", lane: "chem", tier: 2, name: "Acids, bases & pH", covers: "pH and logs, strong and weak acids, buffers, Henderson–Hasselbalch" },
  { id: "Eq", lane: "chem", tier: 2, name: "Equilibrium & rates", covers: "Le Chatelier, K, rate laws, catalysts, activation energy" },
  { id: "En", lane: "chem", tier: 2, name: "Energy & thermo", covers: "Enthalpy, entropy, Gibbs free energy, heat capacity" },

  { id: "Fg", lane: "chem", tier: 3, name: "Functional groups", covers: "Recognising and naming organic molecules" },
  { id: "Is", lane: "chem", tier: 3, name: "Isomers & chirality", covers: "Structural isomers, cis/trans, enantiomers" },
  { id: "Or", lane: "chem", tier: 3, name: "Organic reactions", covers: "Esterification, hydrolysis, oxidation, addition, substitution" },
  // biology
  { id: "Ce", lane: "bio", tier: 1, name: "Cells & membranes", covers: "Organelles, membrane transport, osmosis" },
  { id: "Bm", lane: "bio", tier: 1, name: "Biomolecules & enzymes", covers: "Proteins, carbohydrates, lipids, enzyme kinetics and inhibition" },
  { id: "Ph", lane: "bio", tier: 1, name: "Physiology", covers: "Cardiovascular, respiratory, renal, nervous and endocrine systems" },
  { id: "Ge", lane: "bio", tier: 2, name: "Genetics", covers: "Mendelian crosses, pedigrees, X-linked inheritance, probability" },
  { id: "Dn", lane: "bio", tier: 2, name: "DNA to protein", covers: "Replication, transcription, translation, mutations" },
  { id: "Me", lane: "bio", tier: 2, name: "Metabolism", covers: "Respiration, glycolysis, ATP, fasting metabolism" },
  { id: "Ev", lane: "bio", tier: 3, name: "Evolution & populations", covers: "Natural selection, drift, Hardy–Weinberg" },
  { id: "Im", lane: "bio", tier: 3, name: "Microbes & immunity", covers: "Antibodies, T cells, vaccines, antibiotics" },
  // physics
  { id: "Mt", lane: "phys", tier: 1, name: "Motion & forces", covers: "Kinematics, Newton's laws, momentum" },
  { id: "Wk", lane: "phys", tier: 1, name: "Energy & power", covers: "Work, kinetic and potential energy, power, efficiency" },
  { id: "Fl", lane: "phys", tier: 1, name: "Fluids & pressure", covers: "Pressure at depth, buoyancy, flow, Poiseuille" },
  { id: "El", lane: "phys", tier: 2, name: "Electricity", covers: "Ohm's law, power, series and parallel circuits" },
  { id: "Wv", lane: "phys", tier: 2, name: "Waves & optics", covers: "Wave equation, sound, refraction, lenses, Doppler" },
  { id: "Nu", lane: "phys", tier: 2, name: "Nuclear & half-life", covers: "Alpha, beta, gamma, half-life calculations" },
  // maths
  { id: "Sn", lane: "maths", tier: 1, name: "Powers of ten", covers: "Scientific notation, unit prefixes, square roots" },
  { id: "Ar", lane: "maths", tier: 1, name: "Mental arithmetic", covers: "Estimation, percentages, fractions, decimals without a calculator" },
  { id: "Ra", lane: "maths", tier: 1, name: "Ratios & scaling", covers: "Proportional reasoning: if x doubles, what happens to y?" },
  { id: "Lg", lane: "maths", tier: 2, name: "Logs", covers: "log₁₀ estimates, log rules" },
  { id: "Re", lane: "maths", tier: 2, name: "Rearranging & units", covers: "Changing the subject of a formula, dimensional analysis" },
  { id: "Da", lane: "maths", tier: 2, name: "Graphs & data", covers: "Reading values, gradients and half-lives from graphs" },
  // humanities
  { id: "To", lane: "hum", tier: 1, name: "Tone & attitude", covers: "Naming a writer's tone precisely" },
  { id: "Mi", lane: "hum", tier: 1, name: "Main idea & purpose", covers: "What a passage is arguing and why" },
  { id: "In", lane: "hum", tier: 1, name: "Inference", covers: "Reading what is implied, not stated" },

  { id: "Ca", lane: "hum", tier: 2, name: "Cartoons & visuals", covers: "Satire, visual argument, tables" },

  { id: "An", lane: "write", tier: 1, name: "Angles & thesis", covers: "Finding a sharp, arguable position on a theme" },
  { id: "Ex", lane: "write", tier: 1, name: "Examples", covers: "Choosing specific, persuasive evidence" },

const FORMATS = {
  quiz:   { sym: "Qc", name: "Quick check",    time: "30s" },
  calc:   { sym: "Wo", name: "Work it out",    time: "60s" },
  scale:  { sym: "Sc", name: "Scale it",       time: "30s" },
  crunch: { sym: "Nc", name: "Number crunch",  time: "20s" },

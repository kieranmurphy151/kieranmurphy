 "Rule 8(a) and (b): positive, in ample time, readily apparent to another vessel observing visually or by radar. Avoid a succession of small alterations.");
C("st-12","steer","With enough sea room, what may be the most effective action to avoid a close-quarters situation?",
 "A substantial alteration of course alone, in good time",
 ["A small reduction in speed, held until she has passed","A series of small course alterations, checked by bearings","Sounding the danger signal and holding your course"],
 "Rule 8(c): provided it is made in good time, is substantial and does not result in another close-quarters situation.");
C("st-13","steer","Where should a vessel keep when proceeding along a narrow channel?",
 "Near the outer limit of the channel on her starboard side",
 ["In the centre of the channel, in the deepest water","As near the outer limit of the channel on her port side as is safe","On whichever side has the least traffic"],
 "Rule 9(a): as near to the outer limit on her starboard side as is safe and practicable.");
C("st-14","steer","In a narrow channel, a vessel under 20 m or a sailing vessel must not do what?",
 "Impede a vessel that can only navigate safely within it",
 ["Enter the channel without calling harbour control first","Cross the channel anywhere other than at its ends","Exceed 6 knots through the water while in it"],
 "Rule 9(b).");
C("st-15","steer","Under Rule 18, a power-driven vessel underway keeps out of the way of all these EXCEPT which?",
 "A power-driven vessel crossing from her port side",
 ["A vessel not under command","A vessel restricted in her ability to manoeuvre","A vessel engaged in fishing"],
 "Rule 18(a): vessels not under command, vessels restricted in their ability to manoeuvre, fishing vessels and sailing vessels. A power-driven vessel on your port side in a crossing situation is the give-way vessel (Rule 15). Rule 18 is subject to Rules 9, 10 and 13.");
C("st-16","steer","A sailing vessel underway must keep out of the way of which of these?",
 "A vessel engaged in fishing",
 ["A power-driven vessel underway","A seaplane on the water","A power-driven vessel crossing ahead"],
 "Rule 18(b): a sailing vessel keeps out of the way of vessels not under command, vessels restricted in their ability to manoeuvre, and fishing vessels. A seaplane keeps well clear of all vessels (18(e)).");
C("st-17","steer","Which vessels should avoid impeding a vessel constrained by her draught, if circumstances allow?",
 "Every vessel except those not under command or restricted in ability to manoeuvre",
 ["Only power-driven vessels under 20 m in length, and only in narrow channels","Only sailing vessels and vessels engaged in fishing, whatever their length","No one, because she must keep out of the way of every other vessel"],
 "Rule 18(d)(i). The vessel constrained by her draught must herself navigate with particular caution (18(d)(ii)).");
C("st-18","steer","Two sailing vessels are approaching with risk of collision, each with the wind on a different side. Which keeps out of the way?",
 "The one with the wind on her port side",
 ["The one with the wind on her starboard side","The one that is to windward","The one with the other on her starboard side"],
 "Rule 12(a)(i). With the wind on her port side she is on port tack, with her mainsail out to starboard.");
C("st-19","steer","Two sailing vessels have the wind on the same side, with risk of collision. Which keeps out of the way?",
 "The one to windward",
 ["The one to leeward","The one with the other on her port side","Whichever of the two is faster"],
 "Rule 12(a)(ii): the windward vessel keeps out of the way of the leeward one.");
C("st-20","steer","For Rule 12, how is a sailing vessel's windward side defined?",
 "The side opposite her mainsail",
 ["The side her mainsail is on","Always her starboard side","The side nearer the land"],
 "Rule 12(b). For a square-rigged vessel, it's the side opposite her largest fore-and-aft sail.");
C("st-21","steer","You're sailing with the wind on your port side. You see a sailing vessel to windward but can't tell which side she has the wind on. What do you do?",
 "Keep out of her way",
 ["Hold your course and speed","Assume she will keep clear of you","Sound five short blasts and stand on"],
 "Rule 12(a)(iii): if in doubt, the vessel with the wind on her port side keeps clear.");

/* ---- IRPCS: Rules 20–23 ---- */
C("li-1","lights","What is the arc of visibility of a masthead light?",
 "225°: right ahead to 22.5° abaft the beam each side",
 ["360°: visible all round the horizon","112.5°: right ahead to 22.5° abaft the beam on one side","135°: 67.5° either side of right astern"],
 "Rule 21(a).");
C("li-2","lights","What is the arc of each sidelight?",
 "112.5°: right ahead to 22.5° abaft the beam on its side",
 ["225°: right ahead to 22.5° abaft the beam each side","135°: 67.5° either side of right astern","90°: from right ahead to the beam on its side"],
 "Rule 21(b): green to starboard, red to port.");
C("li-3","lights","What is the arc of the sternlight?",
 "135°: 67.5° either side of right astern",
 ["112.5°: 56.25° either side of right astern","180°: from beam to beam across the stern","225°: 112.5° either side of right astern"],
 "Rule 21(c). Sidelights (2 × 112.5°) and the sternlight (135°) together make a full 360°.");
C("li-4","lights","What lights must a power-driven vessel of 50 m or more show when underway?",
 "Two masthead lights, sidelights and a sternlight",
 ["One masthead light, sidelights and a sternlight","Two all-round white lights and sidelights","Two masthead lights and sidelights, no sternlight"],
 "Rule 23(a): a masthead light forward, a second masthead light abaft and higher than the forward one, sidelights and a sternlight.");
C("li-5","lights","A power-driven vessel of 30 m is underway. What lights must she show?",
 "A masthead light, sidelights and a sternlight",
 ["Two masthead lights, sidelights and a sternlight","An all-round white light and sidelights","Sidelights and a sternlight only"],
 "Rule 23(a): a vessel under 50 m isn't obliged to show the second masthead light, but may.");
C("li-6","lights","What may a power-driven vessel under 12 m show instead of a masthead light and sternlight?",
 "An all-round white light, plus sidelights",
 ["An all-round red light, plus sidelights","Sidelights only, with no white light","A flashing white light, plus sidelights"],
 "Rule 23(d)(i).");
C("li-7","lights","A power-driven vessel under 7 m with a top speed of 7 knots or less: what lights may she show?",
 "An all-round white light, and sidelights if practicable",
 ["No lights, but an electric torch ready at hand to show","A sternlight only, and sidelights if practicable","Sidelights only, and a white light if practicable"],
 "Rule 23(d)(ii). The torch option is for sailing vessels under 7 m and vessels under oars (Rule 25(d)).");
C("li-8","lights","On a power-driven vessel with two masthead lights, which is higher?",
 "The after one",
 ["The forward one","Neither: they are at the same height","Whichever the master chooses"],
 "Rule 23(a)(ii). This lets you read her heading: the lower (forward) light points the way she is going.");
C("li-9","lights","Minimum range of the masthead light on a vessel of 50 m or more?",
 "6 miles",["5 miles","3 miles","2 miles"],
 "Rule 22(a): masthead light 6 miles; sidelights, sternlight, towing light and all-round lights 3 miles.");
C("li-10","lights","Minimum range of the sidelights on a vessel of 50 m or more?",
 "3 miles",["2 miles","1 mile","6 miles"],"Rule 22(a).");
C("li-11","lights","Minimum range of the masthead light on a vessel of 12 m to under 20 m?",
 "3 miles",["5 miles","2 miles","6 miles"],
 "Rule 22(b): 5 miles for 12 m to under 50 m, except 3 miles where the vessel is under 20 m. Sidelights 2 miles.");
C("li-12","lights","Minimum range of the sidelights on a vessel under 12 m?",
 "1 mile",["2 miles","3 miles","Half a mile"],
 "Rule 22(c): masthead 2 miles, sidelights 1 mile, sternlight 2 miles.");
C("li-13","lights","On a vessel under 20 m, how may the sidelights be carried?",
 "Combined in one lantern on the centreline",
 ["Replaced by one all-round white light","Mounted at the stern either side of the sternlight","Shown only when another vessel is near"],
 "Rule 21(b).");
C("li-14","lights","When must navigation lights be shown?",
 "Sunset to sunrise, and in restricted visibility",
 ["Only when other vessels are in sight","From one hour after sunset until dawn","Sunset to sunrise, but only when outside harbour limits"],
 "Rule 20(b) and (c). They may also be shown at any other time it's considered necessary.");
C("li-15","lights","A power-driven vessel underway shows only one masthead light. What can you say about her length?",
 "She is under 50 m",
 ["She is 50 m or more","She is under 12 m","Nothing: it's optional at any length"],
 "Rule 23(a)(ii): a vessel of 50 m or more must show two masthead lights. With only one, she is under 50 m (though not necessarily under 12 m).");
C("li-16","lights","You see a single white light and no sidelights. Which of these can it NOT be?",
 "A power-driven vessel of 50 m or more, head-on",
 ["The sternlight of a vessel heading away from you","A vessel under 50 m at anchor","A power-driven vessel under 7 m"],
 "From ahead, a 50 m+ power-driven vessel shows two masthead lights and both sidelights. The others can all show just one white light.");
C("li-a1","lights","These lights are dead ahead. What is the other vessel doing?",
 "Heading straight towards you",
 ["Crossing from your left to your right","Crossing from your right to your left","Heading directly away from you"],
 "Both sidelights with the masthead lights in line: you are seeing her from right ahead. Head-on (Rule 14): both alter to starboard.",{t:"ship",s:"big_head"});
C("li-a2","lights","These lights are on your port bow, bearing steady and getting closer. You are a power-driven vessel. What should you do?",
 "Stand on: hold course and speed and watch her",
 ["Give way: alter to starboard and pass astern of her","Alter to port to open the distance","Both alter to starboard as for head-on"],
 "You see her green (starboard) sidelight and she is on your port side, so she has you on her starboard side and must give way (Rule 15). You stand on (Rule 17), ready to act if she doesn't.",{t:"ship",s:"big_stbd",dx:-70});
C("li-a3","lights","These lights are on your starboard bow, bearing steady and closing. You are a power-driven vessel. What should you do?",
 "Give way: alter to starboard and pass astern",
 ["Stand on: hold your course and speed and watch her","Alter to port and cross ahead of her","Slow right down and let her decide"],
 "Her red (port) sidelight is showing and she is on your starboard side, so you are the give-way vessel (Rules 15 and 16). Take early, substantial action and avoid crossing ahead of her.",{t:"ship",s:"big_port",dx:70});
C("li-a4","lights","A vessel underway ahead shows only this white light, and you are closing on her. What's the situation?",
 "You are overtaking her and must keep clear",
 ["She is overtaking you and must keep clear","She is head-on and you both alter to starboard","She is crossing and must give way to you"],
 "Seeing only her sternlight means you are more than 22.5° abaft her beam: you are the overtaking vessel (Rule 13). A lone white light could also be a small craft's all-round white light: if in doubt whether you're overtaking, assume you are and keep clear (Rule 13(c)).",{t:"ship",s:"stern"});
C("li-a5","lights","What do these lights show?",
 "A power-driven vessel heading towards you",
 ["A sailing vessel heading towards you","A power-driven vessel heading away from you","A vessel at anchor, bow towards you"],
 "One white masthead light above both sidelights: a power-driven vessel under 50 m, seen from ahead. A sailing vessel shows no white masthead light.",{t:"ship",s:"small_head"});
C("li-a6","lights","The lower white light is to the right of the higher one, and there's a green light. Which way is she heading?",
 "To your right",
 ["To your left","Straight towards you","Straight away from you"],
 "The forward masthead light is the lower one, so she is heading the way the lower light lies. Green confirms you're looking at her starboard side.",{t:"ship",s:"big_stbd"});
C("li-a7","lights","A white light with red and green very close together beneath it. What is it most likely to be?",
 "A small power-driven vessel heading towards you",
 ["A sailing vessel showing a tricolour masthead lantern","A small vessel at anchor","A vessel engaged in trawling"],
 "Rules 21(b) and 23(d): a small power-driven vessel may combine her sidelights in one lantern (under 20 m) and show an all-round white light (under 12 m). A tricolour has no white light above it.",{t:"ship",s:"small12_head"});
C("li-a8","lights","These lights are dead ahead. Which side of the vessel are you looking at, and which way is she heading?",
 "Her port side; she's heading to your left",
 ["Her starboard side; she's heading to your right","Her port side; she's heading to your right","Her starboard side; she's heading to your left"],
 "Red is the port sidelight. The lower (forward) masthead light is on the left, so she is heading left.",{t:"ship",s:"big_port"});
C("li-a9","lights","A vessel was head-on to you. Her lights change to this: the green has gone and the lower masthead light has moved to your left. What has she done?",
 "Altered to starboard: you'll pass port to port",
 ["Altered to port: she'll cross ahead of you","Altered to starboard: you'll pass starboard to starboard","Stopped, and is lying beam-on to you"],
 "Her bow has swung to your left, which is her starboard. You now see her port side, so you'll pass port to port, as Rule 14 intends.",{t:"ship",s:"big_port"});

/* ---- IRPCS: Rules 24–35 ---- */
C("ot-s1","other","No other lights are visible. What does this show?",
 "A vessel not under command, not making way",
 ["A vessel aground in a channel","A vessel constrained by her draught","A vessel restricted in ability to manoeuvre"],
 "Rule 27(a): two all-round red lights in a vertical line. Sidelights and sternlight are added only when making way. A vessel aground also shows anchor lights; a constrained vessel shows three reds.",{t:"ship",s:"nuc_stopped"});
C("ot-s2","other","What is this vessel?",
 "Restricted in her ability to manoeuvre, making way",
 ["Not under command, and making way","Constrained by her draught, and making way through the water","A pilot vessel on duty, making way"],
 "Rule 27(b): red, white, red all-round lights in a vertical line, plus masthead light, sidelights and sternlight when making way. Here you are seeing her starboard side.",{t:"ship",s:"ram_side"});
C("ot-s3","other","What is this vessel?",
 "A vessel constrained by her draught",
 ["A vessel not under command, making way","A vessel aground with anchor lights","A vessel restricted in ability to manoeuvre"],
 "Rule 28: three all-round red lights in a vertical line, in addition to her normal power-driven vessel lights. By day, a cylinder. Here you are seeing her starboard side.",{t:"ship",s:"cbd_side"});
C("ot-s4","other","What is this vessel?",
 "Trawling, making way",
 ["Fishing other than trawling, making way","A pilot vessel on duty, underway","Not under command, making way"],
 "Rule 26(b): green over white all-round lights ('green over white, trawling tonight'), plus sidelights and sternlight when making way.",{t:"ship",s:"trawl"});
C("ot-s5","other","What is this vessel?",
 "Fishing other than trawling, making way",
 ["Trawling, making way","A pilot vessel on duty, underway and making way","Not under command, making way"],
 "Rule 26(c): red over white all-round lights ('red over white, fishing at night'), plus sidelights and sternlight when making way.",{t:"ship",s:"fish_other"});
C("ot-s6","other","What is this vessel?",
 "A pilot vessel on duty, underway",
 ["Fishing other than trawling, making way","Trawling, making way","Restricted in ability to manoeuvre"],
 "Rule 29: white over red at or near the masthead ('white hat, red nose'), plus sidelights and sternlight when underway.",{t:"ship",s:"pilot"});
C("ot-s7","other","Red and green, no white light, heading towards you. What is it?",
 "A sailing vessel underway",
 ["A power-driven vessel under 12 m","A vessel not under command, making way","A vessel at anchor, bow towards you"],
 "Rule 25: a sailing vessel shows sidelights and a sternlight. A power-driven vessel would also show a white masthead or all-round light; a vessel not under command would show two red lights.",{t:"ship",s:"sail_head"});
C("ot-s8","other","Three white lights in a vertical line, plus both sidelights. What is it?",
 "Towing, with a tow over 200 m",
 ["A pilot vessel on duty, underway","Restricted in her ability to manoeuvre","A power-driven vessel of 50 m or more"],
 "Rule 24(a): three masthead lights in a vertical line when the tow is over 200 m (two if 200 m or less), plus a yellow towing light above the sternlight. A pilot vessel shows white over red, a vessel restricted in her ability to manoeuvre shows red, white, red, and a 50 m+ power-driven vessel seen from ahead shows two masthead lights.",{t:"ship",s:"tow_long"});
C("ot-s9","other","What is this vessel?",
 "A vessel aground",
 ["A vessel at anchor, 50 m or more","Not under command, not making way","Constrained by her draught, at anchor"],
 "Rule 30(d): anchor lights plus two all-round red lights in a vertical line. By day, three balls.",{t:"ship",s:"aground"});
C("ot-s10","other","Two white lights, the left one noticeably higher, no sidelights, not moving. What is it?",
 "At anchor, with her bow to your left",
 ["At anchor, with her bow to your right","Underway, heading to your left","Underway, heading to your right"],
 "Rule 30(a): the forward anchor light is the higher one, the reverse of masthead lights underway. Underway and within sidelight range, you'd also see a sidelight from this angle, or only a sternlight from astern. A big ship's masthead lights carry 6 miles but her sidelights only 3, so further off, check the lights really aren't moving before deciding she's at anchor.",{t:"ship",s:"anchor_big"});
C("ot-1","other","What day shape shows a vessel at anchor?",
 "One black ball, forward",
 ["Two black balls in a vertical line","A black cone, point down, forward","Three black balls in a vertical line"],
 "Rule 30(a).");
C("ot-2","other","What day shape shows a vessel not under command?",
 "Two black balls in a vertical line",
 ["One black ball, forward","Ball, diamond, ball in a vertical line","Three black balls in a vertical line"],
 "Rule 27(a).");
C("ot-3","other","What day shape shows a vessel restricted in her ability to manoeuvre?",
 "Ball, diamond, ball in a vertical line",
 ["Two black balls, one above the other, in a vertical line","Two cones, points together","A black cylinder"],
 "Rule 27(b).");
C("ot-4","other","What day shape shows a vessel constrained by her draught?",
 "A black cylinder",
 ["A black diamond","Two black balls in a vertical line","A black cone, point up"],
 "Rule 28.");
C("ot-5","other","What day shape shows a vessel engaged in fishing?",
 "Two cones, points together, one above the other",
 ["Two cones, bases together, one above the other","A single cone, point down","A single black diamond"],
 "Rule 26(b) (trawling) and 26(c) (other fishing). A vessel fishing other than trawling, with outlying gear extending more than 150 m, also shows a cone, point up, in the direction of the gear (26(c)(ii)).");
C("ot-6","other","What day shape does a sailing vessel show when also motoring?",
 "A cone, point down, forward",
 ["A cone, point up, forward","A black ball, forward","No shape, as she still counts as sailing"],
 "Rule 25(e). Under power she is a power-driven vessel for the purposes of the Rules.");
C("ot-7","other","What day shape shows a vessel aground?",
 "Three black balls in a vertical line",
 ["Two black balls in a vertical line","One black ball, forward","Ball, diamond, ball in a vertical line"],
 "Rule 30(d).");
C("ot-8","other","When does a towing vessel show a diamond shape?",
 "When the tow is more than 200 m long",
 ["Whenever she is towing astern","Only when towing alongside","When the tow is more than 50 m long"],
 "Rule 24(a)(v). The vessel being towed also shows one if the tow exceeds 200 m.");
C("ot-9","other","What colour is the towing light shown above the sternlight?",
 "Yellow, same arc as the sternlight",
 ["White, same arc as the masthead light","Yellow, visible all round","Red, same arc as the sternlight"],
 "Rules 21(d) and 24(a)(iv).");
C("ot-10","other","A vessel not normally used for towing (such as a lifeboat) tows a vessel in need of assistance and can't show proper towing lights. What does Rule 24(i) require?",
 "All possible measures to show the tow, such as lighting the towline",
 ["Nothing, as vessels assisting a casualty are exempt from the Rules","Three all-round red lights in a vertical line, while towing","Five short blasts every 2 minutes for as long as she is towing"],
 "Rule 24(i): she needn't show the Rule 24 lights, but must take all possible measures to show the relationship between the two vessels, in particular by illuminating the towline.");
C("ot-11","other","How many masthead lights in a vertical line does a power-driven vessel towing astern show when the tow is 200 m or less?",
 "Two",["One","Three","Four"],
 "Rule 24(a)(i): two, or three if the tow is over 200 m.");
C("ot-12","other","Vessels in sight of one another: what does one short blast mean?",
 "I am altering my course to starboard",
 ["I am altering my course to port","I am operating astern propulsion","I intend to overtake you on your port side"],
 "Rule 34(a).");
C("ot-13","other","Vessels in sight of one another: what do two short blasts mean?",
 "I am altering my course to port",
 ["I am altering my course to starboard","I am operating astern propulsion","I am stopped and making no way"],
 "Rule 34(a).");
C("ot-14","other","Vessels in sight of one another: what do three short blasts mean?",
 "I am operating astern propulsion",
 ["I am altering my course to port","I am in doubt about your intentions","I am at anchor"],
 "Rule 34(a).");
C("ot-15","other","What does a signal of at least five short and rapid blasts mean?",
 "I doubt you're taking enough action to avoid collision",
 ["I am in distress and require immediate assistance","I intend to overtake you on your port side","Keep clear, I am restricted in my ability to manoeuvre"],
 "Rule 34(d): used when you fail to understand the other vessel's intentions or actions, or doubt she is taking enough action to avoid collision. It may be backed up with at least five short and rapid flashes.");
C("ot-16","other","How long are a short blast and a prolonged blast?",
 "About 1 second, and 4 to 6 seconds",
 ["About ½ second, and about 2 seconds","About 2 seconds, and about 10 seconds","About 1 second, and 8 to 10 seconds"],
 "Rule 32.");
C("ot-17","other","Restricted visibility: what does a power-driven vessel making way through the water sound?",
 "One prolonged blast every 2 minutes or less",
 ["Two prolonged blasts every 2 minutes or less","One prolonged and two short every 2 minutes","Rapid ringing of the bell every minute"],
 "Rule 35(a).");
C("ot-18","other","Restricted visibility: what does a power-driven vessel underway but stopped sound?",
 "Two prolonged blasts every 2 minutes or less",
 ["One prolonged blast every 2 minutes or less","One prolonged and two short every 2 minutes","Three short blasts every minute or less"],
 "Rule 35(b): two prolonged blasts about 2 seconds apart.");
C("ot-19","other","Restricted visibility: what do vessels not under command, restricted in ability to manoeuvre, constrained by draught, sailing, fishing or towing sound?",
 "One prolonged and two short, every 2 minutes or less",
 ["One prolonged blast, every 2 minutes or less","Two prolonged blasts, every 2 minutes or less","One prolonged and three short, every 2 minutes or less"],
 "Rule 35(c).");
C("ot-20","other","Restricted visibility: what does a manned vessel being towed sound?",
 "One prolonged and three short, after the tug's signal",
 ["One prolonged and two short, after the tug's signal","Two prolonged blasts, after the tug's signal","Nothing; only the towing vessel signals"],
 "Rule 35(e).");
C("ot-21","other","Restricted visibility: what does a vessel of 20 m to under 100 m at anchor sound?",
 "Rapid bell for about 5 seconds, every minute or less",
 ["One prolonged blast every 2 minutes or less","Three strokes on the bell every 2 minutes","Rapid bell forward and gong aft, every 2 minutes or less"],
 "Rule 35(g). She may also sound short, prolonged, short to warn an approaching vessel. Vessels of 12 m to under 20 m (35(i)) and under 12 m (35(j)) needn't ring the bell, but if they don't, they must make some other efficient sound signal at least every 2 minutes.");
C("ot-22","other","Restricted visibility: how does a vessel aground's bell signal differ from an anchored vessel's?",
 "Three distinct bell strokes before and after the rapid ringing",
 ["She sounds the gong instead of the bell, at intervals of one minute","She adds five short blasts after each rapid ringing","She sounds two prolonged blasts every two minutes"],
 "Rule 35(h).");
C("ot-23","other","What sound signal is a vessel under 12 m required to make in restricted visibility?",
 "Some other efficient sound signal every 2 minutes",
 ["None at all, as she is too small to be required","Exactly the same signals as a vessel of 50 m","A bell signal only, and only when at anchor"],
 "Rule 35(j): she needn't give the full Rule 35 signals, but if she doesn't she must make some other efficient sound signal at intervals of not more than 2 minutes.");
C("ot-24","other","Approaching a bend in a channel where other vessels may be hidden, what do you sound?",
 "One prolonged blast",
 ["Two short blasts","One short blast","Five short blasts"],
 "Rule 34(e). An approaching vessel round the bend answers with a prolonged blast.");
C("ot-25","other","In a narrow channel, what signal means 'I intend to overtake you on your starboard side'?",
 "Two prolonged then one short",
 ["Two prolonged then two short","Prolonged, short, prolonged, short","One prolonged then one short"],
 "Rule 34(c)(i). Two prolonged and two short means on your port side. Agreement is prolonged, short, prolonged, short.");
C("ot-26","other","In a narrow channel, how does the vessel being overtaken signal agreement?",
 "Prolonged, short, prolonged, short",
 ["Two prolonged blasts, then one short blast","One prolonged blast","Five short and rapid blasts"],
 "Rule 34(c)(ii). If in doubt she sounds at least five short and rapid blasts instead.");

/* ---- Buoyage: lateral ---- */
C("la-1","lateral","Which IALA buoyage region do UK and Irish waters use?",
 "Region A: red marks to port when entering from sea",
 ["Region B: red marks to starboard when entering from sea","Region A in Ireland, but Region B in the UK","Neither: each country uses its own national system"],
 "The UK and Ireland, like the rest of Europe, use IALA Region A. Region B (red to starboard going in) is used in the Americas, Japan, Korea and the Philippines.");
C("la-2","lateral","In Region A, entering harbour from seaward, which side do you keep the red can marks?",
 "Port",["Starboard","Either side","It depends on the tide"],
 "Region A: red to port in the direction of buoyage.",{t:"buoy",m:"port",sh:"can"});
C("la-3","lateral","Where does the saying 'red right returning' apply?",
 "Region B, such as the USA, not UK or Irish waters",
 ["Region A, including UK and Irish waters","Everywhere, in both buoyage regions","Only on inland waterways in Ireland"],
 "It's the Region B rule. In UK and Irish waters (Region A), red marks are kept to port when returning from sea.");
C("la-4","lateral","How is the direction of buoyage defined?",
 "Inbound from seaward; elsewhere as set out on the chart",
 ["Always north to south, whatever the coastline","Always in the direction in which the flood tide runs at the time","Outwards from harbour towards the open sea"],
 "IALA: the direction taken when approaching a harbour, river, estuary or other waterway from seaward, or as decided by the authorities. In principle it runs clockwise around land masses, and it's shown on charts.");
C("la-5","lateral","Leaving harbour (against the direction of buoyage), which side do you keep green conical marks?",
 "Port",["Starboard","Either side","Pass between pairs only"],
 "Going out, the lateral marks are reversed relative to you: green to port, red to starboard.",{t:"buoy",m:"stbd",sh:"cone"});
C("la-6","lateral","What shape are port-hand lateral buoys, if not a pillar or spar?",
 "Can (cylinder)",["Cone","Sphere","Spar with an X topmark"],
 "Region A port-hand: red, can-shaped, red can topmark if fitted.");
C("la-7","lateral","What shape are starboard-hand lateral buoys, if not a pillar or spar?",
 "Cone",["Can (cylinder)","Sphere","Spar with a ball topmark"],
 "Region A starboard-hand: green, conical, green cone (point up) topmark if fitted.");
C("la-8","lateral","A lateral mark is a pillar or spar buoy. How do you tell port from starboard?",
 "By its colour and topmark shape",
 ["By its light's flash rate","By which bank it's nearest to","You can't; treat it as special"],
 "The topmark repeats the can or cone shape when the buoy itself doesn't.");
C("la-9","lateral","In small harbours and rivers, lateral marks may be poles, perches or beacons. How do you treat them?",
 "As lateral marks, by colour and topmark",
 ["Ignore them; only buoys are official","Always pass on the side away from shore","Treat them as special marks"],
 "Local variants. Check the chart or harbour guide for any local arrangements.");
C("la-10","lateral","Which light pattern can a plain port- or starboard-hand mark NOT use?",
 "2 flashes then 1 flash",["Groups of 2 flashes","Mostly on, with short dark gaps","Quick flashing"],
 "The 2 + 1 pattern is kept for preferred channel marks.");

/* ---- Buoyage: cardinal ---- */
C("cd-1","cardinal","A rock is marked by a west cardinal. Which side of the buoy is the danger?",
 "To the east of it",["To the west of it","To the north of it","All round it"],
 "Pass west of a west cardinal: the danger lies on the opposite side.",{t:"buoy",m:"W"});
C("cd-2","cardinal","What does the name of a cardinal mark refer to?",
 "The side where the safe water is",
 ["The side where the danger is","The direction to steer next","The direction from the harbour"],
 "A north cardinal has safe water to its north; pass north of it.");
C("cd-3","cardinal","A memory aid for cardinal colours: what do the topmark cone points show?",
 "Where the black bands are",
 ["Where the danger is","Which way to turn","Where the yellow bands are"],
 "Both up (north): black on top. Both down (south): black at the bottom. Points apart (east): black top and bottom. Points together (west): black in the middle.");
C("cd-4","cardinal","Which cardinal's topmark looks like a wine glass or a waist (points together)?",
 "West",["East","North","South"],
 "West: two cones point to point. W for wine glass or waist.");
C("cd-5","cardinal","Which cardinal's topmark looks like an egg or diamond (bases together)?",
 "East",["West","North","South"],
 "East: two cones base to base. E for egg.");
C("cd-6","cardinal","What shape are cardinal marks?",
 "Pillar or spar",["Can or sphere","Cone or sphere","Can or cone only"],
 "The shape doesn't identify a cardinal. Use the colours, topmark and light.");
C("cd-7","cardinal","Heading south, you see an east cardinal mark ahead. How do you pass it?",
 "Leave it to starboard, passing on its east side",
 ["Leave it to port, passing on its west side","Leave it to port, passing on its east side","Either side, as it marks a safe mid-channel point"],
 "Pass on the east side of an east cardinal. Heading south, east is on your left, so you keep left of the mark and it ends up on your starboard side.",{t:"buoy",m:"E"});

/* ---- Buoyage: other marks ---- */
C("mk-2","marks","How long does an emergency wreck mark stay in place?",
 "Until the wreck is charted, fully surveyed and permanently marked",
 ["For exactly 72 hours, after which the authority must lift it","Until two sets of spring tides have passed over it","Permanently, like any other charted wreck mark"],
 "IALA and Trinity House: it stays until the wreck is well known and in the nautical publications, has been fully surveyed, and has a permanent form of marking. Normal cardinal or isolated danger marks usually take over.",{t:"buoy",m:"wreck"});
C("mk-3","marks","A new danger is judged especially grave. How should it be marked?",
 "Normal marks, with at least one duplicated",
 ["A red flag buoy showing a red light","A radio navigational warning only, without any buoys","One special mark with a blue light"],
 "IALA: new dangers may be marked with lateral, cardinal or isolated danger marks, or an emergency wreck mark. If especially grave, at least one mark is duplicated, identical in all respects.");
C("mk-4","marks","A radar beacon (racon) on a new-danger mark sends which Morse letter?",
 "D (– · ·)",["A (· –)","U (· · –)","K (– · –)"],
 "Morse D, also used on the emergency wreck mark.");
C("mk-6","marks","What shape is a special mark?",
 "Optional, but not conflicting with lateral marks",
 ["Always a can, to avoid confusion with cones","Always a sphere, like a safe water buoy","Always a spar, to stand out from lateral buoys"],
 "For example, a special mark on the port side of a channel could be can-shaped but not conical, so it can't be mistaken for a starboard-hand mark.");
C("mk-7","marks","Which of these would NOT normally be marked with a yellow special mark?",
 "An isolated rock with navigable water all round",
 ["A pipeline running out from the shore","A firing range used for military exercises","A data-gathering buoy measuring waves and wind"],
 "An isolated rock gets an isolated danger mark: black and red, two black spheres, and a white light in groups of 2 flashes.");
C("mk-8","marks","What shape is a safe water buoy?",
 "Spherical, or a pillar or spar with a red sphere topmark",
 ["Conical, or a pillar with a red cone topmark","Can-shaped, or a pillar or spar with a single red can topmark","A spar, with two black sphere topmarks"],
 "Red and white vertical stripes. White light, one of: equal light and dark; mostly on with short dark gaps; one long flash every 10 seconds; or Morse code A.");
C("mk-9","marks","What colour light does an isolated danger mark show?",
 "White",["Red","Yellow","Blue and yellow"],
 "White, in groups of 2 flashes. Two flashes, two spheres.",{t:"buoy",m:"iso"});
C("mk-10","marks","What light pattern does the emergency wreck mark show?",
 "1 second blue, half a second dark, 1 second yellow, half a second dark",
 ["Blue and yellow together, flashing once every 3 seconds","1 second blue then 1 second yellow, with no dark gap","Quick flashing blue, then one long yellow flash"],
 "IALA's buoyage standard: one second of blue and one second of yellow, with half a second of darkness between. Trinity House: the pattern was chosen so it can't be confused with the blue lights of law enforcement, security and emergency services.",{t:"night",m:"wreck"});

/* ---- Light patterns (plain English; abbreviations never shown) ---- */
C("ch-2","chars","How often does a quick flashing light flash?",
 "About once a second (50 to 79 times a minute)",
 ["About twice a second (80 to 159 times a minute)","About every 2 seconds (30 to 49 times a minute)","Four or five times a second (160 or more a minute)"],
 "International chart symbols define quick flashing as 50 to 79 flashes a minute, usually 50 or 60.");
C("ch-3","chars","How often does a very quick flashing light flash?",
 "About twice a second (80 to 159 times a minute)",
 ["About once a second (50 to 79 times a minute)","About every 2 seconds (30 to 49 times a minute)","Four or five times a second (160 or more a minute)"],
 "International chart symbols define very quick flashing as 80 to 159 flashes a minute, usually 100 or 120.");
C("ch-4","chars","What is an isophase light?",
 "Equal periods of light and dark",
 ["Light lasts longer than the dark","A single flash of at least 2 seconds","A steady light that never goes out"],
 "For example, 2 seconds on and 2 seconds off. Used on safe water marks.");
C("ch-5","chars","What is an occulting light?",
 "On for longer than it's off, with regular short dark gaps",
 ["Equal periods of light and dark, one after the other","Short flashes with long dark gaps in between","Two different colours shown one after the other"],
 "Think of a steady light that blinks off. Used on safe water marks.");
C("ch-6","chars","What is a long flash?",
 "A flash lasting at least 2 seconds",
 ["A flash lasting under half a second","A light on for half of each cycle","A group of flashes, then darkness"],
 "Used on safe water marks (one long flash every 10 seconds) and after the south cardinal's 6 flashes.");
C("ch-7","chars","What does a light showing Morse code A look like?",
 "A short flash, then a long flash",
 ["A long flash, then a short flash","Two short flashes, then a long flash","Two short flashes, then a pause"],
 "Morse A is dot-dash. Used on safe water marks.");
C("ch-8","chars","What does 'alternating' mean in a light description?",
 "It shows different colours in turn",
 ["It can be seen all the way round","It stays on and never goes out","It shows one long flash each time"],
 "For example, the emergency wreck mark alternates blue and yellow.");
C("ch-10","chars","Why does a south cardinal's light add a long flash after its 6 flashes?",
 "So its 6 flashes can't be miscounted as 3 or 9",
 ["Because south marks are larger than the rest","To show it marks the end of a channel","To show that it is a fixed beacon rather than a buoy"],
 "6 quick or very quick flashes, then a long flash of at least 2 seconds.");
C("ch-11","chars","Cardinal flash counts follow a clock face. How many flashes are in each group on a west cardinal?",
 "9, like 9 o'clock",
 ["3, like 3 o'clock","6 plus a long flash, like 6 o'clock","Flashing without a break, like 12 o'clock"],
 "North flashes without a break, east 3, south 6 plus a long flash, west 9.");
C("ch-12","chars","A buoy shows a white light: groups of 2 flashes every 5 seconds. What is it?",
 "An isolated danger mark",
 ["A safe water mark","An east cardinal mark","A preferred channel mark"],
 "Two flashes, two black spheres.");
C("ch-13","chars","A buoy shows a white light: one long flash every 10 seconds. What is it?",
 "A safe water mark",
 ["A south cardinal mark","An isolated danger mark","A special mark"],
 "Safe water marks show a white light, one of: equal light and dark; mostly on with short dark gaps; one long flash every 10 seconds; or Morse code A.");
C("ch-14","chars","A buoy shows a yellow light: groups of 4 flashes every 15 seconds. What type of mark is it?",
 "A special mark",
 ["A west cardinal mark","An emergency wreck mark","An isolated danger mark"],
 "A yellow light on its own means a special mark. The wreck mark alternates blue and yellow.");
C("ch-15","chars","In Region A, which light pattern is kept for preferred channel marks?",
 "2 flashes then 1 flash, red or green",
 ["Groups of 2 flashes, red or green","Groups of 3 quick flashes, red or green","Morse code A, red or green"],
 "The 2 + 1 pattern shows the channel divides: red for preferred channel to starboard, green for preferred channel to port.");
C("ch-16","chars","What colour light do cardinal marks show?",
 "White",["Yellow","Red or green","Blue"],
 "Always white, quick or very quick flashing.");

LP("ch-n5","Q6LFl15",[LSEQ.Q9_15.t,LSEQ.VQ6LFl10.t,LSEQ.Q3_10.t],"A south cardinal mark: 6 flashes, like 6 o'clock, then a long flash.");

LP("ch-n11","VQ9_10",[LSEQ.Q9_15.t,LSEQ.VQ6LFl10.t,LSEQ.VQ3_5.t],"A west cardinal mark: 9 flashes, like 9 o'clock.");

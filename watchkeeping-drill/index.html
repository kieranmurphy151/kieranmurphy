/* ---- CEVNI & Irish inland waters ---- */
C("cv-1","cevni","Under CEVNI, how are the 'right' and 'left' banks of a waterway defined?",
 "As seen facing downstream",
 ["As seen facing upstream","As seen facing north","As seen from the nearest lock"],
 "So heading upstream from the sea, the right bank is on your port side.");
C("cv-2","cevni","Under CEVNI, which side of the fairway do red marks show?",
 "The right side, facing downstream",
 ["The left side, facing downstream","The middle of the fairway","A hazard on either side"],
 "Red marks the right side and green the left, defined facing downstream.");
C("cv-3","cevni","Heading upstream on the Shannon, which side should the red marks be?",
 "On your port (left) side",
 ["On your starboard (right) side","Either side, as they mark hazards","Ahead; pass between each pair"],
 "Inland Waterways Association of Ireland: on the Shannon, Barrow and western Shannon-Erne, going downstream you leave the red circular marks on your right and the black rectangular marks on your left. Going upstream it's the reverse.");
C("cv-4","cevni","What do the traditional channel marks on the Shannon look like?",
 "Red circular and black rectangular boards",
 ["Red cans and green cones, as at sea","Red and white semi-circular perches on poles","Yellow boards with black arrows"],
 "Inland Waterways Association of Ireland: red circular and black rectangular marks on the Shannon, Barrow and western Shannon-Erne. The eastern Shannon-Erne uses red and white perches.");
C("cv-5","cevni","How does CEVNI fairway marking compare with IALA A for a boat coming in from sea and heading upstream?",
 "It matches: red to port, green to starboard",
 ["It's reversed: red to starboard, green to port","CEVNI uses yellow marks on both sides","There's no fixed relationship between them"],
 "Facing upstream, the right bank (red) is on your port side, just as red is to port entering harbour under IALA A.");
C("cv-6","cevni","CEVNI signs are grouped A to E. What does group A contain?",
 "Prohibitory signs",
 ["Mandatory signs","Restrictive signs","Informative signs"],
 "A prohibitory, B mandatory, C restrictive, D recommendatory, E informative.");
C("cv-7","cevni","What does CEVNI sign group B contain?",
 "Mandatory signs",
 ["Prohibitory signs","Recommendatory signs","Informative signs"],
 "Things you must do, for example keep to one side of the channel, or a speed limit (B.6).");
C("cv-8","cevni","What do CEVNI group C (restrictive) signs tell you about?",
 "Limits such as depth, headroom or width",
 ["Where mooring and berthing are permitted","Where drinking water and fuel are available","Which radio channel to use at a lock"],
 "Restrictions you must allow for when passing.");
C("cv-9","cevni","What does CEVNI sign group E contain?",
 "Informative signs",
 ["Prohibitory signs","Mandatory signs","Restrictive signs"],
 "For example, where mooring is permitted. Usually a white symbol on a blue board.");
C("cv-10","cevni","What does CEVNI sign group D contain?",
 "Recommendatory signs",
 ["Prohibitory signs","Restrictive signs","Informative signs"],
 "For example, a recommended passage.");
C("cv-11","cevni","CEVNI sign A.9 tells you not to do what?",
 "Create wash",
 ["Anchor","Overtake others","Turn round"],
 "A.2 no overtaking, A.6 no anchoring, A.8 no turning, A.9 do not create wash.");
C("cv-12","cevni","What does CEVNI sign A.1 mean?",
 "No entry",
 ["No overtaking","No mooring to the bank","No turning"],
 "A.1 can be shown by boards, flags or lights.");
C("cv-13","cevni","What does CEVNI sign A.6 mean?",
 "No anchoring",
 ["No overtaking","No turning","Do not create wash"],
 "A.6 also covers trailing anchors, cables or chains. A.5 is no berthing, A.7 no making fast to the bank.");
C("cv-14","cevni","Who manages navigation on the Shannon Navigation and the Shannon-Erne Waterway?",
 "Waterways Ireland",
 ["Commissioners of Irish Lights","The Marine Survey Office","ESB"],
 "Waterways Ireland publishes marine notices about temporary markers, hazards and lock closures.");
C("cv-15","cevni","Where would you find notice of a temporary navigation marker on an Irish inland waterway?",
 "A Waterways Ireland marine notice",
 ["The Met Éireann shipping forecast","An Irish Lights notice to mariners","Nowhere; temporary marks aren't notified"],
 "Waterways Ireland issues marine notices for temporary marks, hazards and closures.");
C("cv-16","cevni","On the Shannon-Erne Waterway from Keshcarrigan eastwards, marks are red and white semi-circular perches. Which half shows the side to pass?",
 "The white half",
 ["The red half","The pointed end","Either side is safe"],
 "Inland Waterways Association of Ireland: the white half marks the side to pass; the red half marks the non-navigable side.");
C("cv-17","cevni","On Irish inland waterways, if more than one bridge arch is marked for navigation, which should you use?",
 "The one on your right",
 ["The one on your left","The widest arch","The centre arch"],
 "Inland Waterways Association of Ireland guidance. Also give all markers a reasonably wide berth: stakes and perches may be mounted on the snags they mark.");


/* ================= RYA DAY SKIPPER (theory syllabus) =================
   Shares the collision regulations, buoyage and light-pattern topics with the RNLI course; these are the extra topics. */

/* ---- Boat terms, ropes & anchoring ---- */
C("ds-sea-1","seaman","What is a boat's beam?",
 "Her greatest width",
 ["Her overall length","Her depth below the waterline","The height of her mast above the water"],
 "The beam is the widest part of the hull. 'Abeam' means at right angles to the boat's centreline.");
C("ds-sea-2","seaman","An object is 'abaft the beam'. Where is it?",
 "Behind the beam, towards the stern",
 ["Directly ahead, in line with the bow","Exactly at right angles to the boat","On the side the wind is blowing onto"],
 "Abeam is at right angles to the centreline; abaft the beam is behind that line.");
C("ds-sea-3","seaman","What is a boat's freeboard?",
 "The height of the hull above the waterline",
 ["The depth of the hull below the waterline","The width of the deck at its widest point","The clear deck space forward of the mast"],
 "Draught is the depth below the waterline; freeboard is the height of the deck edge above it.");
C("ds-sea-4","seaman","What does a boat's draught tell you?",
 "How deep the hull reaches below the waterline",
 ["The height of her mast above the waterline","Her width at the widest point of the hull","How much she weighs when fully loaded"],
 "Compare the draught with the depth of water. Air draught is the height above the waterline, for bridges and cables.");
C("ds-sea-5","seaman","Which rope suits anchor warps and mooring lines, because it stretches to absorb shock loads?",
 "Nylon",
 ["Polyester","Polypropylene","Steel wire"],
 "Nylon (polyamide) is strong and stretchy. Polyester stretches little, so it's used for sheets and halyards. Polypropylene floats.");
C("ds-sea-6","seaman","Which rope floats, so it's useful for rescue lines and dinghy painters?",
 "Polypropylene",
 ["Nylon","Polyester","Steel wire"],
 "Polypropylene is lighter than water, but weaker than nylon or polyester and degrades in sunlight. Nylon and polyester both sink.");
C("ds-sea-7","seaman","Which rope is used for sheets and halyards, because it stretches very little?",
 "Polyester",
 ["Nylon","Polypropylene","Natural sisal"],
 "Polyester (sold as Terylene or Dacron) is strong with low stretch, so the sail holds its shape. Nylon's stretch suits anchoring and mooring instead.");
C("ds-sea-8","seaman","Which knot makes a fixed loop in the end of a rope that won't slip or jam?",
 "Bowline",
 ["Clove hitch","Reef knot","Rolling hitch"],
 "Use a bowline to drop a loop over a bollard or cleat, or to tie a line around something. It's easy to undo when not under load.");
C("ds-sea-9","seaman","Which knot joins two ropes of different thickness?",
 "Sheet bend",
 ["Reef knot","Bowline","Clove hitch"],
 "A reef knot can spill when the ropes differ in size; it's for tying reef points over a bundle of sail. A double sheet bend is more secure.");
C("ds-sea-10","seaman","Which knot would you tie to take the load off a jammed sheet, gripping along another rope?",
 "Rolling hitch",
 ["Bowline","Figure-of-eight knot","Reef knot"],
 "A rolling hitch grips when pulled along the line of the rope or spar it's tied to, so the jammed sheet can be freed.");
C("ds-sea-11","seaman","What is a figure-of-eight knot used for?",
 "A stopper knot in the end of a rope",
 ["Joining two ropes of different sizes","Making a fixed loop in the end of a rope","Tying a boat to a ring under load"],
 "Tie one in the end of each sheet so it can't escape through the fairlead.");
C("ds-sea-12","seaman","Which knot secures a line to a ring or post and can be untied while under load?",
 "A round turn and two half hitches",
 ["A reef knot around the ring","A figure-of-eight knot","A double sheet bend"],
 "The round turn takes the strain while you tie the half hitches, and you can cast it off with the line still loaded.");
C("ds-sea-13","seaman","Anchoring with all-chain cable, what's the rule-of-thumb minimum length to let out?",
 "Four times the greatest expected depth",
 ["The depth at the time, plus 2 metres","Twice the depth of water at low water","Exactly the depth of water at high water"],
 "At least four times the depth for chain, and at least six times if the cable is mostly rope. Use the depth at high water, and let out more in strong winds.");
C("ds-sea-14","seaman","Which seabeds give an anchor the best holding?",
 "Mud and sand",
 ["Rock and weed","Shingle and weed","Rock and stones"],
 "Weed and rock stop most anchors digging in. The chart shows the type of seabed.");
C("ds-sea-15","seaman","Choosing an anchorage for the night, which of these matters most?",
 "Shelter from the wind and swell forecast for your stay",
 ["Being as close to the harbour entrance as possible","Anchoring in a marked channel for easy access","Picking the deepest water you can find"],
 "Also check the holding ground, enough depth at low water, room to swing, and that you're clear of channels, moorings and cables.",
 null,null,{q:"What should you check when choosing an anchorage?",a:"Shelter from the forecast wind and swell; good holding ground such as sand or mud; enough depth at low water; room to swing; and clear of channels, moorings and cables.",x:"Check the forecast for any wind shift during your stay, and plan an escape route if the anchorage becomes exposed."});
C("ds-sea-16","seaman","At anchor, how do you check whether you're dragging?",
 "Take bearings on fixed objects ashore and recheck them",
 ["Check the boat's speed through the water on the log","Look once at the angle of the chain after setting","Watch how the other anchored boats are swinging"],
 "If the bearings change, you're moving. Many chartplotters also have an anchor alarm. The log measures water flowing past, which at anchor is just the tidal stream.");
C("ds-sea-17","seaman","Which type of anchor holds best in rock and weed, where others struggle?",
 "Fisherman anchor",
 ["Danforth anchor","Plough anchor","Claw (Bruce) anchor"],
 "A fisherman's narrow flukes can get through weed and hook rock. Plough, claw and Danforth types hold best in sand and mud.");

/* ---- Charts, position & compass ---- */
C("ds-nav-1","navi","How long is a nautical mile?",
 "1852 metres: one minute of latitude",
 ["1609 metres: one minute of longitude","1000 metres: one tenth of a degree","1852 metres: one minute of longitude"],
 "A minute of latitude is (very nearly) a nautical mile everywhere. A minute of longitude gets shorter towards the poles.");
C("ds-nav-2","navi","Where do you measure distance on a chart?",
 "On the latitude scale, level with your position",
 ["On the longitude scale along the top or bottom","On any scale, as they're all the same","Using the rings of the compass rose"],
 "The longitude scale isn't in nautical miles. On a Mercator chart the latitude scale stretches towards the poles, so measure level with your position.");
C("ds-nav-3","navi","What is a knot?",
 "A speed of one nautical mile per hour",
 ["A distance of exactly one nautical mile","A speed of one kilometre per hour","A speed of one land mile per hour"],
 "So 6 knots for 30 minutes covers 3 nautical miles.");
C("ds-nav-4","navi","What is magnetic variation?",
 "The angle between true north and magnetic north",
 ["The compass error caused by the boat's own metal and electrics","The angle between your heading and your track","The swing of the compass card as the boat heels"],
 "It depends on where you are and changes slowly each year. Read it from the compass rose on the chart and update it for the current year.");
C("ds-nav-5","navi","What causes compass deviation?",
 "Iron, engines and electrics on the boat itself",
 ["The difference between true and magnetic north","The tidal stream pushing the boat sideways","The wind pushing the boat off her course"],
 "Deviation changes with the boat's heading, so it's recorded on a deviation card. Keep phones, tools and speakers away from the compass.");
C("ds-nav-6","navi","Variation is 3° West. Your true course is 090°. What is the magnetic course?",
 "093°",
 ["087°","090°","270°"],
 "True to magnetic: add westerly variation, subtract easterly. A memory aid: 'variation west, magnetic best; variation east, magnetic least'.");
C("ds-nav-7","navi","A hand-bearing compass reads 225° magnetic. Variation is 2° West. What is the true bearing?",
 "223°",
 ["227°","225°","045°"],
 "Magnetic to true: subtract westerly variation, add easterly. The reverse of going true to magnetic.");
C("ds-nav-8","navi","What is a dead reckoning position?",
 "Worked out from the course steered and distance run only",
 ["Worked out from course, distance, tidal stream and leeway","Fixed from bearings of two or more charted objects","Read directly from satellite navigation"],
 "An estimated position also allows for tidal stream and leeway, so it's more accurate.");
C("ds-nav-9","navi","What is leeway?",
 "Sideways drift caused by the wind",
 ["Sideways drift caused by the tidal stream","The compass error from the boat's metal","The angle between true and magnetic north"],
 "Leeway is the angle between your heading and your track through the water. Allow for it by steering a little towards the wind.");
C("ds-nav-10","navi","What does this symbol on a chart plot mean?",
 "An estimated position",
 ["A fix from bearings or satellite navigation","A waypoint you plan to pass","A charted danger to avoid"],
 "A dot in a triangle is an estimated position, labelled with the time. A dot in a circle is a fix.",{t:"sym",k:"ep"});
C("ds-nav-11","navi","What does this symbol on a chart plot mean?",
 "A fix",
 ["An estimated position","A waypoint you plan to pass","A charted danger to avoid"],
 "A dot in a circle is a fix: a position from bearings, ranges or satellite navigation, labelled with the time.",{t:"sym",k:"fix"});
C("ds-nav-12","navi","On a chart plot, what does a line with three arrowheads show?",
 "The tidal stream",
 ["The water track (course through the water)","The ground track (course over the ground)","A clearing line"],
 "One arrowhead marks the water track, two the ground track, and three the tidal stream.",{t:"sym",k:"a3"});
C("ds-nav-13","navi","On a chart plot, what does a line with two arrowheads show?",
 "The ground track (course over the ground)",
 ["The tidal stream","The water track (course through the water)","A transit line"],
 "One arrowhead marks the water track, two the ground track, and three the tidal stream.",{t:"sym",k:"a2"});
C("ds-nav-14","navi","Three bearings for a fix make a small triangle, called a cocked hat. Where do you assume you are?",
 "At the corner nearest to danger",
 ["In the middle of the triangle","At the corner furthest from danger","On whichever line was taken first"],
 "Then fix again soon. A big cocked hat means an error: recheck the bearings and which objects you used.");
C("ds-nav-15","navi","Choosing objects for a three-bearing fix, how should they be spread?",
 "Well spread, ideally about 60° apart",
 ["Close together, within 10° of each other","All on the same side, under 20° apart","Directly ahead and directly astern only"],
 "Wide angles make the lines cross cleanly. Take bearings of objects nearly ahead or astern first, and those on the beam last, as they change fastest.");
C("ds-nav-16","navi","On a chart, a figure is underlined, such as 2 with a line beneath it. What does it mean?",
 "A drying height of 2 metres above chart datum",
 ["A charted depth of 2 metres below chart datum","An area surveyed only to a depth of 2 metres","A wreck with 2 metres of water over it at low tide"],
 "Underlined figures are drying heights, measured above chart datum. Plain figures are depths below chart datum.");
C("ds-nav-17","navi","What is chart datum on UK and Irish charts?",
 "Roughly the lowest astronomical tide",
 ["Mean sea level, the average height","Mean high water at spring tides","The average low water over a year"],
 "Charted depths are below chart datum, so there's usually at least the charted depth. High pressure or offshore winds can occasionally lower the sea below it.");
C("ds-nav-18","navi","On Admiralty charts, what are the heights of lights and land features measured above?",
 "Mean high water springs",
 ["Chart datum","Lowest astronomical tide","The seabed"],
 "Vertical clearances under bridges and cables are given above the highest astronomical tide on current Admiralty charts (older charts may use mean high water springs), so you nearly always have at least the charted clearance.");

/* ---- Tides & tidal streams ---- */
C("ds-tide-1","tide","When do spring tides occur?",
 "Shortly after full moon and new moon",
 ["Shortly after the first and last quarter moons","Only in spring, from March to May","Only at the spring and autumn equinoxes"],
 "Springs come about every two weeks, with the biggest range and strongest streams. Neaps come shortly after the quarter moons.");
C("ds-tide-2","tide","What is the range of a tide?",
 "The height difference between high and low water",
 ["The time between high water and low water","The height of high water above chart datum","How far the tidal stream carries you in an hour"],
 "A big range means spring tides; a small range means neaps. Tide tables let you work out which you're nearer.");
C("ds-tide-3","tide","Compared with springs, what are neap tides like?",
 "A smaller range and weaker tidal streams",
 ["A larger range and stronger tidal streams","The same range but stronger streams","Only one high water a day"],
 "Tidal diamonds and tidal stream atlases give separate rates for springs and neaps.");
C("ds-tide-4","tide","By the rule of twelfths, how much of the range does the tide rise or fall in each of the six hours?",
 "1, 2, 3, 3, 2, 1 twelfths",
 ["2 twelfths every hour","3, 2, 1, 1, 2, 3 twelfths","1, 1, 2, 2, 3, 3 twelfths"],
 "It assumes a regular tide curve, so it's unreliable where tides are irregular, such as in the Solent.");
C("ds-tide-5","tide","The range is 6 metres. By the rule of twelfths, how much does the tide rise in the first two hours after low water?",
 "1.5 metres",
 ["1.0 metre","2.0 metres","3.0 metres"],
 "First hour 1/12 (0.5 m), second hour 2/12 (1.0 m): 3/12 of 6 m is 1.5 m.");
C("ds-tide-6","tide","What does 'height of tide' mean?",
 "The sea's height above chart datum at that time",
 ["The depth of water under your keel at the time","The difference between high and low water","The height of high water above mean sea level"],
 "Add the height of tide to the charted depth to get the depth of water.");
C("ds-tide-7","tide","The charted depth is 3.2 metres and the height of tide is 1.8 metres. What depth of water is there?",
 "5.0 metres",
 ["1.4 metres","3.2 metres","1.8 metres"],
 "Depth of water = charted depth + height of tide.");
C("ds-tide-8","tide","A rock has a drying height of 1.2 metres. The height of tide is 3.0 metres. How much water is over it?",
 "1.8 metres",
 ["4.2 metres","3.0 metres","1.2 metres"],
 "Water over a drying feature = height of tide − drying height.");
C("ds-tide-9","tide","What does a tidal diamond on a chart tell you?",
 "The tidal stream's direction and rate there, hour by hour",
 ["The height of tide at that spot, hour by hour","The position of a tide gauge for that area","A spot where the stream always runs at 1 knot"],
 "Its table gives the direction in degrees true and the rates at springs and neaps, for each hour before and after high water at the reference port.",{t:"sym",k:"diamond"});
C("ds-tide-10","tide","A tidal stream is given as 090°. Which way is the water flowing?",
 "Towards the east",
 ["From the east, towards the west","Towards the north","It depends on the wind"],
 "Tidal streams are given as the direction they flow towards; winds as the direction they blow from.");
C("ds-tide-11","tide","In tide tables, what is a secondary port?",
 "A port whose tides are worked out from a standard port",
 ["A port with only one high water a day","A port with no tidal stream in its approaches","A port whose entrance closes at low water"],
 "The almanac gives the time and height differences for each secondary port.");
C("ds-tide-12","tide","Wind blowing against the tidal stream: what happens to the sea?",
 "It becomes steeper and rougher",
 ["It becomes calmer and flatter","The tide turns early","The tidal stream gets stronger"],
 "Plan to round headlands and pass tide races with wind and tide together, and near slack water.");

/* ---- Weather & forecasts ---- */
C("ds-met-1","met","On the Beaufort scale, what is Force 6?",
 "Strong breeze: 22 to 27 knots",
 ["Gale: 34 to 40 knots","Moderate breeze: 11 to 16 knots","Near gale: 28 to 33 knots"],
 "Force 4 moderate breeze 11 to 16 knots; Force 5 fresh breeze 17 to 21; Force 6 strong breeze 22 to 27; Force 7 near gale 28 to 33; Force 8 gale 34 to 40.");
C("ds-met-2","met","What wind speed is a gale, Force 8?",
 "34 to 40 knots",
 ["22 to 27 knots","28 to 33 knots","48 to 55 knots"],
 "Force 9 severe gale is 41 to 47 knots; Force 10 storm is 48 to 55.");
C("ds-met-3","met","When is a gale warning issued for a sea area?",
 "When winds of Force 8 or more are expected",
 ["When winds of Force 6 or more are expected","Only once a gale is already blowing","Whenever the pressure falls below 1000 hectopascals"],
 "A gale warning goes out when mean winds of Force 8 or more, or gusts of 43 knots or more, are expected in the sea area. UK strong wind warnings for inshore waters cover Force 6 or more, and Met Éireann's small craft warnings cover Force 6 or more up to 10 nautical miles off the Irish coast.");
C("ds-met-4","met","In a shipping forecast, what does 'imminent' mean?",
 "Within 6 hours of the time of issue",
 ["Within the next hour","6 to 12 hours from the time of issue","More than 12 hours from the time of issue"],
 "Imminent: within 6 hours. Soon: 6 to 12 hours. Later: more than 12 hours.");
C("ds-met-5","met","In a shipping forecast, what does 'later' mean?",
 "More than 12 hours from the time of issue",
 ["Within 6 hours of the time of issue","6 to 12 hours from the time of issue","Some time after midnight on the day of issue"],
 "Imminent: within 6 hours. Soon: 6 to 12 hours. Later: more than 12 hours.");
C("ds-met-6","met","In a shipping forecast, what does visibility 'poor' mean?",
 "1000 metres to 2 nautical miles",
 ["Less than 1000 metres","2 to 5 nautical miles","More than 5 nautical miles"],
 "Good: more than 5 nautical miles. Moderate: 2 to 5. Poor: 1000 metres to 2 nautical miles. Very poor: less than 1000 metres, which is fog.");
C("ds-met-7","met","The wind changes from south-west to west. What is this called?",
 "Veering",
 ["Backing","Freshening","Moderating"],
 "Veering is a clockwise change in wind direction; backing is anticlockwise.");
C("ds-met-8","met","In the northern hemisphere, how does the wind blow around an area of low pressure?",
 "Anticlockwise, and slightly in towards the centre",
 ["Clockwise, and slightly out from the centre","Clockwise, and slightly in towards the centre","Straight in towards the centre of the low"],
 "Around high pressure it blows clockwise and slightly outwards. It's the other way round in the southern hemisphere.");
C("ds-met-9","met","In the northern hemisphere, stand with your back to the wind. Where is the low pressure?",
 "On your left",
 ["On your right","Directly ahead of you","Directly behind you"],
 "Buys Ballot's law. In the southern hemisphere it's on your right.");
C("ds-met-10","met","The isobars on a weather chart are close together. What does that mean?",
 "Strong winds",
 ["Light winds","Fog is likely","High pressure and settled weather"],
 "The closer the isobars, the steeper the pressure change and the stronger the wind.");
C("ds-met-11","met","As a warm front approaches, what typically happens?",
 "Pressure falls, cloud lowers, and rain sets in",
 ["Pressure rises sharply and the sky clears","Squally showers, then a sudden clearance","The wind dies away and the sky clears"],
 "The wind usually veers as the front passes. Behind it, in the warm sector, visibility is often poor with drizzle.");
C("ds-met-12","met","As a cold front passes, what usually happens?",
 "The wind veers, with squalls, then clearer air",
 ["The wind backs and drizzle sets in for hours","Pressure falls steadily for many hours","Fog forms and the wind dies away to calm"],
 "Pressure starts to rise behind the front, and showers often follow in the cooler air.");
C("ds-met-13","met","When does a sea breeze usually develop?",
 "On a sunny day, blowing onshore",
 ["At night, blowing offshore","On cold, cloudy days only","Only when a gale is forecast"],
 "The land heats faster than the sea; air rises over the land and cooler sea air flows in. At night a weaker land breeze can blow offshore.");
C("ds-met-14","met","What causes sea fog?",
 "Warm, moist air moving over colder sea",
 ["Clear skies and calm air over land at night","Strong winds lifting spray off the waves","A falling barometer ahead of a cold front"],
 "Sea fog can persist even in fresh winds. Radiation fog forms over land on clear, calm nights, and can drift over harbours and estuaries before clearing.");
C("ds-met-15","met","Where does radiation fog form?",
 "Over land, on clear and calm nights",
 ["Over the open sea, in strong winds","Over a warm sea on windy afternoons","Only behind a cold front"],
 "The ground cools quickly under clear skies, chilling the air above it. It usually clears as the sun warms the land.");

/* ---- Safety & distress ---- */
C("ds-saf-1","safety","When should you send a Mayday?",
 "When there's grave and imminent danger to a vessel or life",
 ["When the engine has failed in calm weather, with no danger","To warn other vessels about a navigation hazard","When you want a tow back to harbour, with no danger"],
 "Pan-Pan is for urgent situations without grave and imminent danger. Sécurité is for safety information, such as navigation warnings.");
C("ds-saf-2","safety","A crew member has broken an arm. The boat isn't in danger. Which call do you make?",
 "Pan-Pan",
 ["Mayday","Sécurité","No call; wait until you're in harbour"],
 "Pan-Pan is the urgency call, used when you need help but there's no grave and imminent danger to the boat or to life.");
C("ds-saf-3","safety","Your radio has digital selective calling. In a distress, what do you do first?",
 "Press and hold the red distress button",
 ["Phone the coastguard on a mobile first","Speak your Mayday on channel 70","Wait for a reply on channel 16 before alerting"],
 "The alert sends your identity and, if the radio is connected to satellite navigation, your position. Then make your Mayday voice call on channel 16. Channel 70 carries digital calls only, never voice.");
C("ds-saf-4","safety","Which radio channel do you use for a Mayday voice call?",
 "Channel 16",
 ["Channel 70","Channel 6","Channel 77"],
 "Channel 16 is the international distress, safety and calling channel.");
C("ds-saf-5","safety","What must a Mayday call include?",
 "Name, position, problem, help needed, people aboard",
 ["Name, home port, skipper's name and destination","Position, weather, sea state and destination","Name, call sign, last port and next port"],
 "Mayday ×3; this is [name] ×3, with call sign and identity number; Mayday [name]; position; nature of distress; help needed; number of people; any other useful information; Over.");
C("ds-saf-6","safety","At night, which flare attracts attention from furthest away?",
 "Red parachute rocket",
 ["Red hand flare","Orange smoke","White hand flare"],
 "A parachute rocket climbs about 300 metres. Red hand flares pinpoint you for rescuers nearby; orange smoke is for daytime; white flares warn of a collision risk and aren't distress signals.");
C("ds-saf-7","safety","What is a white hand flare for?",
 "Warning a vessel of a risk of collision",
 ["Signalling distress to rescuers at night","Marking where someone went overboard","Showing other vessels you're at anchor"],
 "White flares aren't distress signals. Red flares, rockets and orange smoke are.");
C("ds-saf-8","safety","A rescue helicopter lowers a line to your boat. What must you do?",
 "Let it touch the water first; never tie it on",
 ["Grab it as soon as it's within reach","Tie it firmly to a strong point on deck","Keep it clear of the water and the deck"],
 "Letting it touch the water first discharges static electricity. Follow the winchman's instructions, clear loose gear from the deck, and keep the course and speed you're asked to.");
C("ds-saf-9","safety","When should you abandon your boat for the liferaft?",
 "Only when she's about to sink: step up into it",
 ["As soon as anything goes wrong on board","When the bilge alarm first starts sounding","Before calling for help, to save time"],
 "Only abandon the boat when she's about to sink: she's the better refuge for as long as she floats. Take the grab bag, and step up into the raft rather than down.");
C("ds-saf-10","safety","Someone falls overboard. What should the first person who sees it do?",
 "Shout 'Man overboard', point, and throw a lifebuoy",
 ["Turn straight back without telling anyone","Go below to call the coastguard first","Start the engine and wait for instructions"],
 "Then press the man-overboard button on the satellite navigation or radio to mark the spot, keep pointing and keep them in sight, and send a digital selective calling distress alert and a Mayday straight away: they can be cancelled if the person is recovered.");
C("ds-saf-11","safety","Why is bottled gas (butane or propane) a hazard on a boat?",
 "It's heavier than air, so leaks collect in the bilge",
 ["It's lighter than air and gathers under the roof","It's poisonous even when it hasn't leaked","It has no smell, so leaks go unnoticed"],
 "Turn it off at the bottle when not in use, and fit a gas alarm low down. A smell is added so you can detect leaks.");
C("ds-saf-12","safety","A pan of fat catches fire in the galley. What do you do?",
 "Smother it with a fire blanket",
 ["Pour water on it","Carry the pan up on deck","Fan the flames out with a cloth"],
 "Water on burning fat causes a fireball. Turn off the gas if you can do it safely.");
C("ds-saf-13","safety","What does an emergency position-indicating radio beacon do when it's activated?",
 "Sends your identity and position via satellite",
 ["Calls nearby boats by voice on channel 16","Flashes a strobe light only, to be seen by eye","Sounds a loud alarm on board to wake the crew"],
 "Register it so rescuers know whose it is. A personal locator beacon does the same for one person.");
C("ds-saf-14","safety","When should crew clip on with a harness and lifeline?",
 "At night, in rough weather or poor visibility",
 ["Only when the boat is motoring in a swell","Only in harbour, when moving about on deck","Never: lifelines trip people up on deck"],
 "Also whenever the skipper says. Clip on to jackstays or strong points before leaving the cockpit, and before you need to.");
C("ds-saf-15","safety","What makes carbon monoxide so dangerous on a boat?",
 "You can't see or smell it, and it builds up inside",
 ["It's easy to spot, as it forms thick white smoke","It only comes from outboards, so it can't reach the cabin","It smells strongly of rotten eggs, so it's noticed"],
 "Fit a carbon monoxide alarm and keep the cabin ventilated.");

/* ---- Pilotage, passage planning & fog ---- */
C("ds-pil-1","pilot","What is a transit?",
 "Two fixed objects in line, giving a position line",
 ["A bearing on one object with a hand-bearing compass","The route ships follow through a traffic lane","The time it takes to pass a headland at full speed"],
 "While they stay in line you're on that line. If they open, you've moved off it. No compass is involved, so there's no compass error: transits are also used to check the compass.");
C("ds-pil-2","pilot","Leading lights or leading marks in line show what?",
 "The safe track into a harbour",
 ["The edge of a danger to avoid","The best place to anchor overnight","That the harbour entrance is closed"],
 "Keep them in line, and check on the chart how far along the line it's safe to go.");
C("ds-pil-3","pilot","What is a clearing line?",
 "A line that keeps you clear of a danger",
 ["The line of deepest water in a channel","A line where a cable crosses the channel","The limit of a harbour speed restriction"],
 "It's often checked with a bearing, such as 'not less than 030°' on a headland, or with a transit.");
C("ds-pil-4","pilot","A sectored light shows white, red and green sectors. What does the white sector usually mark?",
 "The safe channel or approach",
 ["The direction of the danger","The area where you may anchor","The limit of the harbour"],
 "Red and green sectors show you're off to one side. Check the chart or almanac for which side each colour marks at that light.");
C("ds-pil-5","pilot","What should a passage plan include?",
 "Tides, weather, dangers, waypoints and refuges",
 ["Only the waypoints for the satellite navigation","Just the departure and arrival times and fuel","Just the latest weather forecast for the area"],
 "Ports of refuge are safe harbours to divert to if things change. Also plan for the boat's and crew's limits, fuel, tidal gates and timings, and confirm your position by an independent method as you go.");
C("ds-pil-6","pilot","What is a tidal gate?",
 "A spot you can only pass at certain states of tide",
 ["A buoy marking the edge of a tidal stream","The time of high water at a standard port","The point where the flood stream starts"],
 "Headlands and narrow sounds are typical. Plan your timing around them.");
C("ds-pil-7","pilot","Why shouldn't you rely on satellite navigation alone?",
 "It can fail or be wrong, so cross-check it",
 ["It doesn't work once you're out of sight of land","It's illegal to navigate with it","It only works when the boat is moored"],
 "Cross-check with bearings, transits, depth soundings and a written log, so you can carry on if the electronics fail.");
C("ds-pil-8","pilot","What should you record in the log during a passage?",
 "Times, positions, courses, distance run and weather",
 ["Just the departure and arrival times of the trip","The crew list and the berthing fees","Nothing, if you have satellite navigation"],
 "If the electronics fail, the log lets you work up a dead reckoning or estimated position.");
C("ds-pil-9","pilot","Fog closes in on a small boat near a shipping lane. What's a sensible plan?",
 "Head for shallow water out of the lane, slowly",
 ["Speed up to cross the lane as quickly as possible","Anchor in the middle of the lane and wait","Turn off the navigation lights to save power"],
 "Slow down and sound the fog signal. Hoist a radar reflector, put lifejackets on, keep a lookout by eye and ear, and keep the plot going. Rule 19 applies.");
C("ds-pil-10","pilot","Fog is forecast. What's the first navigation job before it arrives?",
 "Fix your position accurately",
 ["Plot a course straight across the shipping lane","Switch off the radar to save power","Take down the radar reflector"],
 "A good starting fix makes it much easier to keep track of your position once you can't see.");
C("ds-pil-11","pilot","Why carry a radar reflector?",
 "To help larger vessels see you on their radar",
 ["To let you see other vessels on radar","To show other vessels that you're at anchor","To meet a rule that applies only at night"],
 "Small boats, especially wooden or plastic ones, give a weak radar echo.");
C("ds-pil-12","pilot","Which publication gives tide tables, harbour information and lights for small craft?",
 "A nautical almanac",
 ["A deviation card","The ship's log","A tidal stream atlas"],
 "Pilot books (sailing directions) give detailed notes for harbours and anchorages.");
C("ds-pil-13","pilot","Under the international pollution rules, when may you put plastic overboard?",
 "Never: it's banned everywhere at sea",
 ["When more than 12 miles from land","When it's cut into small pieces","Outside harbour limits"],
 "Bring all rubbish ashore. Never pump oily bilge water overboard.");


/* ================= SCENARIOS: the theory in practice, from a lifeboat ================= */
function SC(id,sit,q,a,o,ex,img){C(id,"scen",q,a,o,ex,img);CARDS[CARDS.length-1].sit=sit;}
SC("scn-x-stbd","Taking the all-weather lifeboat out on a service in good visibility, you see a coaster on your starboard bow, on a steady compass bearing and closing.",
 "What do you do?",
 "Give way: turn boldly to starboard, passing astern",
 ["Hold your course and speed, as you're on a service","Alter to port and cross ahead of her bow","Keep your course but speed up to cross ahead of her"],
 "She's on your starboard side, so you keep out of the way (Rule 15), with early and substantial action (Rule 16), and avoid crossing ahead of her. Being on a service doesn't change the Rules (Rule 2).",{t:"plot",k:"xstbd"});
SC("scn-x-port","Under power in good visibility, a coaster 3 miles off is on your port bow, on a steady compass bearing and closing.",
 "What do you do?",
 "Keep your course and speed, and watch her",
 ["Alter to port so you pass astern of her","Make a bold turn to starboard straight away","Speed up so you cross well ahead of her"],
 "You're both power-driven and she has you on her starboard side, so she gives way and you stand on (Rules 15 and 17(a)(i)). If it becomes clear she isn't acting, sound at least five short blasts and you may act, but not by turning to port for a vessel on your port side (Rule 17(c)). If collision can't be avoided by her action alone, you must act (17(b)).",{t:"plot",k:"xport"});
SC("scn-head","Night, good visibility, under power. Dead ahead you see these lights, getting closer.",
 "What do you do?",
 "Alter to starboard and sound one short blast",
 ["Alter course to port and sound two short blasts","Hold your course: she must give way to you","Slow down and hold your course until she acts"],
 "You're both power-driven, and with her masthead lights in line and both sidelights showing she's head-on (Rule 14). Both vessels alter to starboard and pass port to port. One short blast means 'I am altering my course to starboard' (Rule 34(a)).",{t:"ship",s:"big_head"});
SC("scn-radar-fwd","Thick fog; nothing in sight. Your radar shows this echo on your starboard bow. Plotting shows its bearing steady and the range closing.",
 "What do you do?",
 "Act early: alter boldly to starboard, or slow down",
 ["Alter course boldly to port, away from the echo","Hold course and speed: you're the stand-on vessel","Speed up so you pass well ahead of her"],
 "In fog there's no stand-on vessel: each vessel that detects a risk of collision acts in ample time (Rule 19(d)). Avoid altering to port for a vessel forward of the beam, unless you're overtaking her. Keep plotting to check your action is working.",{t:"radar",b:35,r:[.98,.86,.74,.62,.5]});
SC("scn-radar-aft","Fog; nothing in sight. Your radar shows this echo on your starboard quarter, closing on a steady bearing.",
 "Which alteration should you avoid?",
 "Turning to starboard, towards her",
 ["Turning to port, away from her","Sounding your fog signal as you turn away","Holding on while you plot her"],
 "Rule 19(d)(ii): avoid altering towards a vessel abeam or abaft your beam. The overtaking rule doesn't apply in fog, because you're not in sight of each other: both vessels must act.",{t:"radar",b:140,r:[.98,.88,.78,.68,.58]});
SC("scn-yacht","You're on exercise in the inshore lifeboat. A yacht under sail alone is on your port bow, crossing, on a steady bearing.",
 "Who keeps out of the way?",
 "You do: power-driven gives way to sail",
 ["The yacht: she has you on her starboard side","The yacht, because you're a lifeboat","Neither: you both alter to starboard"],
 "Rule 18(a): a power-driven vessel underway keeps out of the way of a sailing vessel, whichever side she's on. Rule 15 applies only between two power-driven vessels. It would be different if the yacht were overtaking you.",{t:"plot",k:"yacht"});
SC("scn-trawl","Night. These lights are fine on your starboard bow, getting closer.",
 "What is she, and what do you do?",
 "Trawling: keep out of her way and clear of her gear",
 ["A pilot vessel: hold your course, as she'll keep clear","A vessel not under command: she'll keep clear of you","A power-driven vessel head-on: you both alter to starboard"],
 "Green over white all-round lights: trawling (Rule 26(b)), and her sidelights show she's heading towards you. A power-driven vessel keeps out of the way of a vessel engaged in fishing (Rule 18(a)). Her trawl may be a long way astern.",{t:"ship",s:"trawl",dx:40});
SC("scn-tow","Night. These lights are on your starboard bow, crossing from right to left on a steady bearing. You're the give-way vessel.",
 "How do you pass?",
 "Turn to starboard and pass well astern of the tow",
 ["Pass between the two vessels, where the gap is widest","Turn to starboard and pass just astern of the first vessel","Alter to port and cross ahead of them both"],
 "Three masthead lights in a vertical line: a towing vessel with a tow over 200 m (Rule 24). The second red light is the towed vessel's sidelight. Avoid crossing ahead (Rule 15), and never pass between a tug and her tow.",{t:"ship",s:"tow_side"});
SC("scn-channel","Heading up a narrow channel in the inshore lifeboat, you meet a large ship coming down. She can only navigate safely within the channel.",
 "Where should you be?",
 "Near the channel edge on your starboard side",
 ["In the middle of the channel, in the deepest water","Near the channel edge on your port side","Stopped in the middle until she has passed"],
 "Rule 9(a): keep as near the outer limit of the channel on your starboard side as is safe and practicable. Rule 9(b): a vessel under 20 m must not impede a vessel that can only navigate safely within a narrow channel.",{t:"plot",k:"channel"});
SC("scn-overtake","In a narrow channel you're astern of a slow coaster and want to overtake her on her port side. She'll need to move over to let you by.",
 "What do you sound?",
 "Two prolonged blasts, then two short",
 ["Two prolonged blasts, then one short","One prolonged blast","Five or more short and rapid blasts"],
 "Rule 34(c)(i): two prolonged and two short means 'I intend to overtake you on your port side'. If she agrees she sounds prolonged, short, prolonged, short; if in doubt, five or more short and rapid blasts. You still keep clear as the overtaking vessel (Rule 13).",{t:"plot",k:"overtake"});
SC("scn-tss","A casualty is on the far side of a traffic separation scheme, and you have to cross it.",
 "How do you cross?",
 "Heading at right angles to the traffic flow",
 ["Angled with the traffic, to merge smoothly","On a track at right angles, crabbing into the tide","Along the separation zone until opposite the casualty"],
 "Rule 10(c): it's the heading that should be at right angles, so ships can see what you're doing and you're in the lanes for the shortest time. As a vessel under 20 m, you must not impede a power-driven vessel following a lane (Rule 10(j)).",{t:"plot",k:"tss"});
SC("scn-fog-signal","Fog. You hear one prolonged blast, repeated about every two minutes, apparently forward of your beam. You can't see her.",
 "What do you do?",
 "Slow to steerage way, and stop if necessary",
 ["Alter boldly to port, away from the sound","Keep your speed up to get clear quickly","Sound five short blasts and stand on"],
 "One prolonged blast at intervals of not more than 2 minutes is a power-driven vessel making way (Rule 35(a)). Hearing a fog signal forward of the beam, unless you've established there's no risk of collision, you must slow to steerage way and navigate with extreme caution (Rule 19(e)).",{t:"fog",k:"signal"});
SC("scn-fog-speed","You're tasked to a casualty 5 miles away. Visibility is down to about 200 metres.",
 "What speed do you go?",
 "A safe speed for 200 metres of visibility",
 ["Full speed, because lives are at stake","Full speed, as long as the radar is on","Whatever speed the coastguard asks for"],
 "Rules 6 and 19(b) apply on a service as much as at any other time: a collision on the way helps no one. Use radar properly, put a crew member on lookout, and sound the fog signal.",{t:"fog",k:"plain"});
SC("scn-lookout","Night, on passage at speed. Every crew member is watching the chartplotter and radar screens.",
 "Which rule are you breaking?",
 "Rule 5: no one is keeping a proper lookout",
 ["Rule 6: over 10 knots is too fast at night","Rule 19: you must slow down whenever it's dark","None, as long as the radar is switched on"],
 "Rule 5: every vessel must at all times keep a proper lookout by sight and hearing, as well as by all available means. Electronics support the lookout; they don't replace it.",{t:"ship",s:"dark"});
SC("scn-aground","Night, approaching a harbour channel. You see these lights near the channel edge, not moving.",
 "What is she, and what does it tell you?",
 "Aground: there's shallow water there, so keep clear",

const PL={sea:"#d6eaf5",land:"#efe4c6",edge:"#c4b383",ink:"#33414c",own:"#1b2a49",ownTop:"#f28c28",ship:"#56616d",lane:"#f1dcf0",laneEdge:"#b05cab"};
function plHull(kind){
  if(kind==="ship")return {tip:30,d:"M0 -30 C7 -20 7 -10 7 0 L7 26 L-7 26 L-7 0 C-7 -10 -7 -20 0 -30 Z",fill:PL.ship,deck:`<rect x="-5" y="12" width="10" height="8" rx="1.5" fill="#f4f4ef"/>`};
  if(kind==="yacht")return {tip:13,d:"M0 -13 C4 -7 4.5 0 4 6 L3 11 L-3 11 L-4 6 C-4.5 0 -4 -7 0 -13 Z",fill:"#ffffff",deck:""};
  if(kind==="small")return {tip:8,d:"M0 -8 C3 -4 3 0 3 3 L2.5 7 L-2.5 7 L-3 3 C-3 0 -3 -4 0 -8 Z",fill:"#ffffff",deck:""};
  return {tip:16,d:"M0 -16 C5 -10 5.5 -4 5.5 1 L5 13 L-5 13 L-5.5 1 C-5.5 -4 -5 -10 0 -16 Z",fill:PL.own,deck:`<rect x="-3.2" y="-5" width="6.4" height="9" rx="1.2" fill="${PL.ownTop}"/>`};
}
/* v: {x,y,h (heading, degrees clockwise from up), k: own|ship|yacht|small, vec: heading-line length, sail: "port"|"stbd" (side the boom is on), label, lp:[dx,dy]} */
function plVessel(v){
  const H=plHull(v.k);const L=v.vec===0?0:(v.vec||34);
  const sc=v.k==="yacht"?1.6:v.k==="small"?1.3:1;
  let g=`<g transform="translate(${v.x} ${v.y}) rotate(${v.h||0})">`;
  const tip=H.tip*sc;
  if(L)g+=`<path d="M0 ${-tip-3} L0 ${-tip-L+8}" stroke="${PL.ink}" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M-4.5 ${-tip-L+9} L0 ${-tip-L} L4.5 ${-tip-L+9} Z" fill="${PL.ink}"/>`;
  g+=`<g transform="scale(${sc})"><path d="${H.d}" fill="${H.fill}" stroke="${PL.ink}" stroke-width="${(1.3/sc).toFixed(2)}"/>${H.deck}`;
  if(v.sail){const s=v.sail==="stbd"?1:-1;g+=`<circle cx="0" cy="-3" r="1.4" fill="${PL.ink}"/><path d="M0 -3 Q${s*5} 3 ${s*6.5} 10" fill="none" stroke="${PL.ink}" stroke-width="${(1.8/sc).toFixed(2)}"/>`;}
  g+=`</g></g>`;
  if(v.label)g+=chPill(v.x+(v.lp?v.lp[0]:0),v.y+(v.lp?v.lp[1]:26),v.label.split("|"));
  return g;
}
function plLine(a,b,label,at){const m=at||[(a[0]+b[0])/2,(a[1]+b[1])/2];
  return `<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}" stroke="${CH.mark}" stroke-width="1.6" stroke-dasharray="2 4" stroke-linecap="round"/>${label?chPill(m[0],m[1],label.split("|")):""}`;}
function plWind(x,y,from){const t=(from+180)*Math.PI/180,ux=Math.sin(t),uy=-Math.cos(t);const x1=x-ux*20,y1=y-uy*20,x2=x+ux*20,y2=y+uy*20;
  const px=-uy,py=ux;
  return `<g><path d="M${x1} ${y1} L${x2-ux*7} ${y2-uy*7}" stroke="${PL.ink}" stroke-width="2.2"/><path d="M${x2} ${y2} L${x2-ux*9+px*5} ${y2-uy*9+py*5} L${x2-ux*9-px*5} ${y2-uy*9-py*5} Z" fill="${PL.ink}"/>${chText(x,y-26,"Wind",{s:10.5})}</g>`;}
function miniBuoy(x,y,k){
  const m=MARKS[k];const w=9,h=17;let body="";
  if(m.stripes){for(let i=0;i<4;i++)body+=`<rect x="${x-w/2+i*w/4}" y="${y-h}" width="${w/4}" height="${h}" fill="${COL[m.stripes[i%2]]}"/>`;}
  else{const n=m.bands.length;for(let i=0;i<n;i++)body+=`<rect x="${x-w/2}" y="${y-h+i*h/n}" width="${w}" height="${h/n}" fill="${COL[m.bands[i]]}"/>`;}
  const ts=.45;
  return `<g><ellipse cx="${x}" cy="${y+1}" rx="9" ry="2.6" fill="${PL.ink}" opacity=".18"/>${body}<rect x="${x-w/2}" y="${y-h}" width="${w}" height="${h}" fill="none" stroke="${PL.ink}" stroke-width=".9"/><line x1="${x}" y1="${y-h}" x2="${x}" y2="${y-h-5}" stroke="${PL.ink}" stroke-width="1.2"/><g transform="translate(${x-100*ts} ${y-h-5-74*ts}) scale(${ts})">${topmark(m.top,74)}</g></g>`;
}

function plChannel(){

/* heading-up radar: echo trail along one bearing (relative), ranges as a fraction of the outer ring, oldest first */
function radarSVG(bear,ranges){
  const cx=160,cy=118,R=100;const B=Array.isArray(bear)?bear:ranges.map(()=>bear);const rad=B[B.length-1]*Math.PI/180;
  const pt=(r,i)=>{const a=B[i===undefined?B.length-1:i]*Math.PI/180;return [cx+Math.sin(a)*r*R,cy-Math.cos(a)*r*R];};
  const straight=B.every(x=>x===B[0]),inward=ranges[ranges.length-1]<ranges[0];
  let tr="";ranges.forEach((r,i)=>{const [x,y]=pt(r,i);const last=i===ranges.length-1;tr+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${last?4.5:2.6}" fill="#ffd54f" opacity="${last?1:(.2+.15*i).toFixed(2)}"/>`;});
  const [ex,ey]=pt(ranges[ranges.length-1]);const lx=ex+(Math.sin(rad)>=0?12:-12);const beam=Math.abs(Math.cos(rad))<.35;   // near the beam the trail runs sideways, so label above the echo
  return `<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Radar screen, heading up, with an echo whose trail ${straight?(inward?"runs straight in towards the centre":"runs straight out from the centre"):"shows its bearing changing"}">
<rect width="320" height="240" fill="#0b1620"/>
<circle cx="${cx}" cy="${cy}" r="${R}" fill="#0f2a22" stroke="#3c7a60" stroke-width="1.5"/>
<circle cx="${cx}" cy="${cy}" r="${R/3}" fill="none" stroke="#2c5a47" stroke-dasharray="3 4"/><circle cx="${cx}" cy="${cy}" r="${2*R/3}" fill="none" stroke="#2c5a47" stroke-dasharray="3 4"/>
<path d="M${cx} ${cy} L${cx} ${cy-R}" stroke="#a6e3c6" stroke-width="1.5"/>
<path d="M${cx-60} ${cy} L${cx+60} ${cy}" stroke="#2c5a47" stroke-width="1"/>
<path d="M${cx} ${cy-6} L${cx+4.5} ${cy+5} L${cx-4.5} ${cy+5} Z" fill="#a6e3c6"/>
${tr}
<text x="${beam?ex:lx}" y="${beam?ey-10:ey+4}" text-anchor="${beam?"middle":Math.sin(rad)>=0?"start":"end"}" font-family="Roboto Flex,Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#ffd54f">Echo</text>
<text x="${cx}" y="${cy-R-5}" text-anchor="middle" font-family="Roboto Flex,Roboto,Arial,sans-serif" font-size="10" fill="#a6e3c6">Heading</text>
<text x="10" y="232" font-family="Roboto Flex,Roboto,Arial,sans-serif" font-size="10" fill="#7fb59c">Rings 1 mile apart · faint dots show where the echo was</text>
</svg>`;
}

  const arrow=(x,y,d)=>`<path d="M${x-d*26} ${y-6} L${x+d*8} ${y-6} L${x+d*8} ${y-13} L${x+d*26} ${y} L${x+d*8} ${y+13} L${x+d*8} ${y+6} L${x-d*26} ${y+6} Z" fill="none" stroke="${PL.laneEdge}" stroke-width="2"/>`;
  return `<rect x="0" y="56" width="320" height="42" fill="${PL.lane}"/><rect x="0" y="98" width="320" height="22" fill="url(#hatch)"/><rect x="0" y="120" width="320" height="42" fill="${PL.lane}"/>
    <path d="M0 56 L320 56 M0 162 L320 162" stroke="${PL.laneEdge}" stroke-width="1.2" stroke-dasharray="8 5"/>
    ${flip?arrow(244,77,1)+arrow(76,141,-1):arrow(76,77,-1)+arrow(244,141,1)}${chText(300,112,"Separation zone",{a:"end",s:9.5,c:PL.laneEdge})}`;
}
function plot2SVG(k){
  const P=PLOT2[k];let b="";
  if(P.scene==="channel")b+=plChannel();
  if(P.scene==="tss"||P.scene==="tssflip")b+=tssBase(P.scene==="tssflip");
  if(P.rocks)b+=P.rocks.map(r=>plRock(r[0],r[1],r[2])).join("");
  if(P.wind)b+=plWind(P.wind[0],P.wind[1],P.wind[2]);
  if(P.tow)b+=`<path d="M${P.own.x} ${P.own.y+16} L${P.tow[0]} ${P.tow[1]-9}" stroke="${PL.ink}" stroke-width="1.4"/>`+plVessel({x:P.tow[0],y:P.tow[1],h:0,k:"small",vec:0});
  for(const l of P.lines||[])b+=plLine([l[0],l[1]],[l[2],l[3]],l[4],l.length>5?[l[5],l[6]]:null);
  for(const v of P.others||[])b+=plVessel(v);
  b+=plVessel(Object.assign({k:"own",vec:40,label:"You"},P.own));
  for(const p of P.pills||[])b+=chPill(p[0],p[1],p[2].split("|"));
  return `<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plot from above: ${P.label}"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="${PL.lane}"/><path d="M0 0 L0 8" stroke="${PL.laneEdge}" stroke-width="1.5" opacity=".6"/></pattern></defs><rect width="320" height="240" fill="${PL.sea}"/>${b}</svg>`;
}
/* a sound signal drawn as a timeline: bars for blasts, waves for a bell or gong, dots for single bell strokes */
const SND_DUR={P:5,S:1,B:5,G:5,K:.35};
function soundWords(k){
  const toks=SOUNDS[k].seq.split(" ");const out=[];
  const name={P:"prolonged blast",S:"short blast",B:"rapid ringing of a bell",G:"rapid sounding of a gong",K:"stroke on a bell"},plural={P:"prolonged blasts",S:"short blasts",K:"strokes on a bell"};
  let i=0;while(i<toks.length){const t=toks[i];if(t==="|"){out.push("then");i++;continue;}let n=0;while(toks[i]===t){n++;i++;}
    out.push((n===1?(t==="B"||t==="G"?"":"one "):["","","two ","three ","four ","five "][n])+(n>1?plural[t]:name[t]));}
  return out.join(", ").replace(/, then,/g,", then");
}
function soundSVG(k){
  const S=SOUNDS[k],toks=S.seq.split(" ");
  const items=[];let t=0,prev=null,pauses=[];
  for(const tk of toks){
    if(tk==="|"){pauses.push(t);t+=2.4;prev="|";continue;}
    if(prev&&prev!=="|")t+=(tk==="K"&&prev==="K")?.75:1;
    items.push({tk,t0:t,d:SND_DUR[tk]});t+=SND_DUR[tk];prev=tk;
  }
  const W=268,sc=Math.min(26,W/t),x0=26+(W-t*sc)/2,yc=66;let g="",lab="";
  const X=s=>(x0+s*sc).toFixed(1);
  let kRun=false;
  for(const it of items){
    const xa=x0+it.t0*sc,w=it.d*sc;
    if(it.tk==="P"||it.tk==="S")g+=`<rect x="${xa.toFixed(1)}" y="${yc-7}" width="${w.toFixed(1)}" height="14" rx="3" fill="#202124"/>`;
    else if(it.tk==="B"||it.tk==="G"){const n=Math.max(4,Math.round(w/6)),amp=it.tk==="G"?8:6;let d=`M${xa.toFixed(1)} ${yc}`;for(let i=1;i<=n;i++){d+=` L${(xa+w*i/n).toFixed(1)} ${yc+(i%2?-amp:amp)}`;}
      g+=`<path d="${d}" fill="none" stroke="#202124" stroke-width="${it.tk==="G"?3.4:2.2}" stroke-linejoin="round"/>`;lab+=chText(xa+w/2,yc+26,it.tk==="B"?"Bell":"Gong",{s:10});}
    else if(it.tk==="K"){g+=`<circle cx="${(xa+w/2).toFixed(1)}" cy="${yc}" r="4.2" fill="#202124"/>`;if(!kRun)lab+=chText(xa+w/2,yc+26,"Strokes",{s:10,a:"start"});}
    kRun=it.tk==="K";
  }
  for(const p of pauses)lab+=chText(x0+(p+1.2)*sc,yc+4,"then",{s:10,w:500,c:"#5f6368"});
  const blasts=items.some(i=>i.tk==="P"||i.tk==="S");
  const bg=S.bg==="fog"
    ?`<defs><linearGradient id="sfog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e8ec"/><stop offset="1" stop-color="#c9d2d8"/></linearGradient></defs><rect width="320" height="190" fill="url(#sfog)"/><rect y="132" width="320" height="58" fill="#b7c2c9"/>`
    :`<defs><linearGradient id="sclr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${DV.sky1}"/><stop offset="1" stop-color="${DV.sky2}"/></linearGradient></defs><rect width="320" height="190" fill="url(#sclr)"/><rect y="132" width="320" height="58" fill="${DV.sea1}"/>`;
  return `<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sound signal heard: ${soundWords(k)}. ${S.rep}">${bg}
<rect x="12" y="12" width="296" height="110" rx="12" fill="#ffffff" fill-opacity=".94"/>
${chText(26,32,"What you hear",{a:"start",s:11,w:700,c:"#3c4043"})}${chText(294,32,S.rep,{a:"end",s:10.5,w:500,c:"#3c4043"})}
${g}${lab}
${blasts?chText(160,114,"Short blast about 1 second · prolonged blast 4 to 6 seconds",{s:9.5,w:400,c:"#5f6368"}):""}
<path d="M118 190 L160 156 L202 190 Z" fill="${PL.own}"/><path d="M146 190 L160 172 L174 190 Z" fill="${PL.ownTop}"/>
</svg>`;
}

/* ================= 50 MORE RNLI CARDS ================= */
/* ---- Rule 3 definitions ---- */
C("co-21","core","Under Rule 3, when is a vessel 'underway'?",
 "When she isn't at anchor, made fast to the shore, or aground",
 ["Only when she is moving through the water under power","Only while her engine or sails are driving her forward","Whenever she's away from her berth, including at anchor"],
 "Rule 3(i). A vessel drifting with her engine stopped is still underway, though not making way, so she shows the lights for a vessel underway.");
C("co-22","core","A yacht has her sails up and her engine running in gear. What is she under the Rules?",
 "A power-driven vessel",
 ["A sailing vessel, because her sails are set","A vessel restricted in her ability to manoeuvre","A sailing vessel until she lowers her mainsail"],
 "Rule 3(b) and (c): a sailing vessel is one under sail with any propelling machinery not being used. Motor-sailing makes her power-driven, and by day she shows a cone, point down, forward (Rule 25(e)).");
C("co-23","core","A yacht is trolling a fishing line astern. Is she 'engaged in fishing' under the Rules?",
 "No: trolling lines don't restrict her manoeuvrability",
 ["Yes: any vessel with a fishing line out is fishing","Yes, but only between sunset and sunrise","Only if she also shows two cones, points together"],
 "Rule 3(d): engaged in fishing means using nets, lines, trawls or other gear that restricts manoeuvrability. It doesn't include trolling lines or other gear that doesn't.");
C("co-24","core","Which of these is 'restricted in her ability to manoeuvre' under Rule 3(g)?",
 "A vessel laying a cable or servicing a navigation mark",
 ["A vessel drifting because her engine has broken down","A deep-draught tanker confined to a narrow dredged channel","A trawler towing her nets slowly along the seabed"],
 "Rule 3(g) covers work that limits her: navigation marks, cables or pipelines; dredging, surveying or underwater work; transfers underway; launching or recovering aircraft; mine clearance; and towing that severely restricts her. An engine failure makes a vessel not under command (Rule 3(f)); the tanker is constrained by her draught (Rule 3(h)); the trawler is engaged in fishing.");
C("co-25","core","Under Rule 3, when are vessels 'in sight of one another'?",
 "Only when one can be seen visually from the other",
 ["When either can detect the other on radar","When they are within 2 miles of each other","When either can hear the other's fog signal clearly"],
 "Rule 3(k). Radar contact alone doesn't count, which is why Rule 19 covers vessels not in sight of one another in restricted visibility.");
C("co-26","core","What does 'restricted visibility' mean in the Rules?",
 "Visibility cut by fog, mist, falling snow, heavy rain or similar",
 ["Any time between sunset and sunrise, even on a perfectly clear night","Visibility of less than a mile, measured from the bridge","Any conditions in which your radar is giving poor returns"],
 "Rule 3(l). Darkness alone isn't restricted visibility: at night you rely on lights, and the rules for vessels in sight of one another still apply.");
/* ---- Rule 10 and Rule 19 ---- */
C("ts-16","tss","Following a traffic lane, which way should you go?",
 "In the general direction of traffic flow for that lane",
 ["Whichever way is shortest, keeping to the right edge","Against the flow, so you can see oncoming ships","Either way, as long as you keep to the centre"],
 "Rule 10(b)(i).");
C("ts-17","tss","In a traffic separation scheme, what should you keep clear of, so far as practicable?",
 "The separation line or separation zone",
 ["The outer edge of an inshore traffic zone","The centre line of your own traffic lane","The coast on your starboard side"],
 "Rule 10(b)(ii). Apart from crossing, joining or leaving, you shouldn't normally enter a separation zone except in an emergency or to fish in it (Rule 10(e)).");
C("ts-18","tss","A vessel engaged in fishing is in a traffic lane. What must she not do?",
 "Impede the passage of any vessel following the lane",
 ["Fish anywhere within the traffic scheme","Show her fishing lights or shapes while she's in the lane","Proceed in the general direction of traffic flow"],
 "Rule 10(i). Being engaged in fishing gives her no right of way over vessels following the lane.");
C("ts-19","tss","A vessel servicing a navigation buoy in a traffic separation scheme is restricted in her ability to manoeuvre. Does Rule 10 bind her?",
 "Not as far as her work requires",
 ["Fully: she must follow the lane's direction","Only if she is longer than 20 metres","Yes: she must move to the separation zone"],
 "Rule 10(k) and (l): vessels restricted in their ability to manoeuvre while maintaining navigational safety, or laying, servicing or picking up a cable, are exempt from Rule 10 to the extent necessary for the work.");
C("ts-20","tss","Crossing a traffic lane with a strong tidal stream setting you along it, what should be at right angles to the traffic flow?",
 "Your heading, even if your track isn't",
 ["Your track over the ground, adjusting your heading","Neither: aim for the shortest time in the lane","Your track through the water, ignoring the stream"],
 "Rule 10(c) asks for a heading as nearly as practicable at right angles to the general direction of traffic flow. That shows your aspect clearly to ships in the lane and gets you across quickly, even though the stream sets you sideways.");
C("ts-21","tss","In restricted visibility, what speed must every vessel go at?",
 "A safe speed adapted to the visibility and conditions",
 ["Half her normal service speed, whatever the visibility","No more than 5 knots, whatever her size or type","The slowest speed at which she can still keep steering"],
 "Rule 19(b), with Rule 6. A power-driven vessel must also have her engines ready for immediate manoeuvre.");

C("st-22","steer","In a narrow channel, a vessel engaged in fishing must not do what?",
 "Impede any other vessel navigating within the channel",
 ["Fish anywhere in the channel, even when it's empty","Show her fishing lights or shapes while she's in it","Keep to the starboard side of the channel at any time"],
 "Rule 9(c).");
C("st-23","steer","When must you not cross a narrow channel?",
 "When it would impede a vessel that can only navigate within it",
 ["Never: crossing any narrow channel is always forbidden by the Rules","Only at night, or in restricted visibility","Only when you are less than 20 metres long"],

C("st-24","steer","Under Rule 9, where should you avoid anchoring, if circumstances allow?",

C("st-25","steer","A vessel engaged in fishing is overtaking a power-driven vessel. Who keeps out of the way?",

 ["The power-driven vessel, as fishing has priority","Neither: both should alter to starboard","The vessel with the other on her starboard side"],

C("st-26","steer","You're overtaking a vessel and, as you draw ahead, she ends up on your port beam. Is it now a crossing situation?",
 "No: you keep clear until finally past and clear",

C("st-27","steer","By night, when does a head-on situation exist?",
 "When you see her masthead lights in line, and/or both sidelights, ahead",

C("st-28","steer","In doubt whether a situation is head-on, what should you assume?",

C("st-29","steer","Underway, a vessel engaged in fishing should keep out of the way of which vessels, so far as possible?",
 "Vessels not under command or restricted in ability to manoeuvre",

C("li-17","lights","What is an 'all-round light'?",
 "A light showing an unbroken arc of 360°",

C("li-18","lights","Under Rule 21, what is a 'flashing light'?",
 "One flashing regularly at 120 or more flashes a minute",

C("li-19","lights","Between sunset and sunrise, which other lights may you show besides your navigation lights?",

C("li-20","lights","A hovercraft operating in non-displacement mode shows what extra light?",

C("li-22","lights","What is the minimum range of the masthead light on a vessel of 20 m to under 50 m?",

C("li-23","lights","What is the minimum range of the sternlight on a vessel of 50 m or more?",

C("li-24","lights","A power-driven vessel of 40 m is underway. Must she show a second masthead light?",

C("ot-28","other","A pusher and the barge ahead of it are rigidly connected as a composite unit. How do they show lights?",

C("ot-30","other","A small diving boat can't show the full shapes for diving operations. What must she show instead?",

C("ot-33","other","Which sound appliances must a vessel of 20 m to under 100 m carry?",

C("mk-12","marks","Which marks show a white light?",

C("cv-21","cevni","What does CEVNI sign E.5 mean?",

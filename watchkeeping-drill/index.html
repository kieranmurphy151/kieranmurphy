<style>
/* Bright-only by design: white app surfaces in every viewer theme; only the night-time scenes are dark.
   Layout: one column of white surfaces separated by hairlines. One hero card starts the round; Settings, Progress and About open as bottom sheets (dialogs on wide screens). */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f8f9fa; --surface-3:#f1f3f4; --line:#dadce0; --ink:#202124; --muted:#5f6368;
  --primary:#1a73e8; --on-primary:#ffffff; --primary-soft:#e8f0fe; --primary-text:#1967d2;
  --ok:#188038; --ok-soft:#e6f4ea; --ok-ink:#0d652d; --bad:#d93025; --bad-soft:#fce8e6; --bad-ink:#b3261e; --mid:#8a4b00; --mid-soft:#fef3d4; --mid-line:#f9ab00; --scrim:rgba(32,33,36,.4); --shadow:rgba(60,64,67,.18);
  --c-core:#1a73e8; --c-tss:#12a4af; --c-steer:#4355b9; --c-lights:#e37400; --c-other:#9334e6;
  --c-lateral:#d93025; --c-cardinal:#f9ab00; --c-marks:#d01884; --c-chars:#7cb342; --c-cevni:#1e8e3e;
  --c-seaman:#8d6e63; --c-navi:#546e7a; --c-tide:#00838f; --c-pilot:#9e9d24; --c-met:#5c6bc0; --c-safety:#bf360c; --c-scen:#ea4335; --c-spot:#00a3c4;
  --font:"Roboto Flex","Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.app{max-width:40rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;display:flex;flex-direction:column;gap:20px}

/* top app bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:64px;border-bottom:1px solid var(--line)}

.ibtn:hover{background:var(--surface-3)}
.lin{flex:1;height:4px;border-radius:2px;background:var(--primary-soft);overflow:hidden}
.lin i{display:block;height:100%;background:var(--primary);border-radius:2px;transition:width .3s cubic-bezier(.2,0,0,1)}
.count{font-family:var(--mono);font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}

/* buttons */
.btn{height:48px;border-radius:24px;border:0;padding:0 24px;font-weight:500;font-size:1rem;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn svg{width:20px;height:20px;flex:none}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-filled:hover:not(:disabled){box-shadow:0 1px 2px var(--shadow),0 2px 6px 2px var(--shadow)}
.btn-tonal{background:var(--primary-soft);color:var(--primary-text)}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--primary-text)}
.btn-text{background:transparent;color:var(--primary-text);padding:0 12px}
.btn-text:hover,.btn-outline:hover{background:var(--surface-2)}
.btn.big{height:56px;border-radius:28px;font-size:1.0625rem;width:100%}
.btn.big svg{width:22px;height:22px}
.btn.block{width:100%}
.btn.sm{height:36px;border-radius:18px;padding:0 14px;font-size:.875rem}
.btn:disabled{opacity:.38;cursor:default}
.danger{background:var(--bad);color:#fff}
.danger-text{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--primary-text);font-weight:500;cursor:pointer;font-size:inherit}
.link:hover{text-decoration:underline}

/* home */
.hero{border:1px solid var(--line);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:20px;background:var(--surface);margin-top:8px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.hero-txt{min-width:0}
.overline{font-size:.875rem;font-weight:500;color:var(--primary-text);margin:0}
.hero h1{font-size:2.75rem;line-height:1.1;font-weight:400;margin:6px 0 12px;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-size:.875rem;font-weight:500;color:var(--ink);white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .trk{stroke:var(--surface-3)} .ring .lrn{stroke:var(--primary-soft)} .ring .mst{stroke:var(--ok)}
.ring .lbl{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-content:center;text-align:center;font-size:1.25rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.ring .lbl small{display:block;font-size:.6875rem;font-weight:400;color:var(--muted)}
.from{margin:-6px 0 0;text-align:center;font-size:.875rem;color:var(--muted)}
.sect{font-size:.875rem;font-weight:500;color:var(--muted);margin:4px 4px 8px}
.list{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.lrow{display:grid;grid-template-columns:40px 1fr 24px;align-items:center;gap:16px;width:100%;min-height:68px;padding:10px 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.lrow + .lrow{border-top:1px solid var(--line)}
.lrow:hover{background:var(--surface-2)}
.lrow .ic{width:40px;height:40px;border-radius:50%;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center}
.lrow .ic svg{width:20px;height:20px}
.ltxt{min-width:0}
.ltxt b{display:block;font-weight:500}
.ltxt small{display:block;color:var(--muted);font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);display:grid;place-items:center}
.chev svg{width:20px;height:20px}

/* picture answers and chart scenes */
.opts.vis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt.optimg{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px;min-height:0}
.opt.optimg .k{position:absolute;top:12px;left:12px;z-index:1;background:var(--surface)}
.optimg .img svg{display:block;width:100%;height:auto;border-radius:10px}
.optimg .cap{font-size:.8125rem;line-height:1.3;text-align:center;color:var(--ink)}
.ansimg{width:min(170px,55%);margin:4px 0}
.ansimg svg{display:block;width:100%;height:auto;border-radius:12px}
.fig.chart{background:#d6eaf5}
/* study mode switch */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--line);border-radius:26px;background:var(--surface-2)}
.modes button{height:44px;border:0;border-radius:22px;background:transparent;color:var(--muted);font-weight:500;font-size:.9375rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-width:0}
.modes button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modes button svg{width:18px;height:18px;flex:none}
/* four modes: one row; on phones the icon sits above the label */
@media (max-width:440px){.seg[role="radiogroup"] svg{display:none}.seg button{white-space:nowrap}}

.modes button[aria-checked="true"]{background:var(--surface);color:var(--primary-text);box-shadow:0 1px 2px var(--shadow),0 1px 3px 1px rgba(60,64,67,.1)}
.mode-hint{margin:-8px 0 0;text-align:center;font-size:.875rem;color:var(--muted)}
/* flashcards: tap to flip, swipe to rate */
body[data-view="quiz"][data-style="cards"] .app{padding-bottom:max(12px,env(safe-area-inset-bottom,0px));overflow-x:hidden;overflow-x:clip}
.fcv{display:flex;flex-direction:column;gap:12px;height:calc(100vh - 86px - env(safe-area-inset-top,0px) - max(12px,env(safe-area-inset-bottom,0px)));height:calc(100dvh - 86px - env(safe-area-inset-top,0px) - max(12px,env(safe-area-inset-bottom,0px)));min-height:260px;max-height:780px}
.fc-stage{position:relative;flex:1;min-height:0;display:flex;animation:fcIn .22s cubic-bezier(.2,0,0,1)}
@keyframes fcIn{from{opacity:0;transform:translateY(10px) scale(.98)}}
.fc{position:relative;flex:1;min-width:0;display:flex;border:1px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:0 1px 3px rgba(60,64,67,.12),0 4px 12px rgba(60,64,67,.08);touch-action:pan-y;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .16s cubic-bezier(0,0,.2,1),border-color .15s,box-shadow .15s}
.fc.dragging{transition:border-color .15s;box-shadow:0 4px 8px 3px rgba(60,64,67,.15),0 1px 3px rgba(60,64,67,.3);cursor:grabbing}
.fc.spring{transition:transform .3s cubic-bezier(.2,1.35,.4,1),border-color .15s}
.fc.flip-out{transform:perspective(1400px) rotateY(90deg);transition:transform .14s cubic-bezier(.4,0,1,1)}
.fc.flip-in{transform:perspective(1400px) rotateY(-90deg);transition:none}
.fc.leave{transition:transform .22s cubic-bezier(.4,0,1,1),opacity .22s;opacity:0}
.fc[data-dir="easy"]{border-color:var(--ok)} .fc[data-dir="medium"]{border-color:var(--mid-line)} .fc[data-dir="difficult"]{border-color:var(--bad)}
.fc.nudge{animation:fcNudge 1.3s cubic-bezier(.4,0,.2,1) .3s}
@keyframes fcNudge{0%,100%{transform:none}22%{transform:translateX(28px) rotate(2deg)}52%{transform:translateX(-28px) rotate(-2deg)}76%{transform:none}}
.fc.nudge .s-easy{animation:stampE 1.3s .3s} .fc.nudge .s-difficult{animation:stampD 1.3s .3s}
@keyframes stampE{0%{opacity:0}22%{opacity:.8}40%,100%{opacity:0}}
@keyframes stampD{0%,34%{opacity:0}52%{opacity:.8}70%,100%{opacity:0}}
.fc-face{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:16px 20px 18px;border-radius:inherit}
.fc-face.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 44px),transparent);mask-image:linear-gradient(#000 calc(100% - 44px),transparent)}
.fc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.fc-top .chip{min-width:0;flex:0 1 auto}
.chip .cn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side{flex:none;font-size:.75rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.side.ans-side{color:var(--primary-text)}
.fc-in{margin:auto 0;display:flex;flex-direction:column;gap:16px}
.fc .q{text-align:center}
.fc-in.back{gap:10px}
.fc-qsmall{margin:0;font-size:.9375rem;line-height:1.45;color:var(--muted)}
.ans{margin:0;font-size:1.375rem;font-weight:500;line-height:1.35;color:var(--ink)}
.fc-in.back .ex{font-size:.9375rem}
.fc-tap{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;margin:0;font-size:.875rem;color:var(--muted)}
.fc-tap svg{width:18px;height:18px;flex:none}
.fc-tap.pulse{animation:tapPulse .45s 3 ease-in-out}
@keyframes tapPulse{50%{color:var(--primary-text);transform:scale(1.08)}}
.stamp{position:absolute;top:68px;z-index:2;padding:2px 14px;border:3px solid currentColor;border-radius:12px;font-size:1.375rem;font-weight:700;background:rgba(255,255,255,.94);pointer-events:none;opacity:0}
.s-easy{left:18px;color:var(--ok);transform:rotate(-10deg);opacity:var(--pe,0)}
.s-difficult{right:18px;color:var(--bad);transform:rotate(10deg);opacity:var(--pd,0)}
.s-medium{left:50%;color:var(--mid);transform:translateX(-50%);opacity:var(--pm,0)}
.ansimg{width:min(170px,55%);margin:2px auto}
.ansimg svg{display:block;width:100%;height:auto;border-radius:12px}
.fc-bar{flex:none;display:flex;flex-direction:column;gap:8px}
.rate-q{margin:0;text-align:center;font-size:.9375rem;font-weight:500}
.rate-h{margin:-6px 0 0;text-align:center;font-size:.8125rem;color:var(--muted)}
.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:56px;padding:4px;border:0;border-radius:16px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.rate .rl{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:1rem;line-height:1.3}
.rate .rl svg{width:18px;height:18px;flex:none}
.rate small{font-size:.75rem;line-height:1.3}
.rate.difficult{background:var(--bad-soft);color:var(--bad-ink)}
.rate.medium{background:var(--mid-soft);color:var(--mid)}
.rate.easy{background:var(--ok-soft);color:var(--ok-ink)}
.rate:hover{box-shadow:0 1px 2px var(--shadow),0 1px 3px 1px rgba(60,64,67,.1)}
.rate.hot{transform:scale(1.05);box-shadow:inset 0 0 0 2px currentColor}
@media (max-height:720px){.fc .fig svg{max-height:190px}.fc .q{font-size:1.25rem}}
@media (max-height:520px){.fc-bar .rate-q,.fc-bar .rate-h{display:none}.fc .fig svg{max-height:120px}.fc-face{padding:12px 16px}.fc .q{font-size:1.125rem}.fcv{gap:8px}}
/* flashcard guide */
.glead{margin:0 0 4px;font-size:.9375rem;line-height:1.5}
.gstep{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;padding:12px 0}
.gstep + .gstep{border-top:1px solid var(--line)}
.gstep b{display:block;font-weight:500}
.gstep p{margin:2px 0 0;font-size:.875rem;line-height:1.45;color:var(--muted)}
.gnote{margin:12px 0 0;font-size:.875rem;line-height:1.45;color:var(--muted)}
.gdemo{position:relative;width:72px;height:72px;border-radius:16px;background:var(--surface-3);overflow:hidden;perspective:200px}
.gdemo .mc{position:absolute;left:22px;top:12px;width:28px;height:40px;border-radius:6px;background:#fff;border:2px solid #c4c7c5;box-shadow:0 1px 2px var(--shadow)}
.gdemo .mc::before{content:"";position:absolute;left:5px;right:5px;top:8px;height:3px;border-radius:2px;background:#dadce0;box-shadow:0 7px 0 #dadce0,0 14px 0 #dadce0}
.gdemo .ar{position:absolute;display:grid;place-items:center;width:20px;height:20px}
.gdemo .ar svg{width:20px;height:20px}
.gdemo.easy .ar{right:1px;top:22px;color:var(--ok)}
.gdemo.difficult .ar{left:1px;top:22px;color:var(--bad)}
.gdemo.medium .ar{left:26px;bottom:0;color:var(--mid)}
.gdemo .finger{position:absolute;left:28px;top:24px;width:16px;height:16px;border-radius:50%;background:rgba(26,115,232,.5)}
.gdemo.tap .mc{animation:gFlip 2.6s ease-in-out infinite}
.gdemo.tap .finger{animation:gTap 2.6s ease-out infinite}
.gdemo.easy .mc{animation:gEasy 2.6s ease-in infinite}
.gdemo.difficult .mc{animation:gDiff 2.6s ease-in infinite}
.gdemo.medium .mc{animation:gMed 2.6s ease-in infinite}
@keyframes gTap{0%,6%{transform:scale(.4);opacity:0}16%{transform:scale(1);opacity:1}30%,100%{transform:scale(1.7);opacity:0}}
@keyframes gFlip{0%,20%{transform:none}34%{transform:rotateY(90deg)}48%,100%{transform:none}}
@keyframes gEasy{0%,24%{transform:none;opacity:1;border-color:#c4c7c5}58%{transform:translateX(36px) rotate(14deg);opacity:0;border-color:var(--ok)}59%,72%{transform:none;opacity:0;border-color:#c4c7c5}88%,100%{transform:none;opacity:1}}
@keyframes gDiff{0%,24%{transform:none;opacity:1;border-color:#c4c7c5}58%{transform:translateX(-36px) rotate(-14deg);opacity:0;border-color:var(--bad)}59%,72%{transform:none;opacity:0;border-color:#c4c7c5}88%,100%{transform:none;opacity:1}}
@keyframes gMed{0%,24%{transform:none;opacity:1;border-color:#c4c7c5}58%{transform:translateY(34px);opacity:0;border-color:var(--mid-line)}59%,72%{transform:none;opacity:0;border-color:#c4c7c5}88%,100%{transform:none;opacity:1}}
/* round summary for flashcards */
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tally div{border-radius:16px;padding:14px 6px;text-align:center}
.tally b{display:block;font-size:2rem;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:.875rem;font-weight:500}
.t-easy{background:var(--ok-soft);color:var(--ok-ink)} .t-medium{background:var(--mid-soft);color:var(--mid)} .t-difficult{background:var(--bad-soft);color:var(--bad-ink)}
/* scenarios */
.sit{margin:0;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:.9375rem;line-height:1.5}
.prog-h{margin:18px 0 0;font-size:.875rem;font-weight:500;color:var(--primary-text)}
/* quiz */
.card{border:1px solid var(--line);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px;background:var(--surface);margin-top:8px}
.tchip{align-self:flex-start}
.fig{margin:0;border-radius:16px;overflow:hidden;background:#07101a}
.fig svg{display:block;width:100%;height:auto;max-height:300px}
.fig.day{background:#cfe2ec}
.fig.solo{width:min(100%,273px);margin-inline:auto}
.figbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:.8125rem;color:var(--muted);margin-top:-6px}
.watch{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.q{font-size:1.375rem;line-height:1.35;font-weight:500;margin:0;text-wrap:pretty;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:center;width:100%;min-height:56px;text-align:left;padding:10px 16px 10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;line-height:1.4}
.opt .k{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:500;font-size:.875rem;color:var(--muted)}
.opt .k svg{width:18px;height:18px}
.opt span{min-width:0}
.opt:hover:not(:disabled){background:var(--surface-2);border-color:var(--muted)}
.opt:disabled{cursor:default}

function inCourse(d,c){if(d.g==="scen"||d.g==="spot")return false;return c==="both"||(c==="rnli"?d.c.includes("r"):d.c.includes("d"));}

function pad(seq,period){const tot=seq.reduce((s,x)=>s+x[1],0);if(period>tot+1e-9){const last=seq[seq.length-1];if(last[0]===null)last[1]+=period-tot;else seq.push([null,period-tot]);}return seq;}

const CARDS=[];const BYID={};
/* vis: answer options drawn as pictures; fl: wording used in flashcard mode */
function C(id,deck,q,a,o,ex,img,vis,fl){const c={id,deck,q,a,o,ex,img,vis};if(fl){if(fl.q)c.fq=fl.q;if(fl.a)c.fa=fl.a;if(fl.x)c.fx=fl.x;}CARDS.push(c);}

function an(s){return (/^[aeiou]/i.test(s)?"an ":"a ")+s;}
function lc(s){return s.charAt(0).toLowerCase()+s.slice(1);}

/* ---- generated mark cards: pictures wherever they help ---- */
function markOpts(k,field){
  const m=MARKS[k],ans=m[field];const out=[];
  for(const c of m.conf){const v=MARKS[c][field];if(v!==ans&&!out.includes(v))out.push(v);}
  for(const kk of Object.keys(MARKS)){if(out.length>=3)break;const v=MARKS[kk][field];if(v!==ans&&!out.includes(v))out.push(v);}
  return out.slice(0,3);
}
function keyOf(field,txt){return Object.keys(MARKS).find(x=>MARKS[x][field]===txt);}
function visFor(type,field,texts){const keys={};for(const t of texts)keys[t]=keyOf(field,t);return {type,keys};}
for(const k of Object.keys(MARKS)){
  const m=MARKS[k];
  const sum=`${m.name}: ${lc(m.colText)}; topmark ${lc(m.topText)}; light ${lc(m.lightText)}. ${m.note}`;
  const full=`${sum} Meaning: ${lc(m.meaning)}.`;
  C(`m-${k}-day`,m.deck,"What mark is this?",m.name,markOpts(k,"name"),full,{t:"buoy",m:k});
  C(`m-${k}-night`,m.deck,"You see this light on a buoy at night. Time it with the stopwatch. What mark is it?",m.name,markOpts(k,"name"),`${m.name}: light ${lc(m.lightText)}. ${m.note} Meaning: ${lc(m.meaning)}.`,{t:"night",m:k});
  const pickO=markOpts(k,"name");
  C(`m-${k}-pick`,m.deck,`Which of these is ${an(m.short)}?`,m.name,pickO,full,null,visFor("buoy","name",[m.name,...pickO]),{q:`What does ${an(m.short)} look like?`});
  const colO=markOpts(k,"colText");
  C(`m-${k}-col`,m.deck,`Which of these has the colours of ${an(m.short)}? Topmarks are hidden.`,m.colText,colO,sum,null,visFor("body","colText",[m.colText,...colO]),{q:`What colours does ${an(m.short)} have?`});
  const topO=markOpts(k,"topText");
  C(`m-${k}-top`,m.deck,`Which topmark does ${an(m.short)} carry?`,m.topText,topO,sum,null,visFor("top","topText",[m.topText,...topO]));
  C(`m-${k}-light`,m.deck,"What light does this mark show at night?",m.lightText,markOpts(k,"lightText"),sum,{t:"buoy",m:k});
  C(`m-${k}-mean`,m.deck,"What does this mark tell you?",m.meaning,markOpts(k,"meaning"),full,{t:"buoy",m:k});
}

/* a can-shaped special mark: in a channel its shape mustn't clash with the lateral marks */
function spotAct(k,sh){return SPOT[k].act+(k==="special"&&sh==="can"?". In a channel its shape mustn't clash with the lateral marks, so a can-shaped one sits on the port-hand side: going in the direction of buoyage, leave it to port":"");}
function spotEx(k,sh){const t=SPOT[k];return `${t.look}. ${spotAct(k,sh)}. Shown here as ${an(SHAPE_NAME[sh])}. Tip: ${lc(t.tip)}`;}
/* the feedback in Buoys mode is set out as three short lines */
function spotParts(k,sh){const t=SPOT[k];return [["Look for",`${t.look}. Shown here as ${an(SHAPE_NAME[sh])}.`],["What to do",`${spotAct(k,sh)}.`],["Remember",t.tip]];}
function spotCard(id,q,k,sh,img){C(id,"spot",q,MARKS[k].name,markOpts(k,"name"),spotEx(k,sh),img);CARDS[CARDS.length-1].xp=spotParts(k,sh);}
for(const k of Object.keys(MARKS))for(const sh of MARKS[k].shapes)spotCard(`bs-${k}-${sh}`,"What mark is this?",k,sh,{t:"spot",m:k,sh});
SPOT_FAR.forEach(([k,sh,x,z],i)=>spotCard(`bs-far-${i+1}`,"You see this mark ahead. What is it?",k,sh,{t:"spot",m:k,sh,far:[x,z]}));
/* ---- Buoys mode, part two: beacons, silhouettes into the sun, picture choices, marks near the coast ---- */
function spotAdd(id,q,k,parts,img,vis){
  C(id,"spot",q,MARKS[k].name,markOpts(k,"name"),`${parts[0][1]} ${parts[1][1]} Tip: ${lc(parts[2][1])}`,img,vis);
  CARDS[CARDS.length-1].xp=parts;}
const BEACON_LOOK={
 port:"Red, with a single red can (cylinder) topmark",
 stbd:"Green, with a single green cone topmark, point up",
 pcs:"Red with one broad green band, and a red can topmark",
 pcp:"Green with one broad red band, and a green cone topmark",
 N:"Black above yellow, with two black cones both pointing up",
 E:"Black, yellow, black, with two black cones base to base",
 S:"Yellow above black, with two black cones both pointing down",
 W:"Yellow, black, yellow, with two black cones point to point",
 iso:"Black with a broad red band, and two black spheres on top",
 special:"Yellow, with a yellow X topmark"
};
const BEACON_STYLE={tower:"a beacon tower on a rock",post:"a post beacon fixed in the seabed"};
const BEACONS=[["port","tower"],["port","post"],["stbd","tower"],["stbd","post"],["pcs","tower"],["pcp","tower"],["N","tower"],["N","post"],["E","tower"],["E","post"],
 ["S","tower"],["S","post"],["W","tower"],["W","post"],["iso","tower"],["iso","post"],["special","tower"],["special","post"]];
for(const [k,st] of BEACONS)spotAdd(`bs-bc-${k}-${st}`,"What mark is this beacon?",k,
  [["Look for",`${BEACON_LOOK[k]}. Shown here as ${BEACON_STYLE[st]}: fixed marks use the same colours and topmarks as buoys.`],["What to do",`${SPOT[k].act}.`],["Remember",SPOT[k].tip]],
  {t:"spot",m:k,bc:st});
const SIL_LOOK={N:"Two cones on top, both pointing up",E:"Two cones on top, base to base",S:"Two cones on top, both pointing down",W:"Two cones on top, point to point",
 iso:"Two spheres on top",safe:"A single sphere on top",special:"An X on top",wreck:"An upright cross (+) on top"};
const SIL_TIP={iso:"One sphere on top means safe water; two spheres mean an isolated danger.",safe:"One sphere on top means safe water; two spheres mean an isolated danger.",
 special:"An X on top is a special mark; an upright cross is an emergency wreck mark.",wreck:"An upright cross on top is an emergency wreck mark; an X is a special mark."};
const SILS=[["N","pillar"],["N","spar"],["E","pillar"],["E","spar"],["S","pillar"],["S","spar"],["W","pillar"],["W","spar"],["iso","pillar"],["iso","spar"],
 ["safe","pillar"],["safe","spar"],["special","pillar"],["special","spar"],["wreck","pillar"]];
for(const [k,sh] of SILS)spotAdd(`bs-sil-${k}-${sh}`,"Looking into a low sun, you can only make out this outline. What mark is it?",k,
  [["Look for",`${SIL_LOOK[k]}. Into the sun the colours disappear, so the topmark is your best clue. Shown here as ${an(SHAPE_NAME[sh])}.`],["What to do",`${SPOT[k].act}.`],["Remember",SIL_TIP[k]||SPOT[k].tip]],
  {t:"spot",m:k,sh,sil:true});
/* "which of these" with buoys in their own shapes: cans and cones for the lateral family, spars for the rest */
const PICK_SHAPE={port:"can",stbd:"cone",pcs:"can",pcp:"cone",N:"spar",E:"spar",S:"spar",W:"spar",iso:"spar",safe:"spar",special:"spar",wreck:"spar"};
for(const k of Object.keys(MARKS)){
  const o=markOpts(k,"name"),names=[MARKS[k].name,...o],keys={},shapes={};
  for(const nm of names){const kk=keyOf("name",nm);keys[nm]=kk;shapes[nm]=PICK_SHAPE[kk];}
  spotAdd(`bs-pick-${k}`,`Which of these is ${an(MARKS[k].short)}?`,k,
    [["Look for",`${SPOT[k].look}.`],["What to do",`${SPOT[k].act}.`],["Remember",SPOT[k].tip]],null,{type:"buoyshape",keys,shapes});
}
/* near the coast: [mark, shape, across the view, size, coastline] */
const SPOT_COAST=[["port","can",118,.48,"right"],["N","pillar",150,.46,"left"],["special","can",176,.48,"beach"],["iso","pillar",166,.46,"both"],["safe","sphere",150,.48,"far"]];
SPOT_COAST.forEach(([k,sh,x,z,co],i)=>spotAdd(`bs-coast-${i+1}`,"You see this mark ahead, near the coast. What is it?",k,spotParts(k,sh),{t:"spot",m:k,sh,far:[x,z],coast:co}));


/* ---- chart scenes: pick the right buoy for the spot ---- */
const SIDE={N:"north",E:"east",S:"south",W:"west"};
const NM=k=>MARKS[k].name;
const pickVis=keys=>visFor("buoy","name",keys.map(NM));
for(const d of ["N","E","S","W"]){
  const others=["N","E","S","W"].filter(x=>x!==d);
  C(`sc-card-${d}`,"cardinal",`Which mark belongs at the ? on the ${SIDE[d]} side of this rock?`,NM(d),others.map(NM),
    `A cardinal mark goes in the quadrant it's named after, and you pass on that side of it. The ? is on the ${SIDE[d]} side, so it's ${an(SIDE[d]+" cardinal")}: ${lc(MARKS[d].colText)}, topmark ${lc(MARKS[d].topText)}.`,
    {t:"chart",k:"cardinal",v:d},pickVis([d,...others]));
}
C("sc-lat-L","lateral","Heading in from sea, which mark belongs at the ? on the left-hand side of the channel?",NM("port"),[NM("stbd"),NM("pcs"),NM("pcp")],
  "Coming in from sea is the direction of buoyage. The left-hand side of the channel is then your port side, marked by red port-hand marks: can-shaped, or with a red can topmark.",
  {t:"chart",k:"lateral",v:"L"},pickVis(["port","stbd","pcs","pcp"]));
C("sc-lat-R","lateral","Heading in from sea, which mark belongs at the ? on the right-hand side of the channel?",NM("stbd"),[NM("port"),NM("pcs"),NM("pcp")],
  "Coming in from sea is the direction of buoyage. The right-hand side of the channel is then your starboard side, marked by green starboard-hand marks: cone-shaped, or with a green cone topmark.",
  {t:"chart",k:"lateral",v:"R"},pickVis(["stbd","port","pcs","pcp"]));
C("sc-pref-R","lateral","Heading in from sea, the channel splits and the main channel goes right. Which mark belongs at the ? where it splits?",NM("pcs"),[NM("pcp"),NM("port"),NM("stbd")],
  "The main (preferred) channel is to starboard, so it's a preferred-channel-to-starboard mark: a modified port-hand mark, red with a green band and a red can topmark. Keep it on your port side to stay in the main channel.",

C("sc-pref-L","lateral","Heading in from sea, the channel splits and the main channel goes left. Which mark belongs at the ? where it splits?",NM("pcp"),[NM("pcs"),NM("port"),NM("stbd")],
  "The main (preferred) channel is to port, so it's a preferred-channel-to-port mark: a modified starboard-hand mark, green with a red band and a green cone topmark. Keep it on your starboard side to stay in the main channel.",

C("sc-iso","marks","This small rock has deep, navigable water all round it. Which mark is placed on it?",NM("iso"),[NM("safe"),NM("special"),NM("wreck")],
  "An isolated danger mark sits on or above a danger of limited extent with navigable water all round it: black with a red band, two black spheres, and a white light in groups of 2 flashes. Don't pass close.",

C("sc-safe","marks","Which mark is used at the ?, in open water at the seaward start of the approach channel?",NM("safe"),[NM("iso"),NM("special"),NM("wreck")],
  "A safe water mark shows there's navigable water all round it. It's used as a landfall mark, or to mark a channel's centre line or mid-channel: red and white vertical stripes with a red sphere topmark.",
  {t:"chart",k:"safe"},pickVis(["safe","iso","special","wreck"]));
C("sc-special","marks","Which mark would show where this pipeline runs out to sea?",NM("special"),[NM("wreck"),NM("iso"),NM("safe")],
  "Special marks show special areas or features such as cables, pipelines, spoil grounds and exercise areas: yellow, with a yellow X topmark and a yellow light.",
  {t:"chart",k:"special"},pickVis(["special","wreck","iso","safe"]));
C("sc-wreck","marks","A ship sank here yesterday. Which mark was designed specifically to mark a new wreck straight away?",NM("wreck"),[NM("special"),NM("iso"),NM("safe")],
  "The emergency wreck mark is laid as soon as possible and stays until the wreck is charted, fully surveyed and permanently marked: blue and yellow vertical stripes, an upright yellow cross topmark, and alternating blue and yellow flashes.",
  {t:"chart",k:"wreck"},pickVis(["wreck","special","iso","safe"]));

/* ---- IRPCS: Rules 2, 5, 6, 7 ---- */
C("co-1","core","How do you assess whether risk of collision exists with an approaching vessel?",
 "Watch her compass bearing: steady bearing and closing range means risk",
 ["Watch her relative bearing: if it changes at all, there is no risk","Watch her aspect: risk exists only if you see both her sidelights","Watch her range: risk exists whenever she is within 2 miles"],
 "Rule 7(d)(i): risk of collision is deemed to exist if the compass bearing of an approaching vessel does not appreciably change. In short: constant bearing, decreasing range.");
C("co-2","core","An approaching vessel's compass bearing is changing appreciably. Can risk of collision still exist?",
 "Yes, especially with a very large vessel, a tow, or at close range",
 ["No, an appreciable change of bearing always means she will pass clear","Only if she is the stand-on vessel and you are giving way","Only in restricted visibility, with bearings taken by radar"],
 "Rule 7(d)(ii): risk may sometimes exist even when an appreciable bearing change is evident, particularly when approaching a very large vessel or a tow, or a vessel at close range.");
C("co-3","core","Under Rule 7, if there is any doubt whether risk of collision exists, what should you assume?",
 "That risk of collision exists",
 ["That there is no risk until bearings prove it","That the larger vessel will take action first","That the other vessel will keep clear of you"],
 "Rule 7(a): if there is any doubt, such risk shall be deemed to exist.");
C("co-4","core","Rule 7 warns against making assumptions based on what?",
 "Scanty information, especially scanty radar information",
 ["Systematic radar plotting of detected vessels","Compass bearings of the vessel taken over a period of time","Long-range radar scanning for early warning"],
 "Rule 7(c). The three wrong options are all things Rule 7 tells you to do.");
C("co-5","core","Why use a compass bearing rather than a relative bearing (like 'fine on the starboard bow') to judge risk of collision?",
 "Relative bearings shift whenever your own heading wanders",
 ["Compass bearings also give you the other vessel's speed","Relative bearings can only be taken in daylight","Compass bearings are needed for the deck log entry"],
 "Rule 7(d) specifies the compass bearing. A relative bearing moves every time your own head swings, which can hide a steady compass bearing.");
C("co-6","core","Rule 7(b): what does proper use of radar involve?",
 "Long-range scanning, and plotting or systematic observation",
 ["Using only the shortest range scale available to you, at all times","Switching on only once visibility is below 2 miles","Relying on ship-tracking data instead of plotting echoes"],
 "Rule 7(b): long-range scanning to get early warning of risk of collision, and radar plotting or equivalent systematic observation of detected objects.");
C("co-7","core","You take three bearings of a ship over six minutes: 045°, 045°, 045°. The range is closing. What does this tell you?",
 "Risk of collision exists",
 ["No risk, as she is holding a steady course","She is overtaking you and must keep clear","No risk unless her bearing starts to change"],
 "Rule 7(d)(i): a steady compass bearing with the range decreasing means risk of collision.");
C("co-8","core","A vessel's compass bearing is steady but the range is opening. Is there risk of collision?",
 "No, she is moving away along the same line",
 ["Yes, any steady bearing means risk of collision","Yes, but only if she is larger than you are","Only if the bearing stays steady for 10 minutes"],
 "Risk of collision needs the range to be closing as well as a steady bearing. Keep watching in case either changes.");
C("co-9","core","Rule 2(b) allows a departure from the Rules in what circumstances?",
 "When necessary to avoid immediate danger",
 ["When the other vessel agrees to it by radio","Whenever it saves time getting to a casualty","When you are the larger, less handy vessel"],
 "Rule 2(b): due regard must be had to all dangers of navigation and collision and any special circumstances, including the limitations of the vessels involved, which may make a departure necessary to avoid immediate danger.");
C("co-10","core","Rule 2(a): obeying the letter of the Rules doesn't excuse you from neglecting what?",
 "Precautions required by the ordinary practice of seamen",
 ["A request from a crew member to slow down","Advice printed in a pilot book or almanac","A request from another vessel, made by radio, to alter course"],
 "Rule 2(a): nothing in the Rules exonerates anyone from neglecting any precaution required by the ordinary practice of seamen, or by the special circumstances of the case.");
C("co-11","core","Which rule allows a departure from the Rules when necessary to avoid immediate danger?",
 "Rule 2, Responsibility",
 ["Rule 8, Action to avoid collision","Rule 17, Action by stand-on vessel","Rule 6, Safe speed"],
 "Rule 2(b). It isn't a general licence: the departure must be necessary to avoid immediate danger.");
C("co-12","core","Rule 5 requires a proper look-out by what means?",
 "Sight, hearing and all available means suited to the conditions",
 ["Sight by day, and radar and ship tracking at night","Sight and hearing only; radar and ship tracking are optional extras at all times","Radar and ship tracking, backed up by sight when time allows"],
 "Rule 5: by sight and hearing as well as by all available means appropriate in the prevailing circumstances and conditions.");
C("co-13","core","What is the purpose of the look-out required by Rule 5?",
 "To fully appraise the situation and the risk of collision",
 ["To identify vessels by name for radio calls","To spot navigation marks and keep the vessel within the channel","To keep a record of traffic for the deck log"],
 "Rule 5: so as to make a full appraisal of the situation and of the risk of collision.");
C("co-14","core","When does Rule 5 (Look-out) apply?",
 "At all times",
 ["Only in restricted visibility","Only at night and in restricted visibility","Only when underway and making way"],
 "Rule 5 opens: 'Every vessel shall at all times maintain a proper look-out'.");
C("co-15","core","Rule 6: a safe speed is one at which you can do what?",
 "Avoid collision effectively and stop within an appropriate distance",
 ["Keep steerage way while reaching the casualty as fast as possible","Stay within the area's speed limit and avoid making any wash","Stay on the plane, keeping the hull clear of floating debris"],
 "Rule 6: take proper and effective action to avoid collision and be stopped within a distance appropriate to the prevailing circumstances and conditions. The urgency of a shout doesn't change what a safe speed is.");
C("co-16","core","Which of these is NOT one of the Rule 6 factors every vessel must consider for safe speed?",
 "The urgency of the task you are on",
 ["The state of visibility","Traffic density, including fishing vessels","Background light from the shore at night"],
 "Rule 6(a): visibility; traffic density; manoeuvrability (stopping distance and turning ability); background light at night; wind, sea, current and nearby hazards; draught against the available depth.");
C("co-17","core","Rule 6 lists manoeuvrability as a safe-speed factor, with special reference to what?",
 "Stopping distance and turning ability",
 ["Engine power and maximum speed","Draught and air draught","Crew experience and training on that vessel"],
 "Rule 6(a)(iii): stopping distance and turning ability in the prevailing conditions.");
C("co-18","core","Which of these is one of Rule 6's extra safe-speed factors for vessels using radar?",
 "Small vessels and floating objects may not show on radar",
 ["Radar allows a higher speed in fog than visual watch","Radar replaces the need to sound fog signals","Ship-tracking data can be relied on to show every vessel nearby"],
 "Rule 6(b): radar limitations, range scale in use, sea and weather clutter, small targets and ice that may not be detected, the number and movement of vessels detected, and the better assessment of visibility radar can give.");
C("co-19","core","Which Rule 6 factor relates to the depth of water?",
 "Draught in relation to the available depth",
 ["Height of tide at the nearest standard port","Distance off the nearest charted danger","Range of the tide on that day"],
 "Rule 6(a)(vi).");
C("co-20","core","What is the classic sign that risk of collision exists?",
 "Constant bearing, decreasing range",
 ["Changing bearing, decreasing range","Constant bearing, increasing range","Changing bearing, increasing range"],
 "Rule 7(d)(i): a compass bearing that doesn't appreciably change while the range closes.");

/* ---- IRPCS: Rules 10, 19 ---- */
C("ts-1","tss","If you have to cross a traffic lane, how should you do it?",
 "On a heading at right angles to the traffic flow",
 ["On a track at right angles, allowing for the tide","At about 45° to the traffic flow, angled with it","At the smallest practicable angle to the flow"],
 "Rule 10(c): the HEADING should be as nearly as practicable at right angles, so your aspect is clear to traffic and you spend least time in the lane. Don't crab to make good a right-angle track. The smallest angle is for joining or leaving a lane.");
C("ts-2","tss","How should a vessel join or leave a traffic lane from the side?",
 "At as small an angle to the traffic flow as practicable",
 ["At right angles to the traffic flow, as when crossing","Only at the end of the lane, never from the side","Across the separation zone, at reduced speed"],
 "Rule 10(b)(iii): normally join or leave at the termination of the lane; from the side, at as small an angle as practicable.");
C("ts-3","tss","Which vessels may use an inshore traffic zone even when they could safely use the adjacent lane?",
 "Under 20 m, sailing, or engaged in fishing",
 ["Any vessel under 50 m, and all sailing vessels","Vessels constrained by their draught, and all pilot vessels","Only vessels restricted in ability to manoeuvre"],
 "Rule 10(d)(i). Others may use it when going to or from a port, offshore installation, pilot station or other place within the zone, or to avoid immediate danger (10(d)(ii)).");
C("ts-4","tss","In a traffic separation scheme, a vessel under 20 m or a sailing vessel must not do what?",
 "Impede a power-driven vessel following a lane",
 ["Use the inshore traffic zone at any time","Cross a traffic lane anywhere except at its end","Use a traffic lane under sail alone"],
 "Rule 10(j). A vessel engaged in fishing must likewise not impede the passage of any vessel following a lane (10(i)).");
C("ts-5","tss","Apart from crossing, joining or leaving, when may a vessel enter a separation zone?",
 "In an emergency, or to fish within the zone",
 ["To overtake slower traffic in the lane","To wait there for a pilot or for a fair tide","Whenever the lane itself is congested"],
 "Rule 10(e): in an emergency to avoid immediate danger, or to engage in fishing within the separation zone.");
C("ts-6","tss","How should a vessel that is not using a traffic separation scheme treat it?",
 "Avoid it by as wide a margin as practicable",
 ["Keep to the inshore traffic zone beside it","Cross it at its narrowest point at full speed","Follow its outer edge in the direction of flow"],

C("ts-7","tss","Does following a traffic lane give a vessel right of way over all other vessels?",
 "No, the other steering and sailing rules still apply",
 ["Yes, a vessel in a lane is always the stand-on vessel","Yes, but only if she is 50 m or more in length","Only over vessels crossing the lane at an angle"],
 "Rule 10(a): the rule does not relieve any vessel of her obligations under any other rule, although some vessels must not impede her (10(i) and (j)).");
C("ts-8","tss","Where should you avoid anchoring in relation to a traffic separation scheme?",
 "In the scheme, or near its terminations",
 ["Only within the separation zone itself","Only within the inshore traffic zone","Anywhere within 5 miles of the scheme"],
 "Rule 10(g): so far as practicable, avoid anchoring in a scheme or in areas near its terminations.");
C("ts-9","tss","When does Rule 19 apply?",
 "To vessels not in sight of one another in or near restricted visibility",
 ["To every vessel, whether in sight of others or not, when visibility is poor","To vessels in sight of one another in fog or heavy rain","Only to vessels fitted with radar, in restricted visibility"],
 "Rule 19(a). Once vessels are in sight of one another, the normal steering and sailing rules (Section II) apply.");
C("ts-10","tss","In restricted visibility, what must a power-driven vessel have ready?",
 "Engines ready for immediate manoeuvre",
 ["Anchor ready to let go","Liferaft ready for launching","Searchlight manned and switched on"],
 "Rule 19(b), together with a safe speed adapted to the conditions.");
C("ts-11","tss","You detect a vessel by radar alone, forward of your beam (not one you are overtaking), and a close-quarters situation is developing. Which alteration should you avoid, so far as possible?",
 "An alteration of course to port",
 ["An alteration of course to starboard","A reduction in speed","Taking all way off"],
 "Rule 19(d)(i): avoid altering to port for a vessel forward of the beam, other than one being overtaken.");
C("ts-12","tss","You detect a vessel by radar alone, abeam or abaft your beam, and risk of collision exists. Which alteration should you avoid?",
 "An alteration of course towards her",
 ["An alteration of course away from her","Any reduction in speed","Sounding your fog signal"],
 "Rule 19(d)(ii).");
C("ts-13","tss","You hear a fog signal apparently forward of your beam and haven't ruled out risk of collision. What does Rule 19(e) require?",
 "Slow to steerage way, stop if necessary, and go with extreme caution",
 ["Alter boldly to starboard at once, keeping your speed up to clear","Hold your course and speed, since you may be the stand-on vessel","Increase speed to get clear of the area before she closes"],
 "Rule 19(e): reduce to the minimum speed at which you can keep your course, take all way off if necessary, and navigate with extreme caution until the danger is over. The same applies if you can't avoid a close-quarters situation with a vessel forward of your beam.");
C("ts-14","tss","In restricted visibility, with vessels not in sight of one another, is there a stand-on vessel?",
 "No: each vessel that detects the risk must act",
 ["Yes, the vessel with the other on her port side","Yes, whichever vessel is the larger","Yes, whichever was detected first on radar"],
 "Rule 19 has no stand-on or give-way vessel. Each vessel that finds a close-quarters situation developing, or risk of collision, takes avoiding action in ample time (Rule 19(d)).");
C("ts-15","tss","Rule 19(d) says avoid altering to port for a vessel forward of the beam. What's the exception?",

/* ---- IRPCS: Rules 8, 9, 13–18 ---- */
C("st-1","steer","Two power-driven vessels meet head-on with risk of collision. What should each do?",

C("st-6","steer","In doubt whether you are overtaking or crossing, what should you assume?",

C("st-7","steer","What action should a give-way vessel take under Rule 16?",

C("st-8","steer","What is the stand-on vessel's first duty under Rule 17?",

C("st-9","steer","As stand-on vessel, when MUST you take action yourself?",

C("st-10","steer","A power-driven stand-on vessel decides to act under Rule 17(a)(ii) in a crossing situation. If possible, what should she NOT do?",

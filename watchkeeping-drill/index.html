  const fc=document.getElementById("fc");if(!fc||!fc.classList)return;
  setTimeout(()=>{if(fc.isConnected&&!DRAG)fc.classList.add("nudge");setTimeout(()=>fc.classList.remove("nudge"),1700);},150);
}
let DRAG=null,CLICKBLOCK=0;
function wireCard(){
  const fc=document.getElementById("fc");if(!fc||!fc.addEventListener)return;
  const onBtn=e=>e.target&&e.target.closest&&e.target.closest("button");
  fc.addEventListener("click",e=>{if(Date.now()<CLICKBLOCK||onBtn(e))return;flip(false);});
  fc.addEventListener("touchstart",e=>{if(e.touches.length!==1||onBtn(e)){DRAG=null;return;}const t=e.touches[0];dragStart(t.clientX,t.clientY);},{passive:true});
  fc.addEventListener("touchmove",e=>{if(!DRAG)return;if(e.touches.length!==1){dragEnd(true);return;}const t=e.touches[0];if(dragMove(t.clientX,t.clientY)&&e.cancelable)e.preventDefault();},{passive:false});
  fc.addEventListener("touchend",()=>dragEnd(false));
  fc.addEventListener("touchcancel",()=>dragEnd(true));

    const mv=ev=>{if(DRAG)dragMove(ev.clientX,ev.clientY);};
    const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);dragEnd(false);};
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);

}
function swipeDir(dx,dy){if(dy>0&&dy>Math.abs(dx))return "medium";if(Math.abs(dx)<1)return null;return dx>0?"easy":"difficult";}
function swipeAmount(r,dx,dy,w,h){if(!r)return 0;return r==="medium"?dy/Math.min(120,h*.22):Math.abs(dx)/Math.min(120,w*.3);}
function showDir(fc,r,p){
  const v=x=>String(Math.max(0,Math.min(1,x)).toFixed(2));
  fc.style.setProperty("--pe",r==="easy"?v(p):"0");fc.style.setProperty("--pm",r==="medium"?v(p):"0");fc.style.setProperty("--pd",r==="difficult"?v(p):"0");
  if(r&&p>=.3)fc.dataset.dir=r;else delete fc.dataset.dir;
  document.querySelectorAll(".rate").forEach(b=>b.classList.toggle("hot",!!r&&p>=1&&b.dataset.r===r));
}
function dragStart(x,y){
  const cur=SES&&SES.cur;const fc=document.getElementById("fc");const face=document.getElementById("fcFace");
  if(!cur||cur.leaving||cur.picked!==null||!fc){DRAG=null;return;}
  const r=fc.getBoundingClientRect();
  DRAG={x0:x,y0:y,dx:0,dy:0,axis:null,fc,face,w:r.width,h:r.height,pts:[[x,y,performance.now()]]};
}
function dragMove(x,y){
  const d=DRAG;if(!d)return false;
  d.dx=x-d.x0;d.dy=y-d.y0;d.pts.push([x,y,performance.now()]);if(d.pts.length>6)d.pts.shift();
  if(!d.axis){
    if(Math.hypot(d.dx,d.dy)<10)return false;
    if(Math.abs(d.dx)>=Math.abs(d.dy))d.axis="x";
    else if(d.dy>0&&(!d.face||d.face.scrollTop<=0))d.axis="y";
    else{d.axis="scroll";return false;}   // let the card's own text scroll
    d.fc.classList.remove("nudge","spring");d.fc.classList.add("dragging");

  if(d.axis==="scroll")return false;

  d.fc.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;
  if(open){const r=swipeDir(d.dx,d.dy);showDir(d.fc,r,swipeAmount(r,d.dx,d.dy,d.w,d.h));}

}
function dragEnd(cancel){
  const d=DRAG;DRAG=null;if(!d||!d.axis||d.axis==="scroll")return;
  CLICKBLOCK=Date.now()+350;d.fc.classList.remove("dragging");
  const cur=SES&&SES.cur;const a=d.pts[0],b=d.pts[d.pts.length-1];const dt=Math.max(1,b[2]-a[2]);
  const vx=(b[0]-a[0])/dt,vy=(b[1]-a[1])/dt;
  const r=swipeDir(d.dx,d.dy);const p=swipeAmount(r,d.dx,d.dy,d.w,d.h);
  const fling=r==="medium"?(vy>.5&&d.dy>40):(!!r&&Math.abs(vx)>.5&&Math.sign(vx)===Math.sign(d.dx)&&Math.abs(d.dx)>40);
  if(!cancel&&cur&&cur.revealed&&r&&(p>=1||fling)){leaveCard(r,d.dx,d.dy);return;}
  d.fc.classList.add("spring");d.fc.style.transform="";showDir(d.fc,null,0);
  setTimeout(()=>d.fc.classList.remove("spring"),320);
  if(cur&&!cur.revealed&&Math.hypot(d.dx,d.dy)>30){const t=document.getElementById("fcTap");if(t){t.classList.remove("pulse");void t.offsetWidth;t.classList.add("pulse");}}
}
function leaveCard(r,dx,dy){
  const cur=SES&&SES.cur;if(!cur||cur.leaving||cur.picked!==null)return;
  const fc=document.getElementById("fc");
  if(!fc||!fc.classList||reducedMotion()){rate(r);return;}
  cur.leaving=true;
  const W=window.innerWidth||400,H=window.innerHeight||800;
  const tx=r==="medium"?(dx||0)*.5:(r==="easy"?1:-1)*(W+120),ty=r==="medium"?H:(dy||0)*.6,rot=r==="medium"?0:(r==="easy"?18:-18);
  showDir(fc,r,1);fc.classList.remove("nudge","spring","dragging");fc.classList.add("leave");
  fc.style.transform=`translate(${tx}px,${ty}px) rotate(${rot}deg)`;
  setTimeout(()=>{cur.leaving=false;if(SES&&SES.cur===cur)rate(r);},200);
}
function rateMotion(r){const cur=SES&&SES.cur;if(!cur||!cur.revealed||cur.leaving||cur.picked!==null)return;leaveCard(r,0,0);}
/* a difficult card goes back into this round a few cards later, a limited number of times */
function requeue(id){const n=SES.reps[id]||0;if(n>=MAXREP)return -1;SES.reps[id]=n+1;
  const pos=Math.min(SES.i+1+REQUEUE,SES.queue.length);SES.queue.splice(pos,0,id);return pos-SES.i-1;}
function rate(r){
  const cur=SES&&SES.cur;if(!cur||!cur.revealed||cur.leaving||cur.picked!==null||!RATES.includes(r))return;
  cur.picked=r;const ok=r!=="difficult";const first=!(cur.id in SES.first);
  grade(cur.id,r,Date.now());
  if(first){SES.first[cur.id]=ok;if(ok)SES.correctFirst++;SES.tally[r]++;}
  if(!ok){if(!SES.missed.includes(cur.id))SES.missed.push(cur.id);requeue(cur.id);}
  PREFS.rated=(PREFS.rated||0)+1;
  persist();next();
}

function answer(k){
  const cur=SES&&SES.cur;if(!cur||cur.picked!==null)return;
  cur.picked=k;const c=BYID[cur.id];const ok=cur.opts[k]===c.a;const now=Date.now();
  const first=!(cur.id in SES.first);
  const s=grade(cur.id,ok?"medium":"difficult",now);
  if(first){SES.first[cur.id]=ok;if(ok)SES.correctFirst++;}
  if(!ok){
    if(!SES.missed.includes(cur.id))SES.missed.push(cur.id);
    const gap=requeue(cur.id);
    cur.note=gap<0?"It'll come back early in your next round":gap===0?"Coming back as the next card":`Coming back after ${gap} more card${gap===1?"":"s"}`;
    renderTopbar();
  }else{
    cur.note=s[0]>=LV_MAST?"Mastered: it'll only come up now and then":"It'll come back in a later round";
  }
  cur.ok=ok;persist();showFeedback(true);
}
function showFeedback(focus){
  const cur=SES.cur;const c=BYID[cur.id];
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;const v=cur.opts[i];
    if(v===c.a){b.classList.add("ok");b.querySelector(".k").innerHTML=I.check;}
    else if(i===cur.picked){b.classList.add("bad");b.querySelector(".k").innerHTML=I.cross;}
    else b.classList.add("dim");});
  document.querySelectorAll(".optimg .cap").forEach(x=>x.hidden=false);
  const shown=cur.lkey?` <span class="shown">Shown: ${esc(LSEQ[cur.lkey].t)}</span>`:"";
  const last=SES.i+1>=SES.queue.length;
  document.getElementById("fb").innerHTML=`<div class="fb ${cur.ok?"ok":"bad"}" aria-live="polite">
    <p class="verdict ${cur.ok?"ok":"bad"}">${cur.ok?I.check:I.cross}${cur.ok?"Correct":"Not quite"}</p>
    ${cur.ok?"":`<p class="ex"><b>Answer:</b> ${esc(c.a)}</p>`}
    ${c.xp?c.xp.map(([h,t])=>`<p class="ex"><b>${h}:</b> ${esc(t)}</p>`).join(""):`<p class="ex">${esc(c.ex)}${shown}</p>`}
    <p class="sched">${esc(cur.note||"")}</p>
  </div>
  <button class="btn btn-filled big" type="button" id="nextBtn" style="margin-top:16px">${last?"Finish":"Continue"}</button>`;
  const nb=document.getElementById("nextBtn");nb.onclick=next;
  if(focus){try{nb.focus({preventScroll:true});}catch(e){}const fb=document.getElementById("fb");if(fb&&fb.scrollIntoView){try{fb.scrollIntoView({block:"nearest",behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}catch(e){}}}
}
function next(){
  if(!SES)return;SES.i++;SES.cur=null;
  render();
  try{window.scrollTo(0,0);}catch(e){}
}
document.addEventListener("keydown",e=>{
  if(INTRO&&!INTRO.done){INTRO.finish();if(e.key!=="Tab")e.preventDefault();return;}
  if(GATE){
    if(e.key==="Escape"){e.preventDefault();return;}
    if(e.key==="Tab"){const f=[...document.querySelectorAll("#gate input,#gate button:not([disabled])")];if(!f.length)return;
      const first=f[0],last=f[f.length-1];if(e.shiftKey&&(document.activeElement===first||!document.getElementById("gate").contains(document.activeElement))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    return;
  }
  if(SHEET){
    if(e.key==="Escape"){e.preventDefault();closeSheet();return;}
    if(e.key==="Tab"){const f=[...document.querySelectorAll("#sheet button:not([disabled])")].filter(x=>x.offsetParent!==null);if(!f.length)return;
      const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    return;
  }
  if(VIEW!=="quiz"||!SES||!SES.cur||e.ctrlKey||e.metaKey||e.altKey)return;
  const ae=document.activeElement;const onButton=ae&&ae.tagName==="BUTTON";
  if(SES.style==="cards"){
    if((e.key===" "||e.key==="Enter")&&!onButton){e.preventDefault();flip(true);return;}
    if(!SES.cur.revealed)return;
    const r={ArrowLeft:"difficult","1":"difficult",ArrowDown:"medium","2":"medium",ArrowRight:"easy","3":"easy"}[e.key];
    if(r){e.preventDefault();rateMotion(r);}
    return;
  }
  if(SES.cur.picked===null){const n="1234".indexOf(e.key);const a="abcd".indexOf(e.key.toLowerCase());const k=n>-1?n:a;if(k>-1&&k<SES.cur.opts.length){e.preventDefault();answer(k);}}
  else if((e.key==="Enter"||e.key===" ")&&!onButton){e.preventDefault();next();}
});

function renderSummary(){
  const total=Object.keys(SES?SES.first:{}).length;const got=SES?SES.correctFirst:0;
  const missed=SES?SES.missed:[];const pct=total?got/total*100:0;const cards=SES&&SES.style==="cards";
  const t=(SES&&SES.tally)||{easy:0,medium:0,difficult:0};
  const head=cards
    ?`<div class="tally" aria-label="How you rated the cards"><div class="t-easy"><b>${t.easy}</b><span>Easy</span></div><div class="t-medium"><b>${t.medium}</b><span>Medium</span></div><div class="t-difficult"><b>${t.difficult}</b><span>Difficult</span></div></div>`
    :`<div><div class="score">${got}/${total}</div><p class="sched" style="font-size:.875rem">right first time</p></div><div class="sbar" aria-hidden="true"><i style="width:${pct.toFixed(1)}%"></i></div>`;
  const qOf=c=>cards?(c.fq||c.q):c.q,aOf=c=>cards?(c.fa||c.a):c.a;
  $view().innerHTML=`
  <article class="card">
    <p class="overline">Round complete</p>
    ${head}
    ${missed.length?`<div><h2 class="h3">${cards?"Cards you found difficult":"Cards you missed"}</h2><ul class="miss" style="margin-top:8px">${missed.map(id=>`<li>${esc(qOf(BYID[id]))}<small>${esc(aOf(BYID[id]))}</small></li>`).join("")}</ul><p class="sched" style="margin-top:8px">They'll come back early in your next round, whenever you start it.</p></div>`:`<p class="ex">${cards?"Nothing difficult this round.":"Clean sheet."} The cards you knew will now come up less often.</p>`}
    <button class="btn btn-filled big" type="button" id="againBtn">${I.play}<span>${PREFS.mode==="cards"?"More flashcards":PREFS.mode==="scen"?"More scenarios":PREFS.mode==="spot"?"More buoys":"Another quiz round"}</span></button>
    <button class="btn btn-text block" type="button" id="homeBtn2">Back to home</button>
  </article>`;
  document.getElementById("againBtn").onclick=()=>startSession("normal");
  document.getElementById("homeBtn2").onclick=()=>{SES=null;VIEW="home";render();};
}

/* ================= BOOT ================= */
function boot(data){
  try{loadLocal();}catch(e){}
  if(data&&data.session&&data.view==="quiz"&&Array.isArray(data.session.queue)&&data.session.queue.every(id=>BYID[id])){
    SES=data.session;SES.reps=SES.reps||{};SES.tally=SES.tally||{easy:0,medium:0,difficult:0};
    if(SES.cur){SES.cur.leaving=false;if(SES.cur.picked!==null&&SES.style==="cards"&&!RATES.includes(SES.cur.picked))SES.cur=null;}
    VIEW="quiz";}
  try{render();}catch(e){}
  try{connect();}catch(e){}
  ensureGate();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({session:SES,view:VIEW}));}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
<script>
/* standalone extras: offline cache and persistent storage. No install prompt: the browser's own one is held back too,
   so the drill stays installable from the browser menu but never asks. */
(function(){
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();});
})();
</script>

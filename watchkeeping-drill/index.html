C("ds-sea-19","seaman","Anchoring with chain and rope together, what's the rule-of-thumb minimum length to let out?",
 "Six times the greatest expected depth",
 ["Three times the depth at low water","Four times the greatest expected depth","Ten times the depth, whatever the weather"],
 "All chain: about four times; chain and rope: about six times, because rope is lighter and needs more scope to pull along the seabed. Let out more in strong winds.");
C("ds-sea-20","seaman","Alongside a pontoon, what do the spring lines do?",
 "Stop the boat moving forwards and backwards",
 ["Hold the bow and stern in close to the pontoon","Stop the boat rolling in passing wash","Take the strain off the anchor cable"],
 "Springs run aft from the bow and forward from the stern, stopping the boat surging fore and aft. Bow and stern lines and breast lines hold her in.");
C("ds-sea-21","seaman","Going astern with a right-handed propeller, which way does the stern usually kick?",
 "To port",
 ["To starboard","Straight back, with no kick","It depends only on the wind"],
 "This 'prop walk' is strongest as you first engage astern. Use it: berth port side to where you can, so the stern tucks in as you go astern to stop.");
C("ds-sea-22","seaman","Coming alongside, which way should you head to keep the most control?",
 "Into the stronger of the wind or the tidal stream",
 ["Downwind, so the wind pushes you gently onto the berth","Down-tide, to arrive with more speed","Always bow towards the shore"],
 "Stemming the stronger of wind or tide lets you approach slowly while keeping steerage way, and stop by easing the throttle.");
C("ds-sea-23","seaman","What is a tripping line on an anchor for?",
 "Pulling the anchor out backwards if it's fouled",
 ["Locking the anchor in its stowed position on the bow","Stopping the cable running out too fast","Making the anchor dig in more quickly"],
 "Tied to the crown of the anchor, it lets you pull a fouled anchor free from the opposite direction. A small buoy on its end also marks where the anchor lies.");
C("ds-sea-24","seaman","What does heaving to do?",
 "Keeps the boat almost stationary, drifting slowly",
 ["Turns the boat head to wind to drop the sails","Sets the boat sailing fast on a reach","Brings the boat to anchor in an emergency"],
 "With the jib backed and the helm lashed to turn into the wind, the boat lies quietly and drifts slowly to leeward: useful for reefing, a rest or a meal. Make sure there's room to leeward.");
C("ds-sea-25","seaman","When should you reef?",
 "Early, before the wind gets too strong",
 ["Only once the boat is heeling hard","Only when a gale warning is issued","After the wind has reached its peak"],
 "It's much easier and safer to reef before you're overpowered. If you're wondering whether to reef, it's time.");
C("ds-sea-26","seaman","What does 'veering' the anchor cable mean?",
 "Letting more cable out",
 ["Hauling the cable in","Shackling on a second anchor","Checking the cable for wear"],
 "Veering cable means paying more out. The wind is also said to veer when it shifts clockwise.");
C("ds-nav-19","navi","Your compass course is 100°. Deviation is 2° East. What is the magnetic course?",
 "102°",
 ["098°","100°","104°"],
 "With easterly deviation the compass reads less than magnetic ('error east, compass least'), so add it: 100 + 2 = 102° magnetic.");
C("ds-nav-20","navi","True course 200°, variation 5° West, deviation 3° East. What compass course do you steer?",
 "202°",
 ["208°","198°","192°"],
 "True to magnetic: add westerly variation, 200 + 5 = 205°. Magnetic to compass: subtract easterly deviation, 205 − 3 = 202°.");
C("ds-nav-21","navi","At 5 knots for 1 hour 30 minutes, how far do you go?",
 "7.5 nautical miles",
 ["6.5 nautical miles","5.3 nautical miles","8 nautical miles"],
 "Distance = speed × time = 5 × 1.5 = 7.5 miles.");
C("ds-nav-22","navi","A chart's compass rose gives the variation for an earlier year, with an annual change. Why?",
 "Variation changes slowly, so you update it",
 ["Deviation changes every year","It shows how the chart's scale changes","It's the tidal stream's yearly drift"],
 "Work forward from the year printed to the current year using the annual change.");
C("ds-nav-23","navi","What does a course to steer allow for?",
 "The tidal stream and leeway",
 ["The magnetic variation only","The boat's speed only","The deviation and nothing else"],
 "It's the heading that, with the stream setting you and the wind pushing you sideways, makes good the track you want. You then convert it to a compass course.");
C("ds-nav-24","navi","What is a running fix?",
 "An earlier bearing carried forward and crossed with a later one",
 ["Two bearings of two different objects, taken at the same moment","A fix taken while running downwind at full speed under sail","A satellite position cross-checked against the echo sounder's depth"],
 "When only one object is in view, take a bearing, then another later, and move the first position line along by your course and distance run between them, allowing for the tidal stream and leeway. It's only as good as your estimate of that movement.");
C("ds-nav-25","navi","Which chart shows more detail: a scale of 1:25,000 or 1:200,000?",
 "1:25,000",
 ["1:200,000","Both show the same detail","It depends on the chart's age"],
 "1:25,000 is the larger scale: 1 centimetre on the chart is 250 metres, against 2 kilometres at 1:200,000. Use the largest-scale chart available close to the coast.");
C("ds-nav-26","navi","How do you keep a paper chart up to date?",
 "Apply corrections from Notices to Mariners",
 ["Buy a new one every year","Check it against your satnav","Mark the changes you notice yourself while sailing"],
 "Notices to Mariners are published weekly with chart corrections. Note each correction on the chart.");
C("ds-nav-27","navi","What does a depth contour on a chart show?",
 "A line joining points of equal depth",
 ["The edge of the navigable channel","The limit of a restricted area","The route recommended for yachts"],
 "Following a contour with the echo sounder can help confirm your position, especially in poor visibility.");
C("ds-tide-13","tide","Roughly how long is it from one high water to the next?",
 "About 12 hours 25 minutes",
 ["Exactly 12 hours, every day","About 24 hours","About 6 hours"],
 "UK and Irish tides are mostly semi-diurnal: two high and two low waters a day, each about 50 minutes later than the day before.");
C("ds-tide-14","tide","Roughly how long after spring tides do neap tides come?",
 "About a week",
 ["About a day","About a fortnight","About a month"],
 "Springs come about every two weeks, near new and full moon, with neaps about halfway between, near the quarter moons.");
C("ds-tide-15","tide","What is 'mean high water springs'?",
 "The average height of high water at spring tides",
 ["The highest tide ever recorded","High water on the day of the spring equinox","The average of every high water"],
 "On Admiralty charts, heights of lights and land features are measured above it.");
C("ds-tide-16","tide","The range is 4.8 metres. By the rule of twelfths, how far does the tide fall in the third hour after high water?",
 "1.2 metres",
 ["0.8 metres","0.4 metres","1.6 metres"],
 "The third hour is 3 twelfths of the range: 4.8 ÷ 12 × 3 = 1.2 metres.");
C("ds-tide-17","tide","Tidal stream rates are given for springs and neaps. Today's range is about halfway between. What rate do you use?",
 "About halfway between the two",
 ["The spring rate, to be on the safe side","The neap rate, as it's the smaller","An average of all the hours shown"],
 "Interpolate between the neap and spring rates according to today's range.");
C("ds-tide-18","tide","Where do tidal streams usually run strongest?",
 "Off headlands and through narrow channels",
 ["In the middle of wide bays","Close inshore along straight beaches","In deep water far offshore"],
 "The flow speeds up as it's squeezed round headlands and through gaps, often with overfalls. Expect weaker streams in bays.");
C("ds-tide-19","tide","A bar has a charted depth of 0.5 metres. You need 2.5 metres of water. What height of tide do you need?",
 "2.0 metres",
 ["3.0 metres","2.5 metres","1.5 metres"],
 "Depth = charted depth + height of tide, so 2.5 = 0.5 + height, and the height of tide needed is 2.0 metres.");
C("ds-tide-20","tide","Why plan to cross a shallow bar on a rising tide?",
 "If you touch, the rising water lifts you off",
 ["The stream always flows inwards then","Waves never break on a rising tide","Charted depths only apply while the tide is rising"],
 "On a falling tide you could be left stranded. Also avoid crossing when wind and swell are against the ebb, when bars break most dangerously.");
C("ds-pil-14","pilot","What is a pilotage plan?",
 "A simple plan of marks, bearings and depths, made in advance",
 ["The harbour master's list of visitor berths and their depths","A passage plan for the open-sea part of a long crossing","A plan for picking up a harbour pilot off the entrance"],
 "Close to harbour there's no time to study the chart, so note beforehand the marks you'll see, clearing bearings, transits, depths and turning points.");
C("ds-pil-15","pilot","A clearing bearing on a light reads 'not less than 045°'. You take a bearing of 040°. What does it tell you?",
 "You're on the dangerous side: alter away",
 ["You're safe: 040° is close enough","You're safe, as it's less than 045°","Nothing: clearing bearings only work by day"],
 "To stay clear, the bearing must be 045° or more. 040° is less, so you're on the danger side of the line.");
C("ds-pil-16","pilot","What is a waypoint?",
 "A planned position on your route",
 ["A buoy marking a harbour entrance","A point where the tide turns","A position given by the coastguard"],
 "Waypoints are usually entered in the satnav, which then gives bearing and distance to go, and cross-track error.");
C("ds-pil-17","pilot","What does cross-track error on a satnav tell you?",
 "How far you are off the planned track",
 ["How far you've gone since the last fix","How much error your compass has","How far it is to the next waypoint"],
 "It's the sideways distance from the line between waypoints. A growing error usually means the tidal stream or leeway is setting you off.");
C("ds-pil-18","pilot","Why shouldn't you put a waypoint exactly on a buoy or mark?",
 "You might steer into it, or into other boats using it",
 ["The satnav can't store a buoy's position as a waypoint","Buoys aren't shown on most electronic charts or plotters","Waypoints must always be on charted land features instead"],
 "Offset waypoints a safe distance from marks and dangers.");
C("ds-pil-19","pilot","What are pilot books (sailing directions) for?",
 "Detailed descriptions of coasts, harbours and approaches",
 ["Tide tables for the standard and secondary ports","The collision regulations as they apply to harbour pilots","Weather forecasts and gale warnings for the coming week"],
 "They describe dangers, marks, anchorages, harbour facilities and local regulations, alongside the chart and almanac.");
C("ds-pil-20","pilot","How can the depth sounder help you navigate in poor visibility?",
 "By checking or following a depth contour",
 ["By showing the bearing of the nearest mark","By measuring your speed through the water","By detecting other vessels nearby"],
 "Comparing the depth you measure, corrected for the height of tide, with charted depths checks your position; following a contour can lead you safely along a coast.");
C("ds-pil-21","pilot","In a passage plan, what is a bolt hole?",
 "A safe harbour to run for if conditions change",
 ["A shortcut through shallow water","A gap in a breakwater for small boats","An anchorage you can only use at low water"],
 "Plan alternatives in case the weather worsens, the crew tire or something breaks.");
C("ds-met-16","met","In a shipping forecast, what does 'soon' mean?",
 "Within 6 to 12 hours of the time of issue",
 ["Within 6 hours of the time of issue","More than 12 hours from the time of issue","Within 24 hours of the time of issue"],
 "Imminent: within 6 hours. Soon: 6 to 12 hours. Later: more than 12 hours.");
C("ds-met-17","met","The wind shifts from west to south-west. What is this called?",
 "Backing",
 ["Veering","Freshening","Moderating"],
 "Backing is an anticlockwise shift; veering is clockwise.");
C("ds-met-18","met","What wind speed is Force 4 on the Beaufort scale?",
 "11 to 16 knots",
 ["7 to 10 knots","17 to 21 knots","22 to 27 knots"],
 "Force 4 is a moderate breeze.");
C("ds-met-19","met","In a shipping forecast, what does visibility 'moderate' mean?",
 "2 to 5 nautical miles",
 ["More than 5 nautical miles","1000 metres to 2 nautical miles","Less than 1000 metres"],
 "Good: more than 5 miles. Moderate: 2 to 5 miles. Poor: 1000 metres to 2 miles. Very poor: less than 1000 metres.");
C("ds-met-20","met","In a shipping forecast, what does visibility 'very poor' mean?",
 "Less than 1000 metres",
 ["Less than 2 nautical miles","Less than 200 metres","1 to 2 nautical miles"],
 "Good: more than 5 miles. Moderate: 2 to 5 miles. Poor: 1000 metres to 2 miles. Very poor: less than 1000 metres.");
C("ds-met-21","met","What is a land breeze?",
 "A breeze blowing off the land at night",
 ["A breeze blowing onto the land by day","A wind funnelled down a valley in the afternoon","A gust from a passing shower"],
 "At night the land cools faster than the sea, so air flows off the land. By day the reverse gives a sea breeze.");
C("ds-met-22","met","The barometer is falling quickly. What does it suggest?",
 "Stronger winds are on the way",
 ["Settled weather is coming","The wind is about to die away","Fog is about to clear"],
 "A rapid fall usually means a depression is approaching, bringing stronger winds.");
C("ds-met-23","met","In the northern hemisphere, how does the wind blow around an area of high pressure?",
 "Clockwise, and slightly outwards",
 ["Anticlockwise, and slightly inwards","Straight out from the centre","Clockwise, and slightly inwards"],
 "Around a low it's the reverse: anticlockwise and slightly inwards.");
C("ds-saf-16","safety","What does a Sécurité call announce?",
 "An important navigation or weather safety message",
 ["Grave and imminent danger to life","An urgent problem that isn't life-threatening","A request for a radio check"],
 "Mayday: distress. Pan-Pan: urgency. Sécurité: safety information, such as a navigation hazard or gale warning.");
C("ds-saf-17","safety","You send a digital selective calling distress alert by mistake. What do you do?",
 "Cancel it on the set, then say so on channel 16",
 ["Switch the radio off straight away and say nothing","Wait quietly for the coastguard to call you back","Send a second distress alert to confirm the mistake"],
 "Don't just switch off and stay silent. Follow the set's prompts and cancel the alert if it allows; if it gives no instructions, switch it off, wait 10 seconds and switch it on again. Then call all stations on channel 16 with your vessel's name, call sign and identity number, cancelling your distress alert and giving the time it was sent.");
C("ds-saf-18","safety","When should you use an orange smoke signal?",
 "By day, to show your position to rescuers nearby",
 ["At night, to attract attention from far away","To warn a ship you're on a collision course","Only when a helicopter is overhead at night"],
 "Orange smoke is a daytime distress signal, especially good for showing your position and the wind direction to aircraft. At night use red flares.");
C("ds-saf-19","safety","When is a red hand flare most useful?",
 "When rescuers are in sight, to pinpoint you",
 ["To attract attention from 20 miles away","To warn a ship of a collision risk","To light up the water for a search"],
 "Hand flares burn low down, so they're for close range. A red parachute rocket attracts attention from much further away. White flares warn of collision; they aren't distress signals.");
C("ds-saf-20","safety","Why do lifejackets have crotch or thigh straps?",
 "To stop the lifejacket riding up over your head",
 ["To make it inflate automatically when you hit the water","To keep your legs warm and together in the water","To give your safety line something strong to clip to"],
 "Without them, an inflated lifejacket can ride up and leave your face low in the water. Always fit and fasten them.");
C("ds-saf-21","safety","You fall into cold water. What does the RNLI advise you do first?",
 "Float on your back until your breathing settles",
 ["Swim hard for the shore straight away, before you tire","Take off your heavy clothes and boots","Shout and wave both arms constantly"],
 "Cold water shock makes you gasp and breathe fast for the first minute or so. Fight the urge to thrash about: lean back, spread your arms and legs, and float to live. Then call for help or swim to safety.");
C("ds-saf-22","safety","What should you never use on an electrical fire?",
 "Water",
 ["A carbon dioxide extinguisher","A dry powder extinguisher","Turning off the power first"],
 "Water conducts electricity. Isolate the power if you can, then use carbon dioxide or dry powder.");
C("ds-saf-23","safety","When do you send a Mayday Relay?",
 "When another vessel in distress can't send her own Mayday",
 ["When you're in distress yourself but can't use channel 16","When you're repeating your own Mayday because nobody answered","When the coastguard asks you to stand by on channel 16"],
 "For example, you see distress flares, or hear a Mayday that hasn't been acknowledged. Pass on everything you know.");

/* ================= 100 MORE SCENARIOS ================= */
/* ---- night: vessel lights from your own bow (22) ---- */
SC("s2-n-smallport","Night, in the inshore lifeboat. These lights are on your starboard bow, the bearing steady and the range closing.",
 "What do you do?",
 "Give way: alter to starboard and pass astern of her",
 ["Stand on: she's the one on your starboard side","Alter to port and cross ahead of her","Keep going, and flash a torch at her"],
 "One white masthead light and a red sidelight: a power-driven vessel under 50 m showing you her port side, so she's heading to your left. She's crossing from your starboard side, so you give way (Rule 15): alter boldly to starboard and pass astern (Rules 8 and 16).",{t:"ship",s:"small_port",dx:80});
SC("s2-n-smallstbd","Night. These lights are on your port bow, on a steady bearing and closing.",
 "You're a power-driven vessel. What do you do?",
 "Stand on: keep your course and speed, and watch her",
 ["Give way: alter to starboard and pass well astern of her","Alter to port to open the distance","Stop, as she's showing you her green light"],
 "A masthead light and a green sidelight: she's showing her starboard side, heading to your right, with you on her starboard side. She gives way (Rule 15). Keep your course and speed (Rule 17), ready to act if she doesn't.",{t:"ship",s:"small_stbd",dx:-80});
SC("s2-n-sailrg","Night, under power. Ahead you see these lights coming towards you.",
 "What is she, and what do you do?",
 "A sailing vessel: keep out of her way",
 ["A pilot vessel: hold your course and speed","A fishing vessel: alter to port","A power-driven vessel: both alter to starboard"],
 "Red over green at the masthead, with sidelights: a sailing vessel showing the optional all-round lights of Rule 25(c) ('red over green, sailing machine'). A power-driven vessel keeps out of the way of a sailing vessel (Rule 18(a)).",{t:"ship",s:"sail_rg_head"});
SC("s2-n-towshort","Night, under power. A tug is dead ahead and getting closer, showing these lights.",
 "What is she doing, and what do you do?",
 "Towing a short tow: alter to starboard, well clear",
 ["Two vessels, one behind the other: pass between them","At anchor with her tow: pass close down her side","Not under command: stop and wait for her to pass"],
 "Two white masthead lights in a vertical line, with both sidelights: a power-driven vessel towing, with a tow of 200 m or less (Rule 24(a)). A large ship seen head-on can look similar, because her two masthead lights line up, but they're on separate masts and further apart; a tug's two masthead lights are close together in a vertical line on one mast. You're both power-driven and meeting head-on, so alter to starboard (Rule 14), and give the tow behind her plenty of room.",{t:"ship",s:"tow_short_head"});
SC("s2-n-towastern","Night. You're slowly catching up these lights, fine on your starboard bow.",
 "What are you looking at?",
 "A vessel towing, seen from astern, with her tow in between",
 ["A vessel at anchor showing a flashing yellow light above her","A pilot vessel heading away from you","Two fishing boats working together"],
 "A yellow towing light above a white sternlight is the stern of a vessel towing (Rule 24(a)). The lower white light nearer you is her tow's sternlight. You're overtaking, so keep clear of both (Rule 13), and never pass between them.",{t:"ship",s:"tow_astern",dx:22});
SC("s2-n-nucmaking","Night. These lights are coming towards you, with no white light showing.",
 "What is she, and what do you do?",
 "Not under command but moving: keep out of her way",
 ["Fishing at anchor: pass close astern of her, clear of nets","A sailing vessel: both alter to starboard","Aground in the channel: stop and wait"],
 "Two all-round red lights in a vertical line, with both sidelights: a vessel not under command, making way through the water (Rule 27(a)). She can't manoeuvre as the Rules require, so keep well out of her way (Rule 18).",{t:"ship",s:"nuc_making_head"});
SC("s2-n-ramhead","Night. A ship ahead is coming towards you showing these lights.",
 "What does red, white, red in a vertical line tell you?",
 "She's restricted in her ability to manoeuvre: keep clear",
 ["She's fishing with gear out: pass on the side of her gear","She's aground: the water there is too shallow, so stop","She's a pilot vessel on duty: stand on and let her pass"],
 "Red-white-red all-round lights: restricted in her ability to manoeuvre (Rule 27(b)). With masthead and sidelights she's making way too. Keep out of her way (Rule 18).",{t:"ship",s:"ram_head"});
SC("s2-n-dredger","Night. Ahead, a dredger at work is lying still and showing these lights.",
 "Which side do you pass?",
 "The side with the two green lights",
 ["The side with the two red lights","Either side, keeping close to her","Neither side: wait until she moves"],
 "Red-white-red shows she's restricted in her ability to manoeuvre. Two reds in a vertical line mark the side with the obstruction; two greens mark the side where you may pass (Rule 27(d)).",{t:"ship",s:"dredger_night"});
SC("s2-n-trawlside","Night, under power. These lights are fine on your starboard bow, crossing from right to left.",
 "What is she, and what do you do?",
 "Trawling: keep well clear of her and her gear",
 ["A pilot on duty: hold your course and speed","Not under command: sound five short blasts","Power-driven: stand on, as she gives way"],
 "Green over white all-round lights: trawling (Rule 26(b), 'green over white, trawling tonight'). The red sidelight means she's making way and showing you her port side, heading to your left. A power-driven vessel keeps out of the way of a vessel engaged in fishing (Rule 18(a)); under sail you'd keep clear of her too (Rule 18(b)). Her trawl may stretch a long way astern.",{t:"ship",s:"trawl_side_port",dx:30});
SC("s2-n-fishstop","Night. Ahead you see these lights. They aren't moving and there are no sidelights.",
 "What is she?",
 "Fishing, not trawling, and not making way",
 ["Trawling, and making way through the water","A pilot vessel at anchor, waiting for a ship","Not under command and drifting with the tide"],
 "Red over white: fishing other than trawling (Rule 26(c)). No sidelights or sternlight means she isn't making way. Her nets or lines may stretch a long way, so give her a wide berth.",{t:"ship",s:"fish_stopped"});
SC("s2-n-pilot","Night, under power, approaching a port. These lights are on your port bow, crossing from left to right on a steady bearing.",
 "Does she have right of way over you?",
 "No: she's power-driven and you're on her starboard side",
 ["Yes: pilot vessels on duty always have priority","Yes: she's restricted in her ability to manoeuvre while on duty","No: but you must turn to port to help her"],
 "White over red: a pilot vessel on duty ('white over red, pilot ahead', Rule 29). With a green sidelight she's making way, heading to your right. The Rules give pilot vessels no priority: you're both power-driven and crossing, with you on her starboard side, so she gives way (Rule 15). Keep your course and speed, but watch her: pilot boats manoeuvre around ships.",{t:"ship",s:"pilot_side",dx:-50});
SC("s2-n-cbdhead","Night, near a deep-water channel. A large ship is coming towards you showing these lights.",
 "What do you do?",
 "Get out of her way early: she can't leave the deep water",
 ["Hold your course: she must alter to starboard, as it's head-on","Cross ahead of her to reach shallower water","Sound two short blasts and alter to port"],
 "Three all-round red lights in a vertical line: constrained by her draught (Rule 28). Other vessels avoid impeding her safe passage (Rule 18(d)); act early and positively, and keep to the side of the channel.",{t:"ship",s:"cbd_head"});
SC("s2-n-mine","Night. A naval vessel ahead is showing these lights.",
 "What is she doing, and how close may you go?",
 "Mine clearance: stay more than 1000 metres away",
 ["Trawling: stay clear of the nets astern of her","Pilot duty: pass close down her starboard side","Dredging: pass on the side with the green lights"],
 "One all-round green light near the foremast head and one at each end of the fore yard: a vessel engaged in mine clearance. It's dangerous to approach within 1000 metres (Rule 27(f)).",{t:"ship",s:"mine_night"});
SC("s2-n-ramanchor","Night. A buoy tender is lying still near a channel buoy, showing these lights.",
 "What are the lights telling you?",
 "She's at anchor and working: keep clear of her",
 ["She's aground: the water there is shallow","She's not under command and drifting","She's fishing at anchor with nets out"],
 "Red-white-red: restricted in her ability to manoeuvre (Rule 27(b)), here servicing a navigation mark. The two white anchor lights, the forward one higher, show she's also at anchor (Rule 27(b)(iv)).",{t:"ship",s:"ram_anchor"});
SC("s2-n-sailred","Night, under power. Fine on your starboard bow is one red light. It isn't flashing, its bearing is steady and it's getting closer.",
 "What do you do?",
 "Give way: it's probably a yacht under sail, crossing",
 ["Stand on: it's a port-hand buoy marking the channel","Stand on: a red light means she has to give way","Alter to port and cross ahead of her before she arrives"],
 "A lone red light that shines continuously and is closing is most likely a sailing vessel's port sidelight: she's heading to your left. You give way to a sailing vessel (Rule 18(a)), and she's on your starboard side anyway, so alter to starboard and pass astern. A buoy's light flashes in a set rhythm rather than shining continuously. If a buoy's bearing ever stays steady, the tide is setting you onto it.",{t:"ship",s:"sail_red_only",dx:70});
SC("s2-n-nucside","Night. On your port bow, these lights are crossing from left to right.",
 "What is she, and who keeps clear?",
 "Not under command, making way: you keep clear",
 ["Power-driven: she keeps clear of you","Fishing: whoever has the other to port","Sailing: she keeps clear, as she's to port"],
 "Two all-round red lights in a vertical line, with a green sidelight: not under command, making way, heading to your right. Even though she's on your port side, you keep out of her way (Rule 18).",{t:"ship",s:"nuc_side",dx:-50});
SC("s2-n-tri","Night. High up ahead you see a red and a green light very close together, with no white light above or below them.",
 "What is it most likely to be?",
 "A sailing yacht with a masthead tricolour",
 ["A small motor boat with a combined lantern","A pilot vessel on duty, heading away from you","Two buoys, one red and one green, together"],
 "A sailing vessel under 20 m may combine her sidelights and sternlight in one lantern at the top of the mast (Rule 25(b)). Head-on you see the red and green sectors together, high up. A small power-driven vessel would show a white light above her sidelights.",{t:"ship",s:"sail_tri_head"});
SC("s2-n-sternchannel","Night, in a narrow channel. You're closing on these lights ahead and want to overtake on her starboard side, but she'll need to move over to let you by.",
 "What do you do?",
 "Sound two prolonged and one short, and wait for her reply",
 ["Sound one short blast and go straight past her","Flash your searchlight at her bridge, then go past","Sound five short blasts, then go past on her starboard side"],
 "Rule 9(e) and Rule 34(c)(i): two prolonged then one short means 'I intend to overtake you on your starboard side'. Wait for her agreement (prolonged, short, prolonged, short) before going. Even then, you keep clear as the overtaking vessel (Rule 13).",{t:"ship",s:"stern"});
SC("s2-n-anchorbig","Night. Ahead, a large ship is lying at anchor in your way.",
 "Which way does her bow point, and where should you pass?",
 "Bow to your left: pass round her stern, to the right",
 ["Bow to your right: pass round her stern, to the left","Bow to your left: pass close across her bow","You can't tell: pass close on either side"],
 "At anchor the forward anchor light is higher than the after one (Rule 30(a)). The higher light is on your left, so her bow points left, with her cable running out ahead of her. Pass astern of her, giving her room.",{t:"ship",s:"anchor_big"});
SC("s2-n-ramside","Night. A cable ship crossing from your port side on a steady bearing shows these lights.",
 "Who keeps clear?",
 "You do: she's restricted in her ability to manoeuvre",
 ["She does: you're on her starboard side, so you stand on","Neither: both of you alter to starboard together","She does, as soon as she sees your green sidelight"],
 "Red-white-red, with a masthead light and green sidelight: restricted in her ability to manoeuvre, making way, heading to your right. Rule 18 overrides the crossing rule, so you keep out of her way even though she's on your port side.",{t:"ship",s:"ram_side",dx:-40});
SC("s2-n-towlong","Night, under power. A tug dead ahead is closing, showing these lights.",
 "What should you expect behind her?",
 "A tow more than 200 metres long",
 ["A second ship following close behind","Nothing: three white lights mean she's huge","Fishing nets stretching out 150 metres"],
 "Three white masthead lights in a vertical line, with sidelights: a power-driven vessel towing, with a tow over 200 m (Rule 24(a)). You're both power-driven and meeting head-on, so alter to starboard early (Rule 14) and keep well clear of the whole tow.",{t:"ship",s:"tow_long"});
SC("s2-n-small12","Night, under power in a harbour approach. Dead ahead, a small boat's lights are coming towards you.",
 "What do you do?",
 "Treat it as head-on: alter to starboard",
 ["Stand on: small boats keep clear of you","Alter to port to pass starboard to starboard","Stop and let her decide which way to go"],
 "A white light above a red and green close together: a small power-driven vessel with a combined lantern, heading straight for you. You're both power-driven and meeting head-on, so each alters to starboard and passes port to port (Rule 14). Size doesn't change that.",{t:"ship",s:"small12_head"});

/* ---- night: buoy lights (13) ---- */
SC("s2-l-N","Night, heading south along the coast. You see this white light ahead.",
 "Time it with the stopwatch. What is it, and where's the safe water?",
 "A north cardinal: the safe water is to its north",
 ["A south cardinal: the safe water is to its south","An isolated danger: pass either side of it","A west cardinal: the safe water is to its west"],
 "Quick flashing white without a break: a north cardinal. Its safe water is to the north, which is your side, so don't carry on south past it; follow the chart round, staying north of it.",{t:"night",l:"Q",m:"N"});
SC("s2-l-E","Night, heading north. This white light is fine on your port bow.",
 "Time it. Which side do you pass?",
 "East of it, leaving it on your port side",
 ["West of it, leaving it on your starboard side","East of it, leaving it on your starboard side","West of it, leaving it on your port side"],
 "3 very quick flashes every 5 seconds: an east cardinal, with safe water to its east. Heading north with it fine on your port bow, you're already a little east of it: hold your course, keep it to port and pass east of it. If it were on your starboard bow you'd be on the danger side and would need to get east of it first.",{t:"night",l:"VQ3_5",m:"E"});
SC("s2-l-S","Night, heading east. This white light is fine on your port bow.",
 "Time it. Which side do you pass?",
 "South of it, leaving it on your port side",
 ["North of it, leaving it on your starboard side","South of it, leaving it on your starboard side","North of it, leaving it on your port side"],
 "6 quick flashes then a long flash, every 15 seconds: a south cardinal, with safe water to its south. Heading east, south is on your right, so keep right of the mark: it passes down your port side.",{t:"night",l:"Q6LFl15",m:"S"});
SC("s2-l-W","Night, heading north. This white light is ahead of you.",
 "Time it. Which side do you pass?",
 "West of it, leaving it on your starboard side",
 ["East of it, leaving it on your port side","East of it, leaving it on your starboard side","West of it, leaving it on your port side"],
 "9 very quick flashes every 10 seconds: a west cardinal, with safe water to its west. Heading north, west is on your left, so keep left of the mark and it passes down your starboard side.",{t:"night",l:"VQ9_10",m:"W"});
SC("s2-l-iso","Night, on passage in open water. This white light is ahead.",
 "Time it. What do you do?",
 "Give it a wide berth: it's on a danger",
 ["Steer for it: it marks the channel's centre","Pass close to it, on its west side","Keep it on your port side going in"],
 "Groups of 2 white flashes: an isolated danger mark, on or above a small danger with navigable water all round. Pass either side, but not close.",{t:"night",l:"Fl2_10",m:"iso"});
SC("s2-l-safeLFl","Night, making landfall from the open sea. This white light is ahead.",
 "Time it. What is it telling you?",
 "Safe water all round: often the landfall mark",
 ["A danger right underneath it: keep clear","The port side of a channel: keep it to port","A new wreck: keep well clear of it"],
 "One long flash every 10 seconds: a safe water mark, with navigable water all round. It often marks the seaward start of an approach, or the middle of a channel.",{t:"night",l:"LFl10",m:"safe"});
SC("s2-l-safeMo","Night, approaching a channel from seaward. You see this white light ahead.",
 "Time it. What is it?",
 "A safe water mark",
 ["An isolated danger mark","An east cardinal mark","A special mark"],
 "Short then long, every 6 seconds: Morse code A, one of the safe water mark's patterns. There's navigable water all round it.",{t:"night",l:"MoA6",m:"safe"});
SC("s2-l-special","Night, a mile off the coast. You see this light near your track.",
 "What is it, and what do you do?",
 "A special mark: check the chart for what it marks",
 ["A cardinal mark: pass on the side it's named after","A lateral mark: keep it to starboard","A wreck mark: keep well clear of it"],
 "A yellow light means a special mark, showing a feature such as a cable, outfall, spoil ground or exercise area. The chart tells you what it is and whether to keep out.",{t:"night",l:"Fl4Y15",m:"special"});
SC("s2-l-pcs","Night, heading in from sea. The channel divides ahead, and this light is where it splits.",
 "Time it. Which way is the main channel?",
 "To starboard: keep the light on your port side",
 ["To port: keep the light on your starboard side","Straight on: pass close either side of it","To port: keep the light on your port side"],
 "Red, 2 flashes then 1: a preferred-channel-to-starboard mark, a modified port-hand mark. Treat it like a port-hand mark and keep it on your port side, which takes you into the main channel to starboard.",{t:"night",l:"Fl21R10",m:"pcs"});
SC("s2-l-pcp","Night, heading in from sea, you reach this light where the channel divides.",
 "Time it. How do you stay in the main channel?",
 "Keep it on your starboard side: the main channel is to port",
 ["Keep it on your port side: the main channel is to starboard","Pass close to it, on whichever side is nearer","Keep it on your port side: the main channel is to port"],
 "Green, 2 flashes then 1: a preferred-channel-to-port mark, a modified starboard-hand mark. Keep it to starboard, like a starboard-hand mark.",{t:"night",l:"Fl21G10",m:"pcp"});
SC("s2-l-portin","Night, heading in from sea along a buoyed channel. This light is fine on your port bow.",
 "Which side do you leave it?",
 "On your port side",
 ["On your starboard side","Either side","Neither: stop until daylight"],
 "A red light on a lateral mark: port-hand. Going in the direction of buoyage, keep it on your port side.",{t:"night",l:"QR",m:"port"});
SC("s2-l-stbdout","Night, leaving harbour and heading out to sea along a buoyed channel. This light is ahead.",
 "Which side do you leave it?",
 "On your port side",
 ["On your starboard side","Either side","Close ahead of it"],
 "A green light: a starboard-hand mark. Heading out to sea you're going against the direction of buoyage, so leave starboard-hand marks on your port side.",{t:"night",l:"FlG5",m:"stbd"});
SC("s2-l-portout","Night, leaving harbour and heading out to sea. This red light is fine on your port bow.",
 "What does this tell you?",
 "You'd pass it the wrong side: alter so it passes to starboard",
 ["You're in the right place: keep it on your port side","You're in the middle of the channel: carry straight on","You're coming up to a preferred channel mark"],
 "Groups of 2 red flashes: a port-hand mark. Heading out, port-hand marks should pass down your starboard side. With it on your port bow, holding on would leave it to port, so alter until it will pass to starboard, and check the chart in case the channel bends.",{t:"night",l:"Fl2R6",m:"port"});

/* ---- day: vessels and signals (13) ---- */
SC("s2-v-mine","By day, a naval vessel ahead shows these shapes.",
 "What do you do?",
 "Stay more than 1000 metres from her",
 ["Pass close astern: she's at anchor","Keep clear of her starboard side only","Hold your course: she must give way"],
 "Three black balls, one near the foremast head and one at each end of the fore yard: engaged in mine clearance. It's dangerous to approach within 1000 metres (Rule 27(f)).",{t:"day",k:"mine"});
SC("s2-v-ramanchor","By day, a vessel lying beside a navigation buoy shows these shapes.",
 "What is she doing?",
 "Working on the buoy while at anchor: keep clear",
 ["Aground beside the buoy, in shallow water: keep clear","Not under command and drifting","Fishing at anchor with nets out"],
 "Ball, diamond, ball: restricted in her ability to manoeuvre, here servicing a navigation mark. The ball right forward shows she's at anchor too (Rule 27(b)(iv)).",{t:"day",k:"ramanchor"});
SC("s2-v-fishsail","You're under sail. A fishing boat on your starboard bow, crossing ahead of you, shows this shape.",
 "Who keeps out of the way?",
 "You do: sail keeps clear of a vessel fishing",
 ["She does: a motor vessel gives way to sail","She does: she's the one crossing ahead of you","Neither: both of you alter course to starboard"],
 "Two cones, points together: engaged in fishing (Rule 26). A sailing vessel keeps out of the way of a vessel engaged in fishing (Rule 18(b)).",{t:"day",k:"fishsail"});
SC("s2-v-cbdsail","You're sailing across a port approach. A large ship coming from your port side shows this shape.",
 "What do you do?",
 "Keep clear early, so you don't impede her",
 ["Stand on: power gives way to sail","Sail close across her bow to clear quickly","Stand on: she's on your port side"],
 "A black cylinder: constrained by her draught (Rule 28). A sailing vessel must avoid impeding her safe passage (Rule 18(d)), so 'power gives way to sail' doesn't help you here. Act early and obviously.",{t:"day",k:"cbdsail"});
SC("s2-v-nucmove","By day, a ship crossing ahead of you from right to left shows two black balls. She has a bow wave.",
 "What do you do?",
 "Keep out of her way: she's not under command",
 ["Stand on: she's making way, so she gives way","Alter to port and pass ahead of her","Ignore the shapes, as she's clearly moving"],
 "Two balls in a vertical line: not under command (Rule 27(a)). She may still be making way, but she can't manoeuvre as the Rules require. Keep well clear (Rule 18).",{t:"day",k:"nucmove"});
SC("s2-v-dredger2","A dredger ahead shows these shapes: two diamonds on the left yard and two balls on the right.",
 "Which side do you pass?",
 "The left side, by the two diamonds",
 ["The right side, by the two balls","Either side, as she's at anchor","Neither: she's aground"],
 "Ball-diamond-ball shows she's restricted in her ability to manoeuvre. Two balls mark the side with an obstruction; two diamonds mark the side where you may pass (Rule 27(d)).",{t:"day",k:"dredger2"});
SC("s2-v-towshort","You're under power. A tug towing a barge on a short line crosses from your starboard side on a steady bearing. Neither shows any shape.",
 "Who keeps out of the way?",
 "You do: she's power-driven and on your starboard side",
 ["She does: tugs always give way to all other craft at sea","She does: a vessel towing can't manoeuvre","Neither: both should alter to port"],
 "With no shapes she isn't restricted in her ability to manoeuvre, and a tow of 200 m or less shows no diamond. She's a power-driven vessel crossing from your starboard side, so you give way (Rule 15), passing well astern of the barge too.",{t:"day",k:"towshort"});
SC("s2-v-anchormove","By day, a ship shows a black ball forward, but she has a bow wave and is clearly moving.",
 "How do you treat her?",
 "As underway: watch her and apply the rules",
 ["As at anchor: pass close ahead of her","As not under command: keep clear","As aground: avoid the shallow water"],
 "The ball means 'at anchor', but she's obviously moving, so it may have been left up by mistake. Go by what she's actually doing: use the steering and sailing rules and keep a close eye on her (Rules 2 and 7).",{t:"day",k:"anchormove"});
SC("s2-v-nc","A small motor boat ahead is flying these two flags, one above the other.",
 "What do they mean?",
 "A distress signal: they need help",
 ["They have a pilot on board","They have divers down","They're fishing with nets out"],
 "Flags N over C are the International Code distress signal (Annex IV). Go to help if you can, and tell the coastguard.",{t:"day",k:"flagNC"});
SC("s2-v-flagball","A fishing boat ahead is flying a square flag with a ball hoisted just above it.",
 "What does it mean?",
 "A distress signal: they need help",
 ["She's at anchor, with her nets out","She's not under command","She's towing a long tow"],
 "A square flag with a ball, or anything like a ball, above or below it is a distress signal (Annex IV).",{t:"day",k:"flagball"});
SC("s2-v-flames","Half a mile off, you see flames and smoke rising from a small boat.",
 "What should you assume?",
 "Distress: go to help and alert the coastguard",
 ["She's burning rubbish, so carry on with care","She's warning you to keep clear of her nets","She's signalling that she's at anchor"],
 "Flames on a vessel, as from a burning tar barrel, are a recognised distress signal (Annex IV), and a fire aboard is an emergency anyway.",{t:"day",k:"flames"});
SC("s2-v-ram2","You're under sail. A survey ship crossing from your port side shows these shapes.",
 "Who keeps out of the way?",
 "You do: she's restricted in her ability to manoeuvre",
 ["She does: a power-driven vessel gives way to sail","She does: you're on her starboard side, so stand on","Neither: she must stop and wait for you to pass"],
 "Ball, diamond, ball: restricted in her ability to manoeuvre (Rule 27(b)). A sailing vessel keeps out of her way (Rule 18(b)).",{t:"day",k:"ram2"});
SC("s2-v-motorsail2","You're under sail. A yacht crossing from your starboard side has her sails up and shows this cone.",
 "Who keeps out of the way?",
 "She does: with the cone she counts as power-driven",
 ["You do: she's on your starboard side, crossing","You do: she's on starboard tack, so she stands on","Neither: both of you should alter to starboard"],
 "A cone, point down, forward: under sail but also using her engine (Rule 25(e)), so she's a power-driven vessel. Power-driven vessels keep out of the way of sailing vessels (Rule 18(a)): she gives way, and you stand on, ready to act if she doesn't.",{t:"day",k:"motorsail2"});

/* ---- day: buoys from the helm (16) ---- */
SC("s2-b-Ewest","Heading west by day, you see this mark ahead.",
 "Where is the danger?",
 "Beyond it to the west: stay east of it",
 ["Just to its east, between you and the mark","To its north: pass round to the south","All round it: give it a wide berth either side"],
 "Black, yellow, black with cones base to base: an east cardinal, with safe water to its east, which is your side. The danger lies beyond it to the west, so don't carry on past it; follow the chart round, staying east of the mark.",{t:"day",k:"Ewest"});
SC("s2-b-Wnorth","Heading north by day, you see this mark fine on your port bow.",
 "Which side do you pass it?",
 "West of it, leaving it on your starboard side",
 ["East of it, leaving it on your port side","West of it, leaving it on your port side","East of it, leaving it on your starboard side"],
 "Yellow, black, yellow with cones point to point: a west cardinal, safe water to its west. Heading north, west is on your left, so you keep left of the mark and it passes down your starboard side.",{t:"day",k:"Wnorth"});
SC("s2-b-Neast","Heading east by day, you see this mark on your starboard bow.",
 "Which side do you pass it?",
 "North of it, leaving it on your starboard side",
 ["South of it, leaving it on your port side","North of it, leaving it on your port side","South of it, leaving it on your starboard side"],
 "Black over yellow, cones pointing up: a north cardinal, safe water to its north. Heading east, north is on your left, so keep left of the mark and it passes down your starboard side.",{t:"day",k:"Neast"});
SC("s2-b-Ssouth","Heading south by day, you see this mark ahead of you.",
 "What does it tell you?",
 "You may be on the danger side: slow down and check the chart",
 ["You're on the safe side: carry straight on past it to the south","Pass close either side: it marks mid-channel","Keep it to port, as it's a channel mark"],
 "Yellow over black, cones pointing down: a south cardinal, with safe water to its south. You're approaching from the north, the side where the danger lies. Slow down, fix your position and work out from the chart how to get round safely.",{t:"day",k:"Ssouth"});
SC("s2-b-Esouth","Heading south by day, you see this mark on your port bow.",
 "Which side do you pass it?",
 "East of it, leaving it on your starboard side",
 ["West of it, leaving it on your port side","East of it, leaving it on your port side","West of it, leaving it on your starboard side"],
 "Black, yellow, black: an east cardinal, safe water to its east. Heading south, east is on your left, so keep left of the mark and it passes down your starboard side.",{t:"day",k:"Esouth"});
SC("s2-b-NSpair","Heading east by day, you see these two marks either side of your track. They mark the same shoal.",
 "Where do you go?",
 "Not between them: the shoal lies between",
 ["Straight between them: that's the channel","Close past the left mark, on its south side","Close past the right mark, on its north side"],
 "The left mark is a north cardinal, with safe water to its north; the right one is a south cardinal, with safe water to its south. The danger lies between them, so pass north of the north cardinal or south of the south cardinal.",{t:"day",k:"NSpair"});
SC("s2-b-pcpin","Coming in from sea by day, the channel splits ahead at this mark.",
 "Which way is the main channel?",
 "To port: keep the mark on your starboard side",
 ["To starboard: keep the mark on your port side","To port: keep the mark on your port side","Straight ahead: pass close either side"],
 "Green with a broad red band and a green cone: a preferred-channel-to-port mark, a modified starboard-hand mark. Keep it to starboard, as you would a starboard-hand mark, and you'll be in the main channel, which goes to port.",{t:"day",k:"pcpin"});
SC("s2-b-pcsout","Leaving harbour by day along the main channel, you pass this mark where a side channel joins.",
 "Which side should it be?",
 "On your starboard side",
 ["On your port side","Either side: it's only a junction mark","Dead ahead: steer for it"],
 "Red with a broad green band and a red can: a preferred-channel-to-starboard mark, kept to port by vessels coming in along the main channel. Going out you pass it the other way, so it's on your starboard side.",{t:"day",k:"pcsout"});
SC("s2-b-stbdout","Leaving harbour by day, heading out to sea along a straight buoyed channel. The green mark you're approaching is on your starboard bow.",
 "Where are you?",
 "Outside the channel: get back so it's to port",
 ["In the channel: keep it on your starboard side as you go","Right in the middle of the channel","Coming up to a preferred channel mark"],
 "Going out, green starboard-hand marks should pass down your port side. With one on your starboard bow you're beyond the channel edge it marks, in shallower water. Get back inside so it's on your port side.",{t:"day",k:"stbdout"});
SC("s2-b-safemid","Heading in along a wide channel by day, you see this mark in the middle, between the red and green marks.",
 "How do you pass it?",
 "Either side: there's safe water all round",
 ["Leave it to starboard, as it's red","Stop: it marks the end of the buoyed channel","Not at all: there's a danger under it"],
 "Red and white vertical stripes: a safe water mark, used for a channel's centre line or middle. There's navigable water all round it. In a channel, still keep to the starboard side where it's safe and practicable (Rule 9(a)), which normally means leaving it to port.",{t:"day",k:"safemid"});
SC("s2-b-poles","Going up a small river from the sea by day, you see these poles marking the channel.",
 "How do you treat them?",
 "As lateral marks: red to port, green to starboard",
 ["As private marks that you can safely ignore","Red to starboard, green to port: red right returning","Pass between them, but only at high water"],
 "Poles, perches and beacons with lateral colours and topmarks are lateral marks. Coming in from sea is the direction of buoyage, so keep red to port and green to starboard.",{t:"day",k:"poles"});
SC("s2-b-pcpout","Leaving harbour by day along the main channel, you pass this mark where a side channel branches off.",
 "Which side should it be?",
 "On your port side",
 ["On your starboard side","Either side: it's only a junction mark","Dead ahead: steer for it"],
 "Green with a broad red band: a preferred-channel-to-port mark, kept to starboard by vessels coming in along the main channel. Going out you pass it the other way, so it's on your port side.",{t:"day",k:"pcpout"});
SC("s2-b-Swest","Heading west by day, you see this mark fine on your port bow.",
 "Which side do you pass it?",
 "South of it, leaving it on your starboard side",
 ["North of it, leaving it on your port side","South of it, leaving it on your port side","North of it, leaving it on your starboard side"],
 "Yellow over black: a south cardinal, safe water to its south. Heading west, south is on your left, so keep left of the mark and it passes down your starboard side.",{t:"day",k:"Swest"});
SC("s2-b-Nwest","Heading west by day, you see this mark on your starboard bow.",
 "Which side do you pass it?",
 "North of it, leaving it on your port side",
 ["South of it, leaving it on your starboard side","North of it, leaving it on your starboard side","South of it, leaving it on your port side"],
 "Black over yellow: a north cardinal, safe water to its north. Heading west, north is on your right, so keep right of the mark and it passes down your port side.",{t:"day",k:"Nwest"});
SC("s2-b-Enorth","Heading north by day, you see this mark on your port bow.",
 "Which side do you pass it?",
 "East of it, leaving it on your port side",
 ["West of it, leaving it on your starboard side","East of it, leaving it on your starboard side","West of it, leaving it on your port side"],
 "Black, yellow, black: an east cardinal, safe water to its east. Heading north, east is on your right, so keep right of the mark and it passes down your port side.",{t:"day",k:"Enorth"});
SC("s2-b-specialrow","By day, a line of yellow buoys runs out from a beach.",
 "What are they likely to mark?",
 "A special area, such as a swimming or water-ski zone",
 ["A newly discovered wreck: keep well clear of it","An isolated danger with water all round it","Safe water, and a good place to anchor"],
 "Yellow marks are special marks. Lines of yellow buoys off beaches often mark swimming areas, speed limit zones or water-ski lanes. Check the chart and local notices, and keep out of bathing areas.",{t:"day",k:"specialrow"});

/* ---- overhead plots (16) ---- */
SC("s2-p-overtaken","On passage in good visibility. A faster ship is coming up from your starboard quarter on a steady bearing.",
 "Who keeps out of the way?",
 "She does, as she's overtaking: you stand on",
 ["You do: she's on your starboard side, so she stands on","Both of you should alter to starboard","You do: the larger ship has priority"],
 "She's coming up from more than 22.5° abaft your beam, so she's overtaking (Rule 13) and must keep clear. Keep your course and speed (Rule 17), and keep watching her.",{t:"plot",k:"overtaken"});
SC("s2-p-porttack","You're sailing on port tack. Another yacht on starboard tack is crossing, on a steady bearing.",
 "Who keeps out of the way?",
 "You do: port tack gives way to starboard tack",
 ["She does: she's further to windward, so she keeps clear","Neither: both should bear away","She does: you're on her port side"],
 "Rule 12(a)(i): when each has the wind on a different side, the one with the wind on her port side keeps out of the way.",{t:"plot",k:"porttack"});
SC("s2-p-windward","You're sailing on starboard tack. Another yacht, also on starboard tack, is to leeward of you and closing.",
 "Who keeps out of the way?",
 "You do, as the windward boat",
 ["She does, as the leeward boat","Whichever of you is faster","Neither: both hold your course"],
 "Rule 12(a)(ii): with the wind on the same side, the vessel to windward keeps out of the way of the one to leeward.",{t:"plot",k:"windward"});
SC("s2-p-leeward","You're sailing on port tack. Another yacht, also on port tack, is to windward of you and closing.",
 "Who keeps out of the way?",
 "She does: she's to windward of you",
 ["You do: you're both on port tack","You do: you're the leeward boat","Neither: both should tack away"],
 "Rule 12(a)(ii): with the wind on the same side, the vessel to windward keeps out of the way of the one to leeward. Hold your course, ready to act if she doesn't.",{t:"plot",k:"leeward"});
SC("s2-p-stbdtack","You're sailing on starboard tack. A yacht on port tack is crossing from your port side on a steady bearing.",
 "What do you do?",
 "Stand on: she's on port tack and must keep clear",
 ["Give way: she's crossing from your port side","Tack away early to keep well clear of her","Bear away now and pass astern of her"],
 "Rule 12(a)(i): she has the wind on her port side, so she keeps out of the way. Hold your course and speed (Rule 17), ready to act if she leaves it too late.",{t:"plot",k:"stbdtack"});
SC("s2-p-sailovertake","You're sailing and catching up a slow motor boat ahead, heading the same way.",
 "Who keeps out of the way?",
 "You do: you're overtaking her",
 ["She does: power gives way to sail","Neither: there's room for both","She does: she's the slower vessel"],
 "Rule 13 applies whatever the vessel type, over and above Rule 18: the overtaking vessel keeps clear, even under sail.",{t:"plot",k:"sailovertake"});
SC("s2-p-fishport","In the lifeboat. A trawler engaged in fishing is crossing from your port side on a steady bearing.",
 "Who keeps out of the way?",
 "You do: she's engaged in fishing",
 ["She does: you're on her starboard side","She does: fishing boats give way to lifeboats","Neither: both should alter to starboard"],
 "Rule 18(a): a power-driven vessel keeps out of the way of a vessel engaged in fishing, and that overrides the crossing rule. A lifeboat on service has no special right of way under the Rules.",{t:"plot",k:"fishport"});
SC("s2-p-channelcross","You want to cross a narrow channel in the inshore lifeboat. A large ship that can only navigate within the channel is coming down it, and she's already close.",
 "What do you do?",
 "Wait until she's passed, then cross",
 ["Cross quickly ahead of her at full speed","Cross at right angles: she'll slow down","Sound one long blast and then cross"],
 "Rule 9(d): don't cross a narrow channel if it impedes a vessel that can only navigate safely within it. If you hesitate in her path she may sound five short blasts.",{t:"plot",k:"channelcross"});
SC("s2-p-tssjoin","You need to join the eastbound traffic lane from the side.",
 "How should you join it?",
 "At as small an angle to the traffic flow as practicable",
 ["At right angles to the flow, to be clear to other ships","Through the separation zone, which is quieter","Wherever is quickest, then turn along the lane"],
 "Rule 10(b)(iii): normally join at the end of a lane; when joining from the side, do so at as small an angle to the general direction of traffic flow as practicable.",{t:"plot",k:"tssjoin"});

function cone(cy,up){return up?`<polygon points="89,${cy+8} 111,${cy+8} 100,${cy-8}" fill="${COL.K}"/>`:`<polygon points="89,${cy-8} 111,${cy-8} 100,${cy+8}" fill="${COL.K}"/>`;}
function topmark(kind,yb){
  const st='stroke="#0d0f12" stroke-width="1.2"';
  switch(kind){
    case "can_r":return `<rect x="90" y="${yb-20}" width="20" height="20" fill="${COL.R}" ${st}/>`;
    case "cone_g":return `<polygon points="88,${yb} 112,${yb} 100,${yb-22}" fill="${COL.G}" ${st}/>`;
    case "cones_up":return cone(yb-30,true)+cone(yb-10,true);
    case "cones_down":return cone(yb-30,false)+cone(yb-10,false);
    case "cones_out":return cone(yb-28,true)+cone(yb-12,false);
    case "cones_in":return cone(yb-30,false)+cone(yb-14,true);
    case "spheres2":return `<circle cx="100" cy="${yb-28}" r="8" fill="${COL.K}"/><circle cx="100" cy="${yb-9}" r="8" fill="${COL.K}"/>`;
    case "sphere_r":return `<circle cx="100" cy="${yb-11}" r="10" fill="${COL.R}" ${st}/>`;
    case "x_y":return `<g stroke-linecap="square"><path d="M90 ${yb-24} L110 ${yb-4} M110 ${yb-24} L90 ${yb-4}" stroke="#3a2c00" stroke-width="7"/><path d="M90 ${yb-24} L110 ${yb-4} M110 ${yb-24} L90 ${yb-4}" stroke="${COL.Y}" stroke-width="4.5"/></g>`;
    case "plus_y":return `<g><path d="M100 ${yb-26} L100 ${yb-2} M88 ${yb-14} L112 ${yb-14}" stroke="#3a2c00" stroke-width="7"/><path d="M100 ${yb-26} L100 ${yb-2} M88 ${yb-14} L112 ${yb-14}" stroke="${COL.Y}" stroke-width="4.5"/></g>`;
  }
  return "";
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

<clipPath id="${id}c"><path d="${b.d}"/></clipPath><linearGradient id="${id}h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs>
<rect width="200" height="220" fill="url(#${id}s)"/>
<rect y="150" width="200" height="70" fill="#4d87a3"/>
${tm}
<g clip-path="url(#${id}c)">${fills}<rect x="${b.x0}" y="${b.y0}" width="${b.x1-b.x0}" height="${b.y1-b.y0}" fill="url(#${id}h)"/></g>
<path d="${b.d}" fill="none" stroke="#11161c" stroke-opacity=".45" stroke-width="1.4"/>
<path d="M0 182 Q25 177 50 182 T100 182 T150 182 T200 182 L200 220 L0 220 Z" fill="#2f6a87" fill-opacity=".94"/>
<path d="M0 196 Q25 191 50 196 T100 196 T150 196 T200 196" fill="none" stroke="#9cc7da" stroke-opacity=".35" stroke-width="1.2"/>

/* ================= STATE & PRACTICE ORDER ================= */
/* No calendar and no due dates. Each card has a level: 0 difficult, 1-2 learning, 3-4 mastered.
   How soon a card is offered again is counted in cards practised since, not in days, so nothing piles up while you're away. */
const LV_MAST=3, LV_TOP=4;
const GAP=[0,12,35,90,180];   // other cards practised before a card at this level is offered again
const REQUEUE=3;              // a difficult card comes back after this many other cards
const MAXREP=3;               // ...at most this many extra times in one round
const LSKEY="wk-drill-v1";
let S={cards:{},resetAt:0};      // id -> [level, 0, seen, right, difficult, updated]
let PREFS={decks:[],size:20,mode:"quiz",guide:false,rated:0,course:"rnli",ack:0};PREFS.decks=courseDecks("rnli");
/* the cards a round can draw on: Scenarios and Buoys modes use every card of their own, otherwise the chosen topics */
const PICMODES=["scen","spot"];
function poolIds(){if(PICMODES.includes(PREFS.mode))return CARDS.filter(c=>c.deck===PREFS.mode).map(c=>c.id);return CARDS.filter(c=>!PICMODES.includes(c.deck)&&PREFS.decks.includes(c.deck)).map(c=>c.id);}
function scopeCards(){return PICMODES.includes(PREFS.mode)?CARDS.filter(c=>c.deck===PREFS.mode):CARDS.filter(c=>courseDecks().includes(c.deck));}
let SES=null, VIEW="home", ANIM=null, CONFIRM=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* earlier versions stored a day-based box (0-6) and a due time; map those onto levels */
const OLD2LV=[0,1,2,2,3,4,4];
function migrateRec(r){const x=r.slice(0,6);x[0]=OLD2LV[Math.max(0,Math.min(6,x[0]|0))];x[1]=0;return x;}

/* ratings: "difficult" | "medium" | "easy". The quiz counts a right answer as medium and a wrong one as difficult. */
const RATES=["difficult","medium","easy"];
function nextLevel(prev,r){const l=prev?prev[0]:null;
  if(r==="difficult")return 0;
  if(r==="easy")return l===null?LV_MAST:Math.min(l+2,LV_TOP);
  return l===null?1:Math.max(l,Math.min(l+1,LV_MAST));}
function grade(id,r,now){
  if(r===true)r="medium";else if(r===false)r="difficult";
  const prev=S.cards[id];const s=prev?prev.slice():[0,0,0,0,0,0];
  s[0]=nextLevel(prev,r);s[1]=0;s[2]++;
  if(r==="difficult")s[4]++;else s[3]++;
  let top=0;for(const k in S.cards)if(S.cards[k][5]>top)top=S.cards[k][5];
  s[5]=Math.max(now,top+1);   // strictly after every earlier answer, so "cards practised since" is exact
  S.cards[id]=s;return s;
}
/* id -> how many other cards have been practised since this one */
function practiceOrder(){const ids=Object.keys(S.cards).sort((a,b)=>S.cards[b][5]-S.cards[a][5]);const m={};ids.forEach((id,i)=>m[id]=i);return m;}
function bucket(id,since){const s=S.cards[id];if(!s)return "new";if(s[0]===0)return "difficult";
  if(since[id]<GAP[s[0]])return "rest";return s[0]>=LV_MAST?"review":"learning";}
function weakness(id){const s=S.cards[id];if(!s)return 0;return (1+s[4])/(1+s[3])*(LV_TOP+1-s[0]);}
function deckStats(deckId){
  let total=0,nw=0,diff=0,mast=0,learn=0;
  for(const c of CARDS){if(c.deck!==deckId)continue;total++;const s=S.cards[c.id];
    if(!s){nw++;continue;} if(s[0]===0)diff++;else if(s[0]>=LV_MAST)mast++;else learn++;}
  return {total,nw,diff,mast,learn};
}
/* A round always has cards, whenever you open it:
   difficult ones first (up to 40%), then learning cards whose turn has come (30%), a few mastered ones so they stay fresh (15%),
   then new cards, then anything else, least recently seen first. */
function buildSession(mode){
  const pool=poolIds();
  const size=Math.min(PREFS.size,pool.length);if(!size)return [];
  const since=practiceOrder();const B={difficult:[],learning:[],review:[],"new":[],rest:[]};
  for(const id of pool)B[bucket(id,since)].push(id);
  const oldest=(a,b)=>S.cards[a][5]-S.cards[b][5];
  const ratio=id=>since[id]/Math.max(1,GAP[S.cards[id][0]]);
  B.difficult.sort((a,b)=>weakness(b)-weakness(a)||oldest(a,b));
  B.learning.sort((a,b)=>ratio(b)-ratio(a));B.review.sort((a,b)=>ratio(b)-ratio(a));
  B.rest.sort((a,b)=>ratio(b)-ratio(a)||oldest(a,b));B["new"]=shuffle(B["new"]);
  if(mode==="weak")return spread(B.difficult.slice(0,size));
  const q=[];const take=(arr,n)=>{while(arr.length&&q.length<size&&n-->0)q.push(arr.shift());};
  take(B.difficult,Math.ceil(size*.4));take(B.learning,Math.ceil(size*.3));take(B.review,Math.ceil(size*.15));
  take(B["new"],size);for(const k of ["difficult","learning","review","rest"])take(B[k],size);
  return spread(q);
}
function spread(q){q=shuffle(q);   // never open a round with the card you just saw
  if(q.length>1){let last=null;for(const id in S.cards)if(!last||S.cards[id][5]>S.cards[last][5])last=id;
    if(q[0]===last){const j=1+Math.floor(Math.random()*(q.length-1));[q[0],q[j]]=[q[j],q[0]];}}
  return q;}
function plan(){
  const pool=poolIds().map(id=>BYID[id]);const since=practiceOrder();
  let difficult=0,nw=0;for(const c of pool){const b=bucket(c.id,since);if(b==="difficult")difficult++;else if(b==="new")nw++;}
  const q=buildSession("normal");const round={difficult:0,"new":0,review:0};
  for(const id of q){const b=bucket(id,since);if(b==="difficult")round.difficult++;else if(b==="new")round["new"]++;else round.review++;}
  return {pool:pool.length,difficult,nw,round,n:q.length};
}

/* ================= PERSISTENCE ================= */
let docRef=null,saving=false,dirty=false,saveTimer=null,SYNC="device";
function loadLocal(){try{const r=localStorage.getItem(LSKEY);if(r){const o=JSON.parse(r);if(o&&o.cards){S={cards:{},resetAt:o.resetAt||0};const old=o.v!==2;for(const id in o.cards){const x=o.cards[id];if(BYID[id]&&Array.isArray(x)&&x.length>=6)S.cards[id]=old?migrateRec(x):x;}}if(o&&o.prefs){PREFS.decks=(o.prefs.decks||PREFS.decks).filter(d=>DECKS.some(x=>x.id===d));if([10,20,40].includes(o.prefs.size))PREFS.size=o.prefs.size;if(["quiz","cards","scen","spot"].includes(o.prefs.mode))PREFS.mode=o.prefs.mode;if(COURSES[o.prefs.course])PREFS.course=o.prefs.course;{const cd=courseDecks();PREFS.decks=PREFS.decks.filter(d=>cd.includes(d));}PREFS.guide=!!o.prefs.guide;PREFS.rated=Math.max(0,+o.prefs.rated||0);PREFS.ack=+o.prefs.ack||0;}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify({v:2,cards:S.cards,resetAt:S.resetAt,prefs:PREFS}));}catch(e){}}
function persist(){saveLocal();dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1500);}
async function flush(){
  if(!docRef||saving||!dirty)return;saving=true;dirty=false;
  try{await docRef.set({v:2,cards:S.cards,resetAt:S.resetAt,updated:Date.now()});SYNC="account";renderFoot();}
  catch(e){const c=e&&e.code;
    if(c==="unavailable"||c==="resource_exhausted"){dirty=true;}
    else{docRef=null;SYNC="device";renderFoot();}}
  saving=false;
  if(dirty&&docRef){clearTimeout(saveTimer);saveTimer=setTimeout(flush,5000);}
}
function merge(remote){
  let localNewer=false;
  const ra=remote.resetAt||0;
  if(ra>S.resetAt){S.resetAt=ra;for(const id in S.cards){if(S.cards[id][5]<ra)delete S.cards[id];}}
  const rc=remote.cards||{};const old=remote.v!==2;
  for(const id in rc){const r=rc[id];if(!Array.isArray(r)||r.length<6||!BYID[id]||r[5]<S.resetAt)continue;const l=S.cards[id];if(!l||r[5]>l[5])S.cards[id]=old?migrateRec(r):r.slice();}
  if(old&&Object.keys(S.cards).length)localNewer=true;   // rewrite the account copy in the new format
  for(const id in S.cards){const r=rc[id];if(!r||S.cards[id][5]>r[5])localNewer=true;}
  if((S.resetAt||0)>ra)localNewer=true;
  return localNewer;
}
async function connect(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    docRef=ref;
    let push=Object.keys(S.cards).length>0;
    if(snap.exists){push=merge(snap.data()||{});saveLocal();}
    SYNC="account";
    if(VIEW==="home")render();else renderFoot();
    if(push){dirty=true;flush();}
  }catch(e){}
}

let SHEET=null, SHEET_CONFIRM=false, SHEET_RETURN=null;
function openSheet(kind,returnSel){
  if(GATE)return;

  renderSheet();
  document.body.classList.add("sheet-open");
  const sh=document.getElementById("sheet");sh.setAttribute("aria-hidden","false");sh.removeAttribute("inert");
  document.getElementById("sheetBody").scrollTop=0;
  const target=document.querySelector('#sheetBody .pick[aria-checked="true"]');   // a choice list: start on the current choice
  setTimeout(()=>{try{(target||document.getElementById("sheetClose")).focus({preventScroll:true});}catch(e){}},40);
}
function closeSheet(){
  if(!SHEET)return;SHEET=null;
  document.body.classList.remove("sheet-open");
  const sh=document.getElementById("sheet");sh.setAttribute("aria-hidden","true");sh.setAttribute("inert","");
  if(VIEW==="home")renderHome();
  const back=SHEET_RETURN?(document.querySelector(SHEET_RETURN)||document.getElementById("revealBtn")||document.querySelector(".rate.medium")):null;

function renderSheet(){
  const t=document.getElementById("sheetTitle"),b=document.getElementById("sheetBody"),f=document.getElementById("sheetFoot");
  const keep=b.scrollTop;
  if(SHEET==="course"){t.textContent="Course";b.innerHTML=courseHTML();f.innerHTML="";wirePicks();}
  else if(SHEET==="size"){t.textContent="Cards per round";b.innerHTML=sizeHTML();f.innerHTML="";wirePicks();}
  else if(SHEET==="topics"){t.textContent="Topics";b.innerHTML=topicsHTML();f.innerHTML=`<button class="btn btn-filled" type="button" id="sheetDone">Done</button>`;wireTopics();}
  else if(SHEET==="progress"){t.textContent="Progress by topic";b.innerHTML=progressHTML();f.innerHTML="";wireProgress();}
  else if(SHEET==="about"){t.textContent="About this drill";b.innerHTML=aboutHTML();f.innerHTML="";wireAbout();}
  else if(SHEET==="guide"){t.textContent="How flashcards work";b.innerHTML=guideHTML();f.innerHTML=`<button class="btn btn-filled" type="button" id="sheetDone">Got it</button>`;}
  b.scrollTop=keep;
  const d=document.getElementById("sheetDone");if(d)d.onclick=closeSheet;

function progressHTML(){
  const ids=courseDecks().concat("scen","spot");let mast=0,learn=0,diff=0,seen=0,all=0;
  for(const c of CARDS){if(!ids.includes(c.deck))continue;all++;const s=S.cards[c.id];if(!s)continue;seen++;if(s[0]===0)diff++;else if(s[0]>=LV_MAST)mast++;else learn++;}
  const row=id=>{const d=DECKS.find(x=>x.id===id);const s=deckStats(id);const pc=x=>(s.total?x/s.total*100:0).toFixed(1);
    return `<div class="prow"><div class="ptop"><span><i class="dot" style="background:var(--c-${id})"></i>${esc(d.name)}</span><span class="pnum">${s.mast}/${s.total}</span></div><div class="pbar" aria-hidden="true"><i class="m" style="width:${pc(s.mast)}%"></i><i class="l" style="width:${pc(s.learn)}%"></i><i class="d" style="width:${pc(s.diff)}%"></i></div><small>${s.diff} difficult · ${s.nw} not seen</small></div>`;};
  let pr="";
  for(const sec of courseLayout()){pr+=`<p class="prog-h">${esc(sec.title)}</p>`;for(const g of sec.groups)for(const id of g.ids)pr+=row(id);}
  pr+=`<p class="prog-h">Scenarios and Buoys modes</p>`+row("scen")+row("spot");

    ?`<div class="confirm" role="alert"><p>Clear every card's history? This can't be undone.</p><div class="row"><button class="btn btn-text sm" type="button" id="noReset">Cancel</button><button class="btn danger sm" type="button" id="doReset">Reset</button></div></div>`

  return `<div class="pstats"><div><b>${mast}</b><span>mastered</span></div><div><b>${learn}</b><span>learning</span></div><div><b>${diff}</b><span>difficult</span></div><div><b>${all-seen}</b><span>not seen</span></div></div>
    <div class="legend"><span><i class="sw m"></i>Mastered</span><span><i class="sw l"></i>Learning</span><span><i class="sw d"></i>Difficult</span></div>
    ${pr}
    <div class="sgroup reset">${reset}</div>`;
}

  const nr=document.getElementById("noReset");if(nr)nr.onclick=()=>{SHEET_CONFIRM=false;renderSheet();try{document.getElementById("resetBtn").focus({preventScroll:true});}catch(e){}};

function aboutHTML(){
  const sync=SYNC==="account"?"Progress is saved to your account":"Progress is saved on this device";
  return `<div class="about">
    <p>An unofficial study aid for RNLI Task 4.1.2 (Watchkeeping) and RYA Day Skipper theory. It isn't RNLI or RYA course material: where it differs from your course book, go with the course book.</p>
    <h3>How this drill was made</h3>
    ${madeHTML()}
    <h3>Courses</h3>
    <p>Choose RNLI, Day Skipper or both in Settings. The collision regulations, buoyage and light pattern topics belong to both courses; inland waters is RNLI only.</p>
    <h3>RNLI Task 4.1.2</h3>
    <p>4.1.2 a: the collision regulations. Risk of collision (constant bearing, decreasing range); Rules 2, 5, 6, 7, 10 and 19; the steering and sailing rules; lights, shapes and sound signals; and power-driven vessel lights and aspect.</p>
    <p>4.1.2 b: IALA Region A buoyage (cardinal, lateral, preferred channel, special, isolated danger, safe water and emergency wreck marks, with their shapes, colours, topmarks and lights), and inland waterway marking under the European Code for Inland Waterways (CEVNI) as used in the Republic of Ireland.</p>
    <h3>RYA Day Skipper</h3>
    <p>The theory syllabus: boat terms, ropes and anchoring; charts, position and the compass; tides and tidal streams; weather and forecasts; safety and distress; pilotage, passage planning and fog; plus the collision regulations, buoyage and lights.</p>
    <h3>Scenarios</h3>
    <p>Situations you could meet on a lifeboat or skippering a yacht, drawn as a plot from above, the view ahead at night, a radar screen or fog. Read the picture and decide what to do.</p>
    <h3>Buoys</h3>
    <p>A quick picture drill: see a buoy and name the mark. Every IALA Region A mark turns up in each of its shapes: close up, from the bow at a distance, as a fixed beacon, and as a dark outline against a low sun, where only the topmark gives it away. The answer says what to look for, which side to pass, and a way to remember it.</p>
    <h3>UK and Irish waters</h3>
    <p>Both countries apply the same international collision regulations: the UK through Merchant Shipping Notice 1781, and Ireland through Statutory Instrument 507 of 2012. Both use IALA Region A buoyage.</p>
    <h3>How it works</h3>
    <p>Quiz, Scenarios and Buoys: pick the right answer from four options. Flashcards: think of the answer, tap the card to flip it, then rate it Easy, Medium or Difficult (swipe right, down or left, or use the buttons). All the modes share the same progress.</p>
    <p>There are no due dates, so practise whenever you like, for as long as you like. Anything you get wrong, or mark Difficult, comes back after three more cards, then near the start of your next rounds until you get it. Cards you get right step back a little each time, and mastered ones only turn up now and then so they stay fresh.</p>
    <p class="muted">${sync}. ${CARDS.length} cards in total.</p>
  </div>`;
}

function madeHTML(ai){return `<p>This drill was written from the published regulations and standards listed below. Each card was cross-checked against those rules, and every picture is drawn from code and tested automatically: buoy colours, shapes and topmarks against the IALA system, light timings against their published patterns, and the vessels, bearings and sides in each scenario against its question.</p>
  <p>Even so, it may contain mistakes. It hasn't been reviewed by an RNLI or RYA instructor, and it isn't official course material. Treat it as a practice partner rather than an authority: if anything looks wrong, or you're not sure, check it against the original source, your course book or your instructor, and go with them.</p>
  <h3 class="src">Sources</h3><ul class="srcs">${SOURCES.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>

function runNight(){
  const cur=SES&&SES.cur;if(!cur||!cur.nid)return;
  const seq=LSEQ[cur.lkey].s;const period=seq.reduce((s,x)=>s+x[1],0);const id=cur.nid;
  const cols=[...new Set(seq.filter(x=>x[0]).map(x=>x[0]))];
  const els={};cols.forEach(c=>els[c]=document.getElementById(id+"L"+c));const w=document.getElementById(id+"w");
  const token={start:performance.now()};ANIM=token;
  const rb=document.getElementById(id+"r");if(rb)rb.onclick=()=>{token.start=performance.now();};
  function frame(now){
    if(ANIM!==token)return;
    const t=Math.max(0,(now-token.start)/1000);let tt=t%period,on=null;
    for(const [c,d] of seq){if(tt<d){on=c;break;}tt-=d;}
    for(const c of cols){if(els[c])els[c].style.opacity=c===on?"1":"0";}
    if(w)w.textContent=t.toFixed(1)+" s";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* Before answering, the picture, question and all four options should be on screen together.
   Pictures shrink first, never below a size where their detail stays readable; then the text tightens in two steps. */
function fitQuiz(){
  const card=document.getElementById("card");if(!card||!card.getBoundingClientRect||!card.querySelectorAll)return;
  const opts=card.querySelectorAll(".opt");if(!opts.length)return;
  const figs=[...card.querySelectorAll(".fig")].map(f=>({f,s:f.querySelector("svg")})).filter(x=>x.s);
  const imgs=[...card.querySelectorAll(".optimg .img svg")];
  const ratio=sv=>{const v=sv.viewBox&&sv.viewBox.baseVal;return v&&v.height?v.width/v.height:1;};
  const size=(sv,h,box)=>{const w=h*ratio(sv);sv.style.height=h.toFixed(1)+"px";sv.style.width=w.toFixed(1)+"px";sv.style.margin="0 auto";if(box){box.style.width=w.toFixed(1)+"px";box.style.marginInline="auto";}};
  const clear=()=>{for(const {f,s:sv} of figs){f.style.width="";f.style.marginInline="";sv.style.height="";sv.style.width="";sv.style.margin="";}for(const sv of imgs){sv.style.height="";sv.style.width="";sv.style.margin="";}};
  const room=()=>window.innerHeight-8-(opts[opts.length-1].getBoundingClientRect().bottom+(window.scrollY||0));
  const levels=[[],["compact"],["compact","tight"]];if(window.innerHeight<620)levels.push(["compact","tight","tiny"]);   // the last step only on very short screens
  for(const lv of levels){
    card.classList.remove("compact","tight","tiny");lv.forEach(x=>card.classList.add(x));clear();
    let r=room();if(r>=0)return;
    const tiny=lv.includes("tiny");
    for(const {f,s:sv} of figs){const h=sv.getBoundingClientRect().height;const min=h*(f.classList.contains("nightf")?(tiny?.36:.42):f.classList.contains("solo")?(tiny?.4:.5):(tiny?.7:.76));const nh=Math.max(min,h+r);if(nh<h-1)size(sv,nh,f);r=room();if(r>=0)return;}
    if(imgs.length){const h=imgs[0].getBoundingClientRect().height;const rows=Math.ceil(imgs.length/2);const nh=Math.max(h*.55,h+r/rows);if(nh<h-1)imgs.forEach(sv=>size(sv,nh));r=room();if(r>=0)return;}
  }
}

function reveal(){const cur=SES&&SES.cur;if(!cur||cur.revealed)return;flip(true);}
function flip(focus){

/* for the first couple of cards ever, wiggle the card once so it's clear it can be swiped */
function maybeNudge(){
